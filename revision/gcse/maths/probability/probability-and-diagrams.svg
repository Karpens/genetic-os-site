<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><rect width="400" height="260" fill="#fff"/><text x="200" y="13" text-anchor="middle" font-size="12" font-weight="bold">0 ≤ P(event) ≤ 1</text><text x="20" y="28">impossible</text><text x="200" y="28" text-anchor="middle">even chance</text><text x="380" y="28" text-anchor="end">certain</text><path d="M20 38H380M20 32V44M200 32V44M380 32V44" stroke="#0E9F5D" stroke-width="3" fill="none"/><text x="20" y="58" text-anchor="middle">0</text><text x="200" y="58" text-anchor="middle">½</text><text x="380" y="58" text-anchor="middle">1</text><g stroke="#7C5CFF" stroke-width="2.5" fill="none"><path d="M30 155L120 115M30 155L120 195M120 115L220 95M120 115L220 135M120 195L220 175M120 195L220 215"/></g><circle cx="30" cy="155" r="4" fill="#7C5CFF"/><text x="8" y="175">Start</text><text x="60" y="128" text-anchor="end">½</text><text x="60" y="188" text-anchor="end">½</text><text x="165" y="96">½</text><text x="165" y="141">½</text><text x="165" y="175">½</text><text x="165" y="223">½</text><text x="108" y="110" text-anchor="end" font-weight="bold">H</text><text x="108" y="206" text-anchor="end" font-weight="bold">T</text><g font-size="11"><text x="228" y="99">HH ½×½=¼</text><text x="228" y="139">HT ½×½=¼</text><text x="228" y="179">TH ½×½=¼</text><text x="228" y="219">TT ½×½=¼</text></g><rect x="312" y="72" width="84" height="160" rx="6" fill="#FFF4DC" stroke="#E8A93A" stroke-width="2.5"/><g><text x="318" y="90" font-weight="bold">AND</text><text x="318" y="104">P(A and B)</text><text x="318" y="118">= P(A)×P(B)</text><text x="318" y="140" font-weight="bold">OR (excl.)</text><text x="318" y="154">P(A or B)</text><text x="318" y="168">= P(A)+P(B)</text><text x="318" y="190" font-weight="bold">NOT</text><text x="318" y="204">P(not A)</text><text x="318" y="218">= 1 − P(A)</text></g><text x="10" y="88" fill="#7C5CFF" font-weight="bold">Tree: × along</text><text x="10" y="101" fill="#7C5CFF" font-weight="bold">branches, + between</text><rect x="20" y="236" width="360" height="20" rx="6" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="200" y="250" text-anchor="middle">Relative frequency = successes ÷ total trials</text></svg>
