<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='14' y='20' font-weight='bold'>Area model: x² + 5x + 6</text><rect x='30' y='50' width='100' height='80' fill='#2FB5FF' fill-opacity='.25' stroke='#1D1A15'/><rect x='130' y='50' width='80' height='80' fill='#E8A93A' fill-opacity='.3' stroke='#1D1A15'/><rect x='30' y='130' width='100' height='50' fill='#E8A93A' fill-opacity='.3' stroke='#1D1A15'/><rect x='130' y='130' width='80' height='50' fill='#0E9F5D' fill-opacity='.25' stroke='#1D1A15'/><text x='80' y='95' text-anchor='middle'>x²</text><text x='170' y='95' text-anchor='middle'>3x</text><text x='80' y='159' text-anchor='middle'>2x</text><text x='170' y='159' text-anchor='middle'>6</text><text x='80' y='44' text-anchor='middle'>x</text><text x='170' y='44' text-anchor='middle'>3</text><text x='16' y='94' text-anchor='middle'>x</text><text x='16' y='159' text-anchor='middle'>2</text><text x='120' y='206' text-anchor='middle' font-weight='bold'>(x + 2)(x + 3)</text><text x='120' y='226' text-anchor='middle'>= x² + 5x + 6</text><text x='232' y='50' font-size='11' font-weight='bold'>Factorising x² + bx + c</text><text x='232' y='68' font-size='11'>Need two numbers that</text><text x='232' y='84' font-size='11'>multiply to give c (6)</text><text x='232' y='100' font-size='11'>add to give b (5)</text><text x='232' y='116' font-size='11'>2 × 3 = 6 and 2 + 3 = 5</text><path d='M232 130H392' stroke='#7C5CFF'/><text x='232' y='148' font-size='11' font-weight='bold'>Difference of two squares</text><text x='232' y='166' font-size='11'>a² − b² = (a − b)(a + b)</text><text x='232' y='182' font-size='11'>x² − 16 = (x − 4)(x + 4)</text><text x='232' y='198' font-size='11'>4x² − 9 = (2x − 3)(2x + 3)</text><text x='232' y='220' font-size='11'>Always check by expanding</text></svg>
