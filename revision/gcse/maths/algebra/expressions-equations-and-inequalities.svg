<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 340'><g font-family='sans-serif' font-size='12' fill='#1D1A15'><rect x='4' y='4' width='193' height='126' rx='8' fill='#E7F7EF' stroke='#0E9F5D' stroke-width='2'/><rect x='203' y='4' width='193' height='126' rx='8' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><rect x='4' y='135' width='193' height='115' rx='8' fill='#FDF3DF' stroke='#E8A93A' stroke-width='2'/><rect x='203' y='135' width='193' height='115' rx='8' fill='#F0EBFF' stroke='#7C5CFF' stroke-width='2'/><rect x='4' y='255' width='392' height='82' rx='8' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><text x='12' y='22' font-weight='bold'>1 Expand (x+2)(x+3)</text><text x='65' y='44' text-anchor='middle'>x</text><text x='112' y='44' text-anchor='middle'>+3</text><text x='34' y='67' text-anchor='end'>x</text><text x='34' y='97' text-anchor='end'>+2</text><g fill='#fff' stroke='#0E9F5D' stroke-width='2'><rect x='40' y='48' width='50' height='30'/><rect x='90' y='48' width='44' height='30'/><rect x='40' y='78' width='50' height='30'/><rect x='90' y='78' width='44' height='30'/></g><text x='65' y='67' text-anchor='middle'>x²</text><text x='112' y='67' text-anchor='middle'>3x</text><text x='65' y='97' text-anchor='middle'>2x</text><text x='112' y='97' text-anchor='middle'>6</text><text x='140' y='66'>3x+2x=5x</text><text x='140' y='92' font-weight='bold' fill='#0E9F5D'>x²+5x+6</text><text x='12' y='124' font-size='11'>multiply every term (FOIL)</text><text x='211' y='22' font-weight='bold'>2 Factorise x²+5x+6</text><text x='211' y='44'>find 2 numbers that:</text><text x='217' y='60'>multiply to 6: 2×3</text><text x='217' y='76'>add to 5: 2+3</text><text x='211' y='94' font-weight='bold'>→ (x+2)(x+3)</text><text x='211' y='112' font-size='11'>HCF: 6x+9 = 3(2x+3)</text><text x='12' y='153' font-weight='bold'>3 Solve: same on both sides</text><text x='14' y='180'>3x + 2 = 17</text><path d='M30 184V196' stroke='#E8A93A' stroke-width='3' fill='none'/><polygon points='25,194 35,194 30,201' fill='#E8A93A'/><text x='42' y='196' font-size='11'>−2 both sides</text><text x='14' y='211'>3x = 15</text><path d='M30 216V228' stroke='#E8A93A' stroke-width='3' fill='none'/><polygon points='25,226 35,226 30,233' fill='#E8A93A'/><text x='42' y='227' font-size='11'>÷3 both sides</text><text x='14' y='245' font-weight='bold' fill='#0E9F5D'>x = 5</text><g font-size='11'><text x='130' y='200'>x on both</text><text x='130' y='214'>sides?</text><text x='130' y='228'>Collect x</text><text x='130' y='242'>terms first</text></g><text x='211' y='153' font-weight='bold'>4 Quadratic formula</text><text x='211' y='176'>ax² + bx + c = 0</text><text x='211' y='208'>x =</text><text x='240' y='200'>−b ± √(b² − 4ac)</text><path d='M236 206H358' stroke='#7C5CFF' stroke-width='3'/><text x='297' y='224' text-anchor='middle'>2a</text><text x='211' y='243' font-size='11'>use if it won't factorise</text><text x='12' y='272' font-weight='bold'>5 Inequalities: flip sign if × or ÷ by negative</text><text x='12' y='290'>−2x &lt; 6  → ÷(−2) →  x &gt; −3  (sign flips!)</text><path d='M40 306H360' stroke='#1D1A15' stroke-width='2'/><g stroke='#1D1A15' stroke-width='2'><path d='M120 301V311'/><path d='M160 301V311'/><path d='M200 301V311'/><path d='M240 301V311'/><path d='M280 301V311'/></g><path d='M165 306H346' stroke='#FF5D8F' stroke-width='3'/><polygon points='345,299 358,306 345,313' fill='#FF5D8F'/><circle cx='160' cy='306' r='5' fill='#fff' stroke='#FF5D8F' stroke-width='3'/><g font-size='11' text-anchor='middle'><text x='120' y='326'>−4</text><text x='160' y='326'>−3</text><text x='200' y='326'>−2</text><text x='240' y='326'>−1</text><text x='280' y='326'>0</text></g></g></svg>
