<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 322'><rect width='400' height='322' fill='#fff'/><g fill='none' stroke='#1D1A15' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 65H125'/><path d='M68 65L50 25' stroke='#FF5D8F'/><path d='M200 45L232 25M200 45L168 30M200 45L205 77' stroke='#2FB5FF'/><path d='M285 25L380 75M285 75L380 25' stroke='#7C5CFF'/><path d='M10 125H190M10 165H190' stroke='#2FB5FF'/><path d='M172 120l6 5-6 5M172 160l6 5-6 5'/><path d='M66 107L126 183' stroke='#FF5D8F'/><path d='M235 112V170H325Z' fill='#E3F6EC' stroke='#0E9F5D'/><path d='M235 158H247V170'/><path d='M60 236L94 261L81 301H39L26 261Z' fill='#E3F6EC' stroke='#0E9F5D'/><path d='M60 236L81 301M60 236L39 301' stroke='#7C5CFF' stroke-dasharray='4 3'/><path d='M81 301H112' stroke='#FF5D8F'/><circle cx='275' cy='270' r='34' fill='#EEEAFF' stroke='#7C5CFF'/><path d='M241 270H309L292 240.6Z' stroke='#0E9F5D'/><path d='M275 270V304' stroke-dasharray='4 3'/></g><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='50' y='60'>a</text><text x='88' y='52'>b</text><text x='68' y='88' text-anchor='middle'>a + b = 180°</text><text x='68' y='100' text-anchor='middle'>Angles on a line</text><text x='200' y='32' text-anchor='middle'>a</text><text x='174' y='62'>b</text><text x='222' y='62'>c</text><text x='200' y='88' text-anchor='middle'>a + b + c = 360°</text><text x='200' y='100' text-anchor='middle'>Around a point</text><text x='332' y='38' text-anchor='middle'>x</text><text x='332' y='68' text-anchor='middle'>x</text><text x='302' y='54'>y</text><text x='360' y='54'>y</text><text x='332' y='88' text-anchor='middle'>x = x, y = y</text><text x='332' y='100' text-anchor='middle'>Vertically opposite</text><text x='88' y='119'>a</text><text x='62' y='142'>a</text><text x='99' y='142'>180° − a</text><text x='116' y='159'>a</text><text x='10' y='196'>Corresponding (F): equal</text><text x='10' y='208'>Alternate (Z): equal</text><text x='10' y='220'>Co-interior (C): sum 180°</text><text x='222' y='145'>a</text><text x='278' y='185'>b</text><text x='290' y='138'>c (hypotenuse)</text><text x='300' y='198' text-anchor='middle' font-size='13' font-weight='bold'>a² + b² = c²</text><text x='300' y='212' text-anchor='middle'>6² + 8² = 10²</text><text x='118' y='244'>Interior sum:</text><text x='118' y='257'>(n − 2) × 180°</text><text x='118' y='270'>n=5: 3×180 = 540°</text><text x='118' y='288'>Regular exterior</text><text x='118' y='301'>360° ÷ n = 72°</text><text x='100' y='290' fill='#FF5D8F'>e</text><text x='279' y='294'>r</text><text x='297' y='233'>90°</text><text x='322' y='252'>C = 2πr</text><text x='322' y='267'>A = πr²</text><text x='322' y='282'>r=3: A=9π</text><text x='305' y='317' text-anchor='middle'>Angle in a semicircle = 90°</text></g></svg>
