<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 275"><rect width="400" height="275" fill="#fff"/><g font-family="sans-serif" font-size="12" fill="#1D1A15"><text x="10" y="18" font-size="13" font-weight="bold">Averages (ordered data)</text><g stroke="#1D1A15" stroke-width="2" fill="#fff"><rect x="12" y="28" width="30" height="24"/><rect x="42" y="28" width="30" height="24"/><rect x="72" y="28" width="30" height="24" fill="#FBE3B0" stroke="#E8A93A"/><rect x="102" y="28" width="30" height="24" fill="#D6F0FF" stroke="#2FB5FF"/><rect x="132" y="28" width="30" height="24"/></g><text x="27" y="45" text-anchor="middle">3</text><text x="57" y="45" text-anchor="middle">6</text><text x="87" y="45" text-anchor="middle">9</text><text x="117" y="45" text-anchor="middle">9</text><text x="147" y="45" text-anchor="middle">12</text><text x="87" y="66" text-anchor="middle" font-size="11" fill="#E8A93A">middle</text><text x="10" y="92">Mean = total ÷ number</text><text x="22" y="108">= 39 ÷ 5 = 7.8</text><text x="10" y="128">Median = middle = 9</text><text x="10" y="146">Mode = most common = 9</text><text x="10" y="164">Range = 12 − 3 = 9</text><path d="M10 174H196" stroke="#0E9F5D" stroke-width="2"/><text x="10" y="190">Grouped: mean ≈ Σfx ÷ Σf</text><text x="10" y="206" font-size="11">(x = class midpoint)</text><path d="M206 8V208" stroke="#7C5CFF" stroke-width="2"/><text x="225" y="18" font-size="13" font-weight="bold">Scatter graph</text><path d="M228 28V170H388" fill="none" stroke="#1D1A15" stroke-width="2"/><text x="308" y="188" text-anchor="middle" font-size="11">Hours revising</text><text transform="translate(218 100) rotate(-90)" text-anchor="middle" font-size="11">Test score</text><g fill="#7C5CFF"><circle cx="242" cy="150" r="3"/><circle cx="256" cy="138" r="3"/><circle cx="268" cy="142" r="3"/><circle cx="282" cy="118" r="3"/><circle cx="296" cy="112" r="3"/><circle cx="310" cy="100" r="3"/><circle cx="324" cy="92" r="3"/><circle cx="338" cy="82" r="3"/><circle cx="348" cy="78" r="3"/></g><path d="M234 154L352 72" stroke="#0E9F5D" stroke-width="3" fill="none"/><path d="M352 72L384 50" stroke="#FF5D8F" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/><text x="392" y="40" text-anchor="end" font-size="11" fill="#FF5D8F">extrapolate = unreliable</text><path d="M292 146H312" stroke="#0E9F5D" stroke-width="3"/><text x="316" y="150" font-size="11">best fit</text><text x="308" y="204" text-anchor="middle" font-size="11">Positive correlation</text><rect x="10" y="214" width="380" height="24" rx="5" fill="#FDF3DD" stroke="#E8A93A" stroke-width="2"/><text x="200" y="230" text-anchor="middle">Correlation ≠ causation: a third factor may explain</text><text x="10" y="254" font-size="11">Bar &amp; pie charts: categories. Histogram: frequency density.</text><text x="10" y="268" font-size="11">Box plot: median and quartiles.</text></g></svg>
