<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 324'><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='240' y='14' font-weight='bold' font-size='12'>Production methods</text><rect x='8' y='22' width='150' height='50' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='83' y='37' font-weight='bold'>Job</text><text x='83' y='51'>one-off, unique</text><text x='83' y='65'>e.g. wedding dress</text><rect x='165' y='22' width='150' height='50' rx='6' fill='#FFF4DC' stroke='#E8A93A' stroke-width='2'/><text x='240' y='37' font-weight='bold'>Batch</text><text x='240' y='51'>groups of similar items</text><text x='240' y='65'>e.g. bread loaves</text><rect x='322' y='22' width='150' height='50' rx='6' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='397' y='37' font-weight='bold'>Flow</text><text x='397' y='51'>continuous, standardised</text><text x='397' y='65'>e.g. car assembly line</text><path d='M8 84H468M460 79L468 84L460 89' fill='none' stroke='#7C5CFF' stroke-width='2'/><text x='240' y='100'>more standardised, higher volume, lower cost per unit</text><text x='78' y='118' font-weight='bold' font-size='12'>Quality</text><text x='240' y='118' font-weight='bold' font-size='12'>Maslow</text><text x='397' y='118' font-weight='bold' font-size='12'>Structure</text><rect x='8' y='124' width='140' height='32' rx='6' fill='#FFF4DC' stroke='#E8A93A' stroke-width='2'/><text x='78' y='138'>Control: inspect</text><text x='78' y='151'>finished output</text><rect x='8' y='164' width='140' height='32' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='78' y='178'>Assurance: build</text><text x='78' y='191'>quality in every stage</text><text x='78' y='211'>Fewer returns,</text><text x='78' y='224'>stronger reputation</text><rect x='195' y='124' width='90' height='16' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='240' y='136'>Fulfilment</text><rect x='187' y='140' width='106' height='16' fill='#FFE8F0' stroke='#FF5D8F' stroke-width='2'/><text x='240' y='152'>Esteem</text><rect x='180' y='156' width='120' height='16' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='240' y='168'>Social</text><rect x='172' y='172' width='136' height='16' fill='#FFF4DC' stroke='#E8A93A' stroke-width='2'/><text x='240' y='184'>Safety</text><rect x='165' y='188' width='150' height='16' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='240' y='200'>Physical</text><text x='240' y='219'>Top = full potential</text><g fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'><rect x='340' y='124' width='30' height='12'/><rect x='340' y='140' width='30' height='12'/><rect x='340' y='156' width='30' height='12'/><rect x='340' y='172' width='30' height='12'/></g><path d='M355 136V140M355 152V156M355 168V172M426 136L394 156M426 136V156M426 136L458 156' fill='none' stroke='#1D1A15' stroke-width='2'/><g fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'><rect x='406' y='124' width='40' height='12'/><rect x='380' y='156' width='28' height='12'/><rect x='412' y='156' width='28' height='12'/><rect x='444' y='156' width='28' height='12'/></g><text x='355' y='200'>Tall</text><text x='426' y='200'>Flat</text><text x='397' y='216'>span = staff per manager</text><text x='240' y='244' font-weight='bold' font-size='12'>Recruitment and training</text><g fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'><rect x='8' y='250' width='84' height='32' rx='5'/><rect x='104' y='250' width='84' height='32' rx='5'/><rect x='200' y='250' width='84' height='32' rx='5'/><rect x='296' y='250' width='84' height='32' rx='5'/><rect x='392' y='250' width='84' height='32' rx='5'/></g><path d='M92 266H103M188 266H199M284 266H295M380 266H391' stroke='#1D1A15' stroke-width='2'/><text x='50' y='263'>Job</text><text x='50' y='276'>description</text><text x='146' y='263'>Person</text><text x='146' y='276'>specification</text><text x='242' y='263'>Advertise</text><text x='242' y='276'>inside/outside</text><text x='338' y='263'>Interview</text><text x='338' y='276'>and select</text><text x='434' y='263'>Induction and</text><text x='434' y='276'>training</text><text x='240' y='304'>Stock: just-in-time cuts holding costs but needs reliable suppliers</text><text x='240' y='319'>Motivation: pay, bonus (financial); rotation, enrichment, praise</text></g></svg>
