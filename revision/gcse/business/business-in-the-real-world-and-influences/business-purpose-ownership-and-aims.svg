<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#1D1A15"/></marker></defs><g font-family="sans-serif" font-size="11" fill="#1D1A15"><rect x="90" y="4" width="220" height="38" rx="8" fill="#FFF3DC" stroke="#E8A93A" stroke-width="2.5"/><text x="200" y="20" text-anchor="middle" font-size="13" font-weight="bold">BUSINESS (entrepreneur takes risk)</text><text x="200" y="35" text-anchor="middle">goods &amp; services → profit or social aims</text><path d="M140 42 L100 56" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M260 42 L300 56" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="6" y="58" width="188" height="134" rx="8" fill="#F4F0FF" stroke="#7C5CFF" stroke-width="2.5"/><text x="100" y="73" text-anchor="middle" font-weight="bold" font-size="12">Ownership: who is liable?</text><rect x="12" y="80" width="176" height="44" rx="5" fill="#FFE8F0" stroke="#FF5D8F" stroke-width="2"/><text x="100" y="94" text-anchor="middle" font-weight="bold">Unlimited liability</text><text x="100" y="107" text-anchor="middle">Sole trader, partnership</text><text x="100" y="119" text-anchor="middle">Owner's own assets at risk</text><rect x="12" y="128" width="176" height="44" rx="5" fill="#E3F6EC" stroke="#0E9F5D" stroke-width="2"/><text x="100" y="142" text-anchor="middle" font-weight="bold">Limited liability</text><text x="100" y="155" text-anchor="middle">Private Ltd, public PLC</text><text x="100" y="167" text-anchor="middle">Debts separate from owner</text><text x="100" y="186" text-anchor="middle">Also: franchise, not-for-profit</text><rect x="206" y="58" width="188" height="134" rx="8" fill="#E6F5FF" stroke="#2FB5FF" stroke-width="2.5"/><text x="300" y="73" text-anchor="middle" font-weight="bold" font-size="12">Business aims</text><text x="222" y="95">• Survival (start-up)</text><text x="222" y="113">• Profit maximisation</text><text x="222" y="131">• Growth</text><text x="222" y="149">• Market share</text><text x="222" y="167">• Customer satisfaction</text><text x="222" y="185">• Social / ethical aims</text><rect x="6" y="198" width="388" height="58" rx="8" fill="#FFFFFF" stroke="#E8A93A" stroke-width="2.5"/><text x="200" y="211" text-anchor="middle" font-weight="bold">Stakeholders</text><g fill="#FFF3DC" stroke="#E8A93A" stroke-width="1.5"><rect x="10" y="216" width="62" height="18" rx="4"/><rect x="74" y="216" width="62" height="18" rx="4"/><rect x="138" y="216" width="62" height="18" rx="4"/><rect x="202" y="216" width="62" height="18" rx="4"/><rect x="266" y="216" width="62" height="18" rx="4"/><rect x="330" y="216" width="60" height="18" rx="4"/></g><g text-anchor="middle"><text x="41" y="229">Owners</text><text x="105" y="229">Employees</text><text x="169" y="229">Customers</text><text x="233" y="229">Suppliers</text><text x="297" y="229">Government</text><text x="360" y="229">Community</text><text x="200" y="249">Conflict: owners want profit, staff want higher pay</text></g></g></svg>
