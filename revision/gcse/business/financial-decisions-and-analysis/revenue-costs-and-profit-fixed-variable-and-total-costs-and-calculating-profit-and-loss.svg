<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><rect x='10' y='20' width='120' height='50' rx='6' fill='#FFF4DE' stroke='#E8A93A' stroke-width='2'/><text x='70' y='42' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Fixed costs</text><text x='70' y='58' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>rent, salaries</text><rect x='10' y='100' width='120' height='50' rx='6' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='70' y='122' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Variable costs</text><text x='70' y='138' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>materials, packaging</text><rect x='160' y='55' width='100' height='60' rx='6' fill='#F1ECFF' stroke='#7C5CFF' stroke-width='2'/><text x='210' y='82' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Total costs</text><text x='210' y='100' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>FC + VC</text><rect x='160' y='160' width='100' height='60' rx='6' fill='#E7F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='210' y='187' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Revenue</text><text x='210' y='204' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>price × quantity</text><rect x='290' y='100' width='100' height='70' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><text x='340' y='124' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Profit / loss</text><text x='340' y='143' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Revenue −</text><text x='340' y='158' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>total costs</text><path d='M130 45 L158 68' stroke='#1D1A15' stroke-width='1.5' fill='none' marker-end='url(#a)'/><path d='M130 125 L158 102' stroke='#1D1A15' stroke-width='1.5' fill='none' marker-end='url(#a)'/><path d='M260 90 L288 116' stroke='#1D1A15' stroke-width='1.5' fill='none' marker-end='url(#a)'/><path d='M260 190 L288 154' stroke='#1D1A15' stroke-width='1.5' fill='none' marker-end='url(#a)'/><text x='200' y='245' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Profit = revenue − total costs (negative = loss)</text></svg>
