<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0,0L10,5L0,10z' fill='#1D1A15'/></marker><marker id='b' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0L10,5L0,10z' fill='#FF5D8F'/></marker></defs><rect x='2' y='2' width='396' height='128' rx='6' fill='#EAF7FF'/><rect x='2' y='134' width='396' height='80' rx='6' fill='#FFF4DC'/><rect x='2' y='218' width='396' height='40' rx='6' fill='#F1ECFF'/><text x='10' y='16' font-size='12' font-weight='bold'>Transverse: oscillation at 90° to energy transfer</text><path d='M70,70Q100,30 130,70T190,70T250,70T310,70' fill='none' stroke='#2FB5FF' stroke-width='3'/><path d='M70,70H315' fill='none' stroke='#1D1A15' stroke-width='2' stroke-dasharray='4 3'/><path d='M100,69V53' fill='none' stroke='#1D1A15' stroke-width='2' marker-start='url(#a)' marker-end='url(#a)'/><text x='10' y='64'>amplitude</text><path d='M100,38H220' fill='none' stroke='#1D1A15' stroke-width='2' marker-start='url(#a)' marker-end='url(#a)'/><path d='M100,38V48M220,38V48' fill='none' stroke='#1D1A15' stroke-width='2' stroke-dasharray='2 2'/><text x='160' y='33' text-anchor='middle'>wavelength λ</text><path d='M355,50V90' fill='none' stroke='#1D1A15' stroke-width='2' marker-start='url(#a)' marker-end='url(#a)'/><text x='322' y='104'>oscillation</text><text x='10' y='92'>e.g. light,</text><text x='10' y='104'>ripples</text><path d='M70,118H190' fill='none' stroke='#FF5D8F' stroke-width='3' marker-end='url(#b)'/><text x='198' y='122'>energy transfer</text><text x='10' y='148' font-size='12' font-weight='bold'>Longitudinal: oscillation parallel to energy transfer</text><text x='150' y='163' text-anchor='middle'>λ</text><path d='M90,168H210' fill='none' stroke='#1D1A15' stroke-width='2' marker-start='url(#a)' marker-end='url(#a)'/><path d='M81,174V194M87,174V194M93,174V194M99,174V194M120,174V194M150,174V194M180,174V194M201,174V194M207,174V194M213,174V194M219,174V194M240,174V194M270,174V194M300,174V194M321,174V194M327,174V194M333,174V194M339,174V194' fill='none' stroke='#7C5CFF' stroke-width='2.5'/><text x='10' y='188'>e.g. sound</text><text x='90' y='207' text-anchor='middle'>compression</text><text x='150' y='207' text-anchor='middle'>rarefaction</text><text x='210' y='207' text-anchor='middle'>compression</text><path d='M350,184H392' fill='none' stroke='#FF5D8F' stroke-width='3' marker-end='url(#b)'/><text x='350' y='174'>energy</text><text x='10' y='231' font-weight='bold'>v = f × λ  (m/s = Hz × m)      T = 1 ÷ f</text><text x='10' y='243'>Bigger amplitude = more energy; f in hertz (Hz)</text><text x='10' y='255'>At a boundary: reflected, refracted, transmitted, absorbed</text></svg>
