<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 300' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='440' height='300' fill='#fff'/><text x='220' y='18' text-anchor='middle' font-size='13' font-weight='bold'>Heating curve: changes of state</text><path d='M50 190V35M50 190H420' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M45 43L50 33L55 43M412 185L421 190L412 195' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M50 175L110 140M170 140L230 85M320 85L390 50' fill='none' stroke='#2FB5FF' stroke-width='3'/><path d='M110 140H170M230 85H320' fill='none' stroke='#FF5D8F' stroke-width='3'/><text transform='translate(16 115) rotate(-90)' text-anchor='middle'>Temperature</text><text x='235' y='207' text-anchor='middle'>Energy supplied (heating time)</text><text x='55' y='128'>solid</text><text x='140' y='156' text-anchor='middle'>melting</text><text x='140' y='170' text-anchor='middle'>(solid + liquid)</text><text x='205' y='140'>liquid</text><text x='275' y='73' text-anchor='middle'>boiling</text><text x='275' y='102' text-anchor='middle'>(liquid + gas)</text><text x='350' y='95'>gas</text><text x='330' y='140' text-anchor='middle'>Flat parts: energy changes</text><text x='330' y='153' text-anchor='middle'>state, temperature constant</text><rect x='10' y='222' width='205' height='68' rx='6' fill='#E7F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='20' y='238' font-weight='bold'>Density: ρ = m ÷ V</text><text x='20' y='253'>unit kg/m³ (or g/cm³)</text><text x='20' y='268'>irregular solid: use displacement</text><text x='20' y='283'>to find the volume</text><rect x='225' y='222' width='205' height='68' rx='6' fill='#FFF1F6' stroke='#FF5D8F' stroke-width='2'/><text x='235' y='238' font-weight='bold'>Latent heat: E = m × L</text><text x='235' y='253'>L in J/kg: fusion = melting,</text><text x='235' y='268'>vaporisation = boiling</text><text x='235' y='283'>Physical change: mass conserved</text></svg>
