<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-size='14' font-weight='bold'>Distance vs displacement</text><path d='M60 140 C 100 60, 300 60, 340 140' fill='none' stroke='#E8A93A' stroke-width='3' stroke-dasharray='6 4'/><text x='200' y='66' text-anchor='middle'>Path taken = distance (scalar)</text><line x1='60' y1='140' x2='330' y2='140' stroke='#0E9F5D' stroke-width='3'/><polygon points='342,140 330,134 330,146' fill='#0E9F5D'/><circle cx='60' cy='140' r='5' fill='#7C5CFF'/><circle cx='340' cy='140' r='5' fill='#7C5CFF'/><text x='60' y='160' text-anchor='middle'>A start</text><text x='340' y='160' text-anchor='middle'>B end</text><text x='200' y='132' text-anchor='middle'>Displacement (vector)</text><rect x='30' y='178' width='340' height='72' rx='8' fill='#F3EEFF' stroke='#7C5CFF'/><text x='45' y='198' font-size='13'>speed = distance ÷ time (m/s)</text><text x='45' y='218' font-size='13'>velocity = displacement ÷ time (m/s)</text><text x='45' y='238' font-size='13'>a = (v − u) ÷ t (m/s²)</text></svg>
