<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-size='14' font-weight='bold'>Charging by friction</text><text x='20' y='44'>While rubbing</text><rect x='30' y='55' width='110' height='40' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='85' y='79' text-anchor='middle'>Cloth</text><rect x='250' y='55' width='120' height='40' fill='#DDF1FF' stroke='#2FB5FF' stroke-width='2'/><text x='310' y='79' text-anchor='middle'>Polythene rod</text><text x='195' y='72' text-anchor='middle'>electrons move</text><line x1='148' y1='84' x2='236' y2='84' stroke='#7C5CFF' stroke-width='2'/><polygon points='246,84 236,79 236,89' fill='#7C5CFF'/><text x='20' y='125'>After rubbing</text><rect x='30' y='135' width='110' height='40' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='85' y='161' text-anchor='middle' fill='#FF5D8F' font-size='16' font-weight='bold'>+ + + +</text><rect x='250' y='135' width='120' height='40' fill='#DDF1FF' stroke='#2FB5FF' stroke-width='2'/><text x='310' y='161' text-anchor='middle' fill='#2FB5FF' font-size='16' font-weight='bold'>− − − −</text><text x='85' y='198' text-anchor='middle'>Cloth lost electrons:</text><text x='85' y='214' text-anchor='middle'>net positive</text><text x='310' y='198' text-anchor='middle'>Rod gained electrons:</text><text x='310' y='214' text-anchor='middle'>net negative</text><text x='200' y='247' text-anchor='middle' font-size='11'>Only electrons move; protons stay fixed. Charge is conserved.</text></svg>
