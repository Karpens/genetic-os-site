<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 440 325' font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='90' y='28' text-anchor='middle' font-size='12' font-weight='bold'>Atom ≈ 1×10⁻¹⁰ m across</text><circle cx='85' cy='100' r='26' fill='none' stroke='#7C5CFF' stroke-width='2'/><circle cx='85' cy='100' r='48' fill='none' stroke='#7C5CFF' stroke-width='2'/><circle cx='85' cy='100' r='11' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><circle cx='81' cy='96' r='3.5' fill='#FF5D8F'/><circle cx='89' cy='96' r='3.5' fill='#2FB5FF'/><circle cx='81' cy='104' r='3.5' fill='#2FB5FF'/><circle cx='89' cy='104' r='3.5' fill='#FF5D8F'/><g fill='#E8A93A' stroke='#1D1A15' stroke-width='1.5'><circle cx='111' cy='100' r='4'/><circle cx='59' cy='100' r='4'/><circle cx='85' cy='52' r='4'/><circle cx='133' cy='100' r='4'/><circle cx='51' cy='134' r='4'/></g><text x='10' y='170'>Nucleus ≈ 1×10⁻¹⁴ m</text><circle cx='16' cy='183' r='4' fill='#FF5D8F'/><text x='24' y='187'>proton</text><circle cx='80' cy='183' r='4' fill='#2FB5FF'/><text x='88' y='187'>neutron</text><circle cx='16' cy='199' r='4' fill='#E8A93A' stroke='#1D1A15' stroke-width='1.5'/><text x='24' y='203'>electron in energy level</text><text x='320' y='30' text-anchor='middle' font-size='12' font-weight='bold'>Penetrating power</text><rect x='205' y='48' width='14' height='117' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><path d='M265 48V165' stroke='#2FB5FF' stroke-width='3' fill='none'/><rect x='325' y='48' width='8' height='117' fill='#D6F0FF' stroke='#2FB5FF' stroke-width='2'/><rect x='392' y='48' width='16' height='117' fill='#E4DCFF' stroke='#7C5CFF' stroke-width='2'/><g fill='none' stroke-width='3'><path d='M225 72H259M252 66L259 72L252 78' stroke='#FF5D8F'/><path d='M225 112H321M314 106L321 112L314 118' stroke='#0E9F5D'/><path d='M225 152H387M380 146L387 152L380 158' stroke='#7C5CFF'/></g><g font-weight='bold'><text x='228' y='64'>α</text><text x='228' y='104'>β</text><text x='228' y='144'>γ</text></g><g text-anchor='middle'><text x='212' y='182'>source</text><text x='265' y='182'>paper</text><text x='329' y='182'>few mm Al</text><text x='400' y='182'>thick lead</text><text x='400' y='196'>or concrete</text></g><text x='225' y='214'>α  He nucleus: highly ionising</text><text x='225' y='228'>β  fast electron</text><text x='225' y='242'>γ  EM wave: weakly ionising</text><text x='10' y='226' font-weight='bold'>Half-life: nuclei remaining</text><path d='M40 230V292H185' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M40 261H80V292M40 276.5H120V292M40 284.3H160V292' fill='none' stroke='#E8A93A' stroke-width='2' stroke-dasharray='4 3'/><polyline points='40,230 60,248 80,261 100,270 120,276.5 140,281 160,284 180,286.5' fill='none' stroke='#0E9F5D' stroke-width='3'/><g text-anchor='end'><text x='35' y='234'>N₀</text><text x='35' y='265'>½</text><text x='35' y='280'>¼</text></g><g text-anchor='middle'><text x='40' y='305'>0</text><text x='80' y='305'>1</text><text x='120' y='305'>2</text><text x='160' y='305'>3</text><text x='110' y='319'>Time (half-lives)</text></g><text x='225' y='266'>Isotopes: same protons,</text><text x='225' y='280'>different neutrons.</text><text x='225' y='300'>Decay is random.</text><text x='225' y='314'>3 half-lives: ½×½×½ = ⅛</text></svg>
