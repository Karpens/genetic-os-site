<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><path d='M35 28V125H185' fill='none' stroke='#1D1A15' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><path d='M35 125L85 60H165V125Z' fill='#2FB5FF' fill-opacity='.2' stroke='none'/><path d='M35 125L85 60H165' fill='none' stroke='#2FB5FF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M213 55H246M239 49L246 55L239 61' fill='none' stroke='#0E9F5D' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><path d='M314 55H362M355 49L362 55L355 61' fill='none' stroke='#FF5D8F' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/><rect x='250' y='40' width='60' height='30' rx='4' fill='#E8A93A' fill-opacity='.25' stroke='#E8A93A' stroke-width='2.5'/><path d='M10 165H390' stroke='#1D1A15' stroke-width='2' opacity='.3'/><rect x='20' y='185' width='80' height='28' fill='#E8A93A' fill-opacity='.25' stroke='#E8A93A' stroke-width='2.5'/><rect x='100' y='185' width='170' height='28' fill='#FF5D8F' fill-opacity='.2' stroke='#FF5D8F' stroke-width='2.5'/><rect x='285' y='185' width='105' height='28' rx='4' fill='#7C5CFF' fill-opacity='.15' stroke='#7C5CFF' stroke-width='2.5'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='35' y='12' font-weight='bold'>Velocity-time graph</text><text x='6' y='24'>v (m/s)</text><text x='165' y='140'>t (s)</text><text x='40' y='47'>gradient = a = Δv ÷ t</text><text x='88' y='96'>area = distance</text><text x='88' y='110'>(v × t)</text><text x='205' y='22' font-weight='bold'>Newton 2: F = ma</text><text x='213' y='45'>12 N</text><text x='280' y='59' text-anchor='middle'>3 kg</text><text x='338' y='45' text-anchor='middle'>a</text><text x='205' y='92'>a = F ÷ m = 12 ÷ 3 = 4 m/s²</text><text x='205' y='108'>N3: equal, opposite forces</text><text x='205' y='122'>N1: zero resultant → steady v</text><text x='205' y='136'>Vector: size + direction (v, F)</text><text x='205' y='150'>Scalar: size only (speed, m)</text><text x='20' y='179' font-weight='bold'>Stopping = thinking + braking</text><text x='60' y='203' text-anchor='middle'>Thinking</text><text x='185' y='203' text-anchor='middle'>Braking</text><text x='20' y='229'>tired, drugs,</text><text x='20' y='243'>alcohol, distracted</text><text x='150' y='229'>speed, wet or icy road,</text><text x='150' y='243'>worn brakes or tyres</text><text x='285' y='179' font-weight='bold'>Momentum</text><text x='337' y='203' text-anchor='middle'>p = m × v</text><text x='285' y='229'>conserved in a</text><text x='285' y='243'>closed system</text></g></svg>
