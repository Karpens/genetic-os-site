<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D1A15"/></marker></defs><g font-family="sans-serif" font-size="12" fill="#1D1A15" text-anchor="middle"><text x="200" y="13" font-size="11">Gravity pulls cloud together; hot enough = fusion</text><rect x="10" y="24" width="100" height="28" rx="6" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="60" y="42">Nebula</text><rect x="150" y="24" width="100" height="28" rx="6" fill="#FFF3DC" stroke="#E8A93A" stroke-width="2"/><text x="200" y="42">Protostar</text><rect x="280" y="24" width="110" height="28" rx="6" fill="#E3F6EC" stroke="#0E9F5D" stroke-width="2"/><text x="335" y="42">Main sequence</text><path d="M110 38H148" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M250 38H278" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="10" y="72" font-size="11" text-anchor="start">Stable: outward fusion</text><text x="10" y="86" font-size="11" text-anchor="start">pressure = inward gravity</text><path d="M320 52L135 104" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M335 52V104" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><text transform="translate(30,150) rotate(-90)" font-size="11">Sun-sized star</text><text transform="translate(240,150) rotate(-90)" font-size="11">Massive star</text><rect x="50" y="106" width="160" height="28" rx="6" fill="#FFE9EF" stroke="#FF5D8F" stroke-width="2"/><text x="130" y="124">Red giant</text><rect x="50" y="165" width="160" height="28" rx="6" fill="#F0ECFF" stroke="#7C5CFF" stroke-width="2"/><text x="130" y="183">White dwarf</text><path d="M130 134V163" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="255" y="106" width="140" height="28" rx="6" fill="#FFE9EF" stroke="#FF5D8F" stroke-width="2"/><text x="325" y="124">Red supergiant</text><rect x="255" y="150" width="140" height="28" rx="6" fill="#FFF3DC" stroke="#E8A93A" stroke-width="2"/><text x="325" y="168">Supernova</text><path d="M325 134V148" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M310 178L280 203" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M340 178L360 203" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="235" y="205" width="85" height="28" rx="6" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="277" y="223">Neutron star</text><rect x="328" y="205" width="66" height="28" rx="6" fill="#EDEAE4" stroke="#1D1A15" stroke-width="2"/><text x="361" y="223">Black hole</text><text x="10" y="213" font-size="11" text-anchor="start">Supernova makes elements</text><text x="10" y="227" font-size="11" text-anchor="start">heavier than iron and</text><text x="10" y="241" font-size="11" text-anchor="start">spreads them through space</text></g></svg>
