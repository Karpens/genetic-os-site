<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="12" fill="#1D1A15"><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1D1A15"/></marker></defs><text x="200" y="16" text-anchor="middle" font-weight="bold" font-size="13">Energy is conserved: input = useful + wasted</text><text x="200" y="32" text-anchor="middle" font-size="11">Stores: kinetic, gravitational, elastic, thermal,</text><text x="200" y="45" text-anchor="middle" font-size="11">chemical, magnetic, nuclear</text><text x="10" y="72">Input 500 J</text><text x="10" y="86" font-size="11">(chemical store)</text><path d="M10 100 H120" stroke="#7C5CFF" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="125" y="68" width="110" height="64" rx="8" fill="#FFF3D6" stroke="#E8A93A" stroke-width="2.5"/><text x="180" y="96" text-anchor="middle" font-weight="bold">Device</text><text x="180" y="114" text-anchor="middle" font-size="11">(e.g. motor)</text><path d="M235 90 H298" stroke="#0E9F5D" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="303" y="86">Useful 200 J</text><text x="303" y="101" font-size="11">(kinetic)</text><path d="M180 132 V160" stroke="#FF5D8F" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="192" y="150">Wasted 300 J</text><text x="192" y="164" font-size="11">heat to surroundings</text><text x="200" y="184" text-anchor="middle" font-size="11">Transfers: mechanical, electrical, heating, radiation</text><g fill="#E3F4FF" stroke="#2FB5FF" stroke-width="2"><rect x="8" y="192" width="92" height="40" rx="6"/><rect x="104" y="192" width="92" height="40" rx="6"/><rect x="200" y="192" width="92" height="40" rx="6"/><rect x="296" y="192" width="96" height="40" rx="6"/></g><g text-anchor="middle"><text x="54" y="209">Ek = ½mv²</text><text x="54" y="225" font-size="11">kinetic</text><text x="150" y="209">Ep = mgh</text><text x="150" y="225" font-size="11">gravitational</text><text x="246" y="209">½ke²</text><text x="246" y="225" font-size="11">elastic</text><text x="344" y="209">E = mcΔθ</text><text x="344" y="225" font-size="11">specific heat</text></g><rect x="8" y="238" width="384" height="26" fill="none"/><text x="200" y="254" text-anchor="middle" font-weight="bold">Efficiency = useful ÷ total = 200 ÷ 500 = 40%</text></svg>
