<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' fill='#1D1A15' text-anchor='middle'><text x='200' y='22' font-size='14' font-weight='bold'>SI prefixes: steps of 1000</text><rect x='18' y='36' width='50' height='58' fill='#E6F6FF' stroke='#2FB5FF'/><text x='43' y='57' font-size='11'>nano</text><text x='43' y='73' font-size='14' font-weight='bold'>n</text><text x='43' y='87' font-size='11'>10⁻⁹</text><rect x='70' y='36' width='50' height='58' fill='#E6F6FF' stroke='#2FB5FF'/><text x='95' y='57' font-size='11'>micro</text><text x='95' y='73' font-size='14' font-weight='bold'>µ</text><text x='95' y='87' font-size='11'>10⁻⁶</text><rect x='122' y='36' width='50' height='58' fill='#E6F6FF' stroke='#2FB5FF'/><text x='147' y='57' font-size='11'>milli</text><text x='147' y='73' font-size='14' font-weight='bold'>m</text><text x='147' y='87' font-size='11'>10⁻³</text><rect x='174' y='36' width='50' height='58' fill='#FFF3DC' stroke='#E8A93A'/><text x='199' y='57' font-size='11'>base</text><text x='199' y='73' font-size='14' font-weight='bold'>-</text><text x='199' y='87' font-size='11'>10⁰</text><rect x='226' y='36' width='50' height='58' fill='#E3F7EC' stroke='#0E9F5D'/><text x='251' y='57' font-size='11'>kilo</text><text x='251' y='73' font-size='14' font-weight='bold'>k</text><text x='251' y='87' font-size='11'>10³</text><rect x='278' y='36' width='50' height='58' fill='#E3F7EC' stroke='#0E9F5D'/><text x='303' y='57' font-size='11'>mega</text><text x='303' y='73' font-size='14' font-weight='bold'>M</text><text x='303' y='87' font-size='11'>10⁶</text><rect x='330' y='36' width='50' height='58' fill='#E3F7EC' stroke='#0E9F5D'/><text x='355' y='57' font-size='11'>giga</text><text x='355' y='73' font-size='14' font-weight='bold'>G</text><text x='355' y='87' font-size='11'>10⁹</text><line x1='38' y1='108' x2='370' y2='108' stroke='#FF5D8F' stroke-width='2'/><polygon points='30,108 38,104 38,112' fill='#FF5D8F'/><text x='200' y='124' font-size='12'>Move left one box: number × 1000 (1 km = 1000 m)</text><line x1='30' y1='138' x2='362' y2='138' stroke='#7C5CFF' stroke-width='2'/><polygon points='370,138 362,134 362,142' fill='#7C5CFF'/><text x='200' y='154' font-size='12'>Move right one box: number ÷ 1000 (1000 m = 1 km)</text><rect x='18' y='164' width='362' height='82' fill='#FFF8EC' stroke='#E8A93A'/><g text-anchor='start' font-size='12'><text x='30' y='183'>2.5 mA = 2.5 × 10⁻³ A</text><text x='30' y='200'>450 nm = 4.5 × 10⁻⁷ m</text><text x='30' y='217'>3 MJ = 3 000 000 J</text><text x='30' y='234'>1 cm² = 1 × 10⁻⁴ m² (square the factor)</text></g></g></svg>
