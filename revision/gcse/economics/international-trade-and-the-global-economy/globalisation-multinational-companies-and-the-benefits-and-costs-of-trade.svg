<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='18' text-anchor='middle' font-size='14' font-weight='bold'>Multinational company (MNC)</text><rect x='20' y='30' width='130' height='50' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='85' y='52' text-anchor='middle'>Head office</text><text x='85' y='68' text-anchor='middle'>(home country)</text><rect x='250' y='30' width='130' height='50' rx='6' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='315' y='52' text-anchor='middle'>Subsidiary</text><text x='315' y='68' text-anchor='middle'>(host country)</text><path d='M152 52H248' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><text x='200' y='46' text-anchor='middle'>Investment</text><path d='M248 68H152' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><text x='200' y='82' text-anchor='middle'>Profits</text><rect x='10' y='95' width='120' height='150' rx='6' fill='#FFF6E3' stroke='#E8A93A' stroke-width='2'/><text x='20' y='114' font-weight='bold'>Why go abroad?</text><text x='20' y='134'>• Cheaper labour</text><text x='20' y='151'>• New markets</text><text x='20' y='168'>• Avoid tariffs</text><text x='20' y='185'>• Raw materials</text><text x='20' y='202'>• Lower taxes</text><rect x='140' y='95' width='120' height='150' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='150' y='114' font-weight='bold'>Host benefits</text><text x='150' y='134'>• Jobs</text><text x='150' y='151'>• Tax revenue</text><text x='150' y='168'>• Technology</text><text x='150' y='185'>• Investment</text><text x='150' y='202'>• More choice</text><rect x='270' y='95' width='120' height='150' rx='6' fill='#FFE9F0' stroke='#FF5D8F'