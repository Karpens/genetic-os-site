<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='13' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='30' y='12' width='340' height='44' rx='8' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='39' text-anchor='middle'>1. Basket cost: Year 1 £200, Year 2 £206</text><path d='M200 56 V68 M195 63 L200 69 L205 63' fill='none' stroke='#1D1A15' stroke-width='2'/><rect x='30' y='70' width='340' height='44' rx='8' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='200' y='97' text-anchor='middle'>2. Change = £206 - £200 = £6</text><path d='M200 114 V126 M195 121 L200 127 L205 121' fill='none' stroke='#1D1A15' stroke-width='2'/><rect x='30' y='128' width='340' height='44' rx='8' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='200' y='155' text-anchor='middle'>3. Inflation = 6 ÷ 200 × 100 = 3%</text><path d='M200 172 V184 M195 179 L200 185 L205 179' fill='none' stroke='#1D1A15' stroke-width='2'/><rect x='30' y='186' width='340' height='44' rx='8' fill='#FFE8F0' stroke='#FF5D8F' stroke-width='2'/><text x='200' y='213' text-anchor='middle'>3% > 2% target: prices rising faster</text><text x='200' y='252' text-anchor='middle' font-size='12'>Inflation % = (change in prices ÷ original price) × 100</text></svg>
