<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><defs><marker id="a0" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#1D1A15"/></marker></defs><path d="M40,50 C140,50 205,100 210,225 L40,225Z" fill="#0E9F5D" fill-opacity="0.12" stroke="none"/><path d="M40,225 V22" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a0)"/><path d="M40,225 H236" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a0)"/><path d="M40,50 C140,50 205,100 210,225" stroke="#0E9F5D" stroke-width="3" fill="none"/><path d="M166,97 L192,139" stroke="#FF5D8F" stroke-width="2" fill="none" marker-end="url(#a0)"/><circle cx="161" cy="91" r="4" fill="#0E9F5D"/><circle cx="110" cy="160" r="4" fill="#E8A93A"/><circle cx="190" cy="48" r="4" fill="#FF5D8F"/><circle cx="195" cy="145" r="4" fill="#0E9F5D"/><text x="46" y="16" font-weight="bold">Capital goods</text><text x="236" y="243" text-anchor="end" font-weight="bold">Consumer goods</text><text x="168" y="86">A</text><text x="202" y="150">D</text><text x="118" y="164">B inside:</text><text x="118" y="177">idle resources</text><text x="181" y="40" text-anchor="end">C: unattainable</text><text x="48" y="190">A to D: more consumer</text><text x="48" y="203">goods, fewer capital goods</text><text x="48" y="216" fill="#FF5D8F" font-weight="bold">= opportunity cost</text><text x="252" y="16" font-weight="bold" font-size="12">Factors of production</text><rect x="252" y="26" width="143" height="30" rx="6" fill="#0E9F5D" fill-opacity="0.15" stroke="#0E9F5D" stroke-width="2"/><text x="262" y="45">Land: rent</text><rect x="252" y="64" width="143" height="30" rx="6" fill="#2FB5FF" fill-opacity="0.15" stroke="#2FB5FF" stroke-width="2"/><text x="262" y="83">Labour: wages</text><rect x="252" y="102" width="143" height="30" rx="6" fill="#E8A93A" fill-opacity="0.2" stroke="#E8A93A" stroke-width="2"/><text x="262" y="121">Capital: interest</text><rect x="252" y="140" width="143" height="30" rx="6" fill="#7C5CFF" fill-opacity="0.15" stroke="#7C5CFF" stroke-width="2"/><text x="262" y="159">Enterprise: profit</text><text x="252" y="198" font-weight="bold">Scarce resources,</text><text x="252" y="212" font-weight="bold">unlimited wants</text><text x="252" y="226">= choices must be made,</text><text x="252" y="240">so opportunity cost</text></svg>
