<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1D1A15"/></marker></defs><text x="200" y="16" text-anchor="middle" font-size="13" font-weight="bold">Macroeconomic objectives</text><rect x="6" y="26" width="124" height="58" rx="6" fill="#E6F6EE" stroke="#0E9F5D" stroke-width="2"/><text x="68" y="43" text-anchor="middle" font-weight="bold">Economic growth</text><text x="68" y="58" text-anchor="middle">rise in real GDP</text><text x="68" y="73" text-anchor="middle">(total output)</text><rect x="138" y="26" width="124" height="58" rx="6" fill="#E3F5FF" stroke="#2FB5FF" stroke-width="2"/><text x="200" y="41" text-anchor="middle" font-weight="bold">Low unemployment</text><text x="200" y="55" text-anchor="middle">cyclical, structural,</text><text x="200" y="68" text-anchor="middle">frictional, seasonal</text><text x="200" y="80" text-anchor="middle" font-size="10">claimant count, LFS</text><rect x="270" y="26" width="124" height="58" rx="6" fill="#FFE9F0" stroke="#FF5D8F" stroke-width="2"/><text x="332" y="43" text-anchor="middle" font-weight="bold">Price stability</text><text x="332" y="58" text-anchor="middle">low inflation (CPI)</text><text x="332" y="73" text-anchor="middle">target = 2%</text><rect x="6" y="92" width="388" height="24" rx="6" fill="#FFF4DC" stroke="#E8A93A" stroke-width="2"/><text x="200" y="108" text-anchor="middle">Also: balance of payments, fair incomes, sustainability</text><path d="M68 186 L68 122" stroke="#1D1A15" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M200 186 L200 122" stroke="#1D1A15" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M332 186 L332 122" stroke="#1D1A15" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="210" y="158">policies steer</text><text x="210" y="172">the economy</text><rect x="6" y="190" width="124" height="60" rx="6" fill="#EFEAFF" stroke="#7C5CFF" stroke-width="2"/><text x="68" y="208" text-anchor="middle" font-weight="bold">Fiscal policy</text><text x="68" y="224" text-anchor="middle">government spending</text><text x="68" y="239" text-anchor="middle">and taxation</text><rect x="138" y="190" width="124" height="60" rx="6" fill="#EFEAFF" stroke="#7C5CFF" stroke-width="2"/><text x="200" y="208" text-anchor="middle" font-weight="bold">Monetary policy</text><text x="200" y="224" text-anchor="middle">Bank Rate set by</text><text x="200" y="239" text-anchor="middle">Bank of England MPC</text><rect x="270" y="190" width="124" height="60" rx="6" fill="#EFEAFF" stroke="#7C5CFF" stroke-width="2"/><text x="332" y="208" text-anchor="middle" font-weight="bold">Supply-side</text><text x="332" y="224" text-anchor="middle">retraining, education</text><text x="332" y="239" text-anchor="middle">raise capacity</text></svg>
