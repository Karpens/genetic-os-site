<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='26' text-anchor='middle' font-size='13' font-weight='bold'>Labour productivity = output ÷ workers</text><rect x='15' y='45' width='175' height='150' rx='8' fill='#E6F6EE' stroke='#0E9F5D' stroke-width='2'/><rect x='210' y='45' width='175' height='150' rx='8' fill='#E3F4FF' stroke='#2FB5FF' stroke-width='2'/><text x='102' y='68' text-anchor='middle' font-weight='bold'>Labour-intensive</text><text x='102' y='94' text-anchor='middle' font-size='11'>Mostly workers</text><text x='102' y='116' text-anchor='middle' font-size='11'>e.g. hairdresser, care home</text><text x='102' y='138' text-anchor='middle' font-size='11'>Low fixed costs</text><text x='102' y='160' text-anchor='middle' font-size='11'>High variable costs</text><text x='102' y='182' text-anchor='middle' font-size='11'>Output depends on staff</text><text x='297' y='68' text-anchor='middle' font-weight='bold'>Capital-intensive</text><text x='297' y='94' text-anchor='middle' font-size='11'>Mostly machinery</text><text x='297' y='116' text-anchor='middle' font-size='11'>e.g. car plant, refinery</text><text x='297' y='138' text-anchor='middle' font-size='11'>High fixed costs</text><text x='297' y='160' text-anchor='middle' font-size='11'>Low unit cost, high output</text><text x='297' y='182' text-anchor='middle' font-size='11'>Risk: job losses</text><text x='200' y='124' text-anchor='middle' font-size='11'>vs</text><rect x='15' y='208' width='370' height='40' rx='8' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='200' y='224' text-anchor='middle' font-size='11'>Example: 600 units ÷ 20 workers</text><text x='200' y='240' text-anchor='middle' font-size='11' font-weight='bold'>= 30 units per worker</text></svg>
