<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect x='130' y='8' width='140' height='34' rx='6' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='30' text-anchor='middle' font-size='14'>Self-concept</text><path d='M170 42 L70 88 M200 42 L200 88 M230 42 L330 88' stroke='#1D1A15' stroke-width='1.5' fill='none'/><rect x='12' y='88' width='116' height='72' rx='6' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='70' y='108' text-anchor='middle' font-size='13'>Self-image</text><text x='70' y='127' text-anchor='middle'>How I see</text><text x='70' y='143' text-anchor='middle'>myself now</text><rect x='142' y='88' width='116' height='72' rx='6' fill='#EAF7FF' stroke='#2FB5FF' stroke-width='2'/><text x='200' y='108' text-anchor='middle' font-size='13'>Ideal self</text><text x='200' y='127' text-anchor='middle'>Who I would</text><text x='200' y='143' text-anchor='middle'>like to be</text><rect x='272' y='88' width='116' height='72' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><text x='330' y='108' text-anchor='middle' font-size='13'>Self-esteem</text><text x='330' y='127' text-anchor='middle'>How much I</text><text x='330' y='143' text-anchor='middle'>value myself</text><text x='200' y='182' text-anchor='middle' font-size='11'>Big gap: self-image far from ideal self = lower self-esteem</text><rect x='12' y='196' width='376' height='52' rx='6' fill='#F1EDFF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='216' text-anchor='middle' font-size='13'>Influences</text><text x='200' y='235' text-anchor='middle'>parents, peers, media, success and failure</text></svg>
