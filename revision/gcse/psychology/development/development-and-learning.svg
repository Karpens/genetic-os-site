<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 284' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#1D1A15'/></marker></defs><text x='200' y='13' text-anchor='middle' font-size='13' font-weight='bold'>Piaget's stages (ages in years)</text><g text-anchor='middle'><text x='52' y='24'>0-2</text><text x='152' y='24'>2-7</text><text x='252' y='24'>7-11</text><text x='352' y='24'>11+</text><rect x='8' y='28' width='88' height='72' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><rect x='108' y='28' width='88' height='72' rx='6' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><rect x='208' y='28' width='88' height='72' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><rect x='308' y='28' width='88' height='72' rx='6' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><g font-weight='bold'><text x='52' y='43'>Sensori-</text><text x='52' y='55'>motor</text><text x='152' y='43'>Pre-</text><text x='152' y='55'>operational</text><text x='252' y='43'>Concrete</text><text x='252' y='55'>operational</text><text x='352' y='43'>Formal</text><text x='352' y='55'>operational</text></g><text x='52' y='72'>object</text><text x='52' y='85'>permanence</text><text x='152' y='72'>egocentrism,</text><text x='152' y='85'>no conservation</text><text x='252' y='72'>conservation,</text><text x='252' y='85'>logical thinking</text><text x='352' y='72'>abstract</text><text x='352' y='85'>reasoning</text></g><path d='M96,64 L107,64 M196,64 L207,64 M296,64 L307,64' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><text x='8' y='118' font-weight='bold'>Schemas</text><circle cx='18' cy='142' r='8' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><path d='M29,142 L44,142' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><rect x='46' y='128' width='34' height='28' rx='3' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><circle cx='63' cy='142' r='7' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='88' y='139' font-weight='bold'>Assimilation</text><text x='88' y='152'>fits old schema</text><path d='M10,188 L26,188 L18,172 z' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2' stroke-linejoin='round'/><path d='M30,180 L44,180' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><ellipse cx='63' cy='180' rx='17' ry='14' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='88' y='177' font-weight='bold'>Accommodation</text><text x='88' y='190'>schema changes</text><text x='206' y='118' font-weight='bold'>Dweck's mindsets</text><rect x='206' y='126' width='92' height='32' rx='5' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='212' y='139' font-weight='bold'>Fixed mindset</text><text x='212' y='152'>ability is fixed</text><path d='M298,142 L315,142' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><rect x='317' y='126' width='77' height='32' rx='5' fill='#FFF' stroke='#FF5D8F' stroke-width='2'/><text x='322' y='139'>gives up</text><text x='322' y='152'>after failure</text><rect x='206' y='166' width='92' height='32' rx='5' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='212' y='179' font-weight='bold'>Growth mindset</text><text x='212' y='192'>effort builds it</text><path d='M298,182 L315,182' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><rect x='317' y='166' width='77' height='32' rx='5' fill='#FFF' stroke='#0E9F5D' stroke-width='2'/><text x='322' y='179'>persists</text><text x='322' y='192'>after failure</text><text x='8' y='216' font-weight='bold'>Brain develops in this order:</text><g text-anchor='middle'><rect x='6' y='222' width='80' height='22' rx='5' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='46' y='237'>Brain stem</text><rect x='98' y='222' width='80' height='22' rx='5' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='138' y='237'>Movement</text><rect x='190' y='222' width='80' height='22' rx='5' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='230' y='237'>Language</text><rect x='282' y='222' width='112' height='22' rx='5' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='338' y='237'>Higher functions</text><text x='200' y='264'>Nature and nurture interact to shape development</text><text x='200' y='277'>Willingham: practice, facts, self-regulation (not learning styles)</text></g><path d='M86,233 L97,233 M178,233 L189,233 M270,233 L281,233' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/></svg>
