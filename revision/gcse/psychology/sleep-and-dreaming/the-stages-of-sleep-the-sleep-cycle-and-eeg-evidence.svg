<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='220' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Hypnogram: one night's sleep</text><g stroke='#dddddd' stroke-width='1'><line x1='60' y1='36' x2='380' y2='36'/><line x1='60' y1='60' x2='380' y2='60'/><line x1='60' y1='84' x2='380' y2='84'/><line x1='60' y1='108' x2='380' y2='108'/><line x1='60' y1='132' x2='380' y2='132'/><line x1='60' y1='156' x2='380' y2='156'/></g><g fill='#FFD0E0'><rect x='120' y='54' width='4' height='12'/><rect x='180' y='54' width='8' height='12'/><rect x='244' y='54' width='16' height='12'/><rect x='300' y='54' width='20' height='12'/><rect x='356' y='54' width='16' height='12'/></g><g text-anchor='end'><text x='55' y='40'>Awake</text><text x='55' y='64'>REM</text><text x='55' y='88'>Stage 1</text><text x='55' y='112'>Stage 2</text><text x='55' y='136'>Stage 3</text><text x='55' y='160'>Stage 4</text></g><path d='M60 36 L68 84 L76 108 L84 132 L92 156 L104 132 L112 108 L120 60 L124 60 L128 108 L140 132 L148 132 L164 108 L180 60 L188 60 L192 108 L208 132 L228 108 L244 60 L260 60 L264 108 L284 108 L300 60 L320 60 L324 108 L344 108 L356 60 L372 60 L380 36' fill='none' stroke='#7C5CFF' stroke-width='2'/><line x1='60' y1='172' x2='380' y2='172' stroke='#1D1A15' stroke-width='1.5'/><g text-anchor='middle'><text x='60' y='186'>0</text><text x='100' y='186'>1</text><text x='140' y='186'>2</text><text x='180' y='186'>3</text><text x='220' y='186'>4</text><text x='260' y='186'>5</text><text x='300' y='186'>6</text><text x='340' y='186'>7</text><text x='380' y='186'>8</text><text x='220' y='200'>Hours of sleep</text></g><g stroke='#0E9F5D' stroke-width='2'><line x1='60' y1='222' x2='120' y2='222'/><line x1='60' y1='217' x2='60' y2='227'/><line x1='120' y1='217' x2='120' y2='227'/></g><text x='90' y='240' text-anchor='middle'>1 cycle = about 90 min</text><text x='250' y='240' text-anchor='middle'>Pink bars = REM periods</text><text x='220' y='254' text-anchor='middle'>Early: more deep sleep. Late: longer REM.</text></svg>
