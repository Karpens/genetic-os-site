<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 275' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L7,4 L0,8 Z' fill='#1D1A15'/></marker><marker id='b' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L7,4 L0,8 Z' fill='#FF5D8F'/></marker></defs><g text-anchor='middle'><text x='200' y='16' font-size='12' font-weight='bold'>Multi-store model (Atkinson &amp; Shiffrin)</text><rect x='10' y='30' width='90' height='75' rx='6' fill='#EAF7FF' stroke='#2FB5FF' stroke-width='2'/><text x='55' y='49' font-weight='bold'>Sensory</text><text x='55' y='63' font-weight='bold'>register</text><text x='55' y='82'>very brief</text><rect x='155' y='30' width='90' height='75' rx='6' fill='#FFF4DD' stroke='#E8A93A' stroke-width='2'/><text x='200' y='49' font-weight='bold'>Short-term</text><text x='200' y='63' font-weight='bold'>memory</text><text x='200' y='82'>7±2 items</text><text x='200' y='96'>up to 30 s</text><rect x='300' y='30' width='90' height='75' rx='6' fill='#EDE8FF' stroke='#7C5CFF' stroke-width='2'/><text x='345' y='49' font-weight='bold'>Long-term</text><text x='345' y='63' font-weight='bold'>memory</text><text x='345' y='82'>potentially</text><text x='345' y='96'>unlimited</text><path d='M100 68 H153' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='127' y='60'>attention</text><path d='M245 68 H298' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='272' y='60'>rehearsal</text><path d='M345 105 V125 H202 V108' fill='none' stroke='#0E9F5D' stroke-width='2' marker-end='url(#a)'/><text x='272' y='140' fill='#0E9F5D' font-weight='bold'>retrieval</text><path d='M55 105 V135' fill='none' stroke='#FF5D8F' stroke-width='2' marker-end='url(#b)'/><text x='55' y='149'>lost if not</text><text x='55' y='162'>attended</text><path d='M165 105 V135' fill='none' stroke='#FF5D8F' stroke-width='2' marker-end='url(#b)'/><text x='165' y='149'>decay or</text><text x='165' y='162'>displacement</text><text x='200' y='184' font-weight='bold'>Long-term memory has 3 types</text><rect x='10' y='192' width='120' height='54' rx='6' fill='#EDE8FF' stroke='#7C5CFF' stroke-width='2'/><text x='70' y='210' font-weight='bold'>Episodic</text><text x='70' y='225'>personal events</text><text x='70' y='239'>(my last birthday)</text><rect x='140' y='192' width='120' height='54' rx='6' fill='#EDE8FF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='210' font-weight='bold'>Semantic</text><text x='200' y='225'>facts, knowledge</text><text x='200' y='239'>(capital of France)</text><rect x='270' y='192' width='120' height='54' rx='6' fill='#EDE8FF' stroke='#7C5CFF' stroke-width='2'/><text x='330' y='210' font-weight='bold'>Procedural</text><text x='330' y='225'>how to do things</text><text x='330' y='239'>(riding a bike)</text><text x='200' y='266' fill='#7C5CFF'>Bartlett: recall is rebuilt using schemas – shortened, distorted</text></g></svg>
