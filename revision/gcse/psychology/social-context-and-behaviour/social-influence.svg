<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8z" fill="#1D1A15"/></marker></defs><text x="230" y="20" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1D1A15">Social influence</text><rect x="6" y="32" width="140" height="272" rx="8" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><rect x="160" y="32" width="140" height="272" rx="8" fill="#FFEAF1" stroke="#FF5D8F" stroke-width="2"/><rect x="314" y="32" width="140" height="272" rx="8" fill="#E8F8EF" stroke="#0E9F5D" stroke-width="2"/><g stroke="#1D1A15" stroke-width="2" fill="#fff"><circle cx="22" cy="106" r="7"/><circle cx="40" cy="106" r="7"/><circle cx="58" cy="106" r="7"/><circle cx="76" cy="106" r="7"/><circle cx="128" cy="106" r="7" fill="#FF5D8F"/><path d="M88 106H114" fill="none" marker-end="url(#a)"/><path d="M12 218H140M166 262H294M320 216H448" fill="none" stroke-width="1" stroke="#7C5CFF"/><rect x="170" y="112" width="116" height="16" fill="#fff"/><rect x="170" y="112" width="75" height="16" fill="#FFB3CC"/></g><g stroke="#0E9F5D" stroke-width="2" fill="#fff"><circle cx="332" cy="104" r="6"/><circle cx="350" cy="104" r="6"/><circle cx="368" cy="104" r="6"/><circle cx="386" cy="104" r="6"/><circle cx="428" cy="104" r="7" fill="#FF5D8F" stroke="#1D1A15"/></g><g font-family="sans-serif" font-size="11" fill="#1D1A15" text-anchor="middle" font-weight="bold"><text x="76" y="52" font-size="12">CONFORMITY</text><text x="230" y="52" font-size="12">OBEDIENCE</text><text x="384" y="52" font-size="12">BYSTANDERS</text></g><g font-family="sans-serif" font-size="11" fill="#1D1A15"><text x="14" y="70">Change due to group</text><text x="14" y="84">pressure</text><text x="14" y="130">Asch: ~75% conformed</text><text x="14" y="144">at least once</text><text x="14" y="166" font-weight="bold">Affected by:</text><text x="14" y="180">• Group size</text><text x="14" y="194">• Unanimity</text><text x="14" y="208">• Task difficulty</text><text x="14" y="232" font-weight="bold">Normative (NSI)</text><text x="14" y="246">to be accepted</text><text x="14" y="264" font-weight="bold">Informational (ISI)</text><text x="14" y="278">others are right</text><text x="168" y="70">Following orders from</text><text x="168" y="84">an authority figure</text><text x="168" y="104" font-weight="bold">Milgram shock study</text><text x="176" y="124">65%</text><text x="170" y="142">0 V</text><text x="288" y="142" text-anchor="end">450 V (max)</text><text x="168" y="160">Nearly 2/3 obeyed</text><text x="168" y="182" font-weight="bold">Factors:</text><text x="168" y="196">• Proximity</text><text x="168" y="210">• Location / prestige</text><text x="168" y="224">• Uniform</text><text x="168" y="238">• Authoritarian</text><text x="168" y="252">  personality</text><text x="168" y="278">Obedience = authority</text><text x="168" y="292">Conformity = peers</text><text x="322" y="70">More bystanders =</text><text x="322" y="84">less chance of help</text><text x="428" y="124" text-anchor="middle">victim</text><text x="322" y="134">Diffusion of</text><text x="322" y="148">responsibility</text><text x="322" y="168" font-weight="bold">Helping depends on:</text><text x="322" y="182">• Noticing the event</text><text x="322" y="196">• Cost of helping</text><text x="322" y="210">• Similarity to victim</text><text x="322" y="236" font-weight="bold">DEINDIVIDUATION</text><text x="322" y="252">Losing individual</text><text x="322" y="266">identity in a crowd</text><text x="322" y="282">= less self-control</text></g></svg>
