<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0 0L6 3L0 6z' fill='#1D1A15'/></marker></defs><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='14' font-size='13' font-weight='bold'>Binary, hex and units</text><text x='46' y='30'>128</text><text x='90' y='30'>64</text><text x='134' y='30'>32</text><text x='178' y='30'>16</text><text x='222' y='30'>8</text><text x='266' y='30'>4</text><text x='310' y='30'>2</text><text x='354' y='30'>1</text><rect x='24' y='34' width='176' height='26' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><rect x='200' y='34' width='176' height='26' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><path d='M68 34V60M112 34V60M156 34V60M244 34V60M288 34V60M332 34V60' stroke='#1D1A15' stroke-width='1'/><g font-size='14' font-weight='bold'><text x='46' y='53'>1</text><text x='90' y='53'>1</text><text x='134' y='53'>1</text><text x='178' y='53'>1</text><text x='222' y='53'>1</text><text x='266' y='53'>1</text><text x='310' y='53'>1</text><text x='354' y='53'>1</text></g><path d='M24 66V71H196V66M204 66V71H376V66' fill='none' stroke='#1D1A15' stroke-width='2'/><text x='110' y='86'>1111 = F (15)</text><text x='290' y='86'>1111 = F (15)</text><text x='200' y='104'>Each hex digit = 4 bits.  FF = (15 × 16) + 15 = 255</text><text x='200' y='124'>Units (each step up is × 1000)</text><g fill='#E8F8EF' stroke='#0E9F5D' stroke-width='2'><rect x='9' y='130' width='52' height='22' rx='4'/><rect x='75' y='130' width='52' height='22' rx='4'/><rect x='141' y='130' width='52' height='22' rx='4'/><rect x='207' y='130' width='52' height='22' rx='4'/><rect x='273' y='130' width='52' height='22' rx='4'/><rect x='339' y='130' width='52' height='22' rx='4'/></g><text x='35' y='145'>bit</text><text x='101' y='145'>byte</text><text x='167' y='145'>KB</text><text x='233' y='145'>MB</text><text x='299' y='145'>GB</text><text x='365' y='145'>TB</text><g stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'><path d='M62 141H73'/><path d='M128 141H139'/><path d='M194 141H205'/><path d='M260 141H271'/><path d='M326 141H337'/></g><text x='101' y='166'>8 bits</text><text x='167' y='166'>1000 bytes</text><text x='233' y='166'>1000 KB</text><text x='299' y='166'>1000 MB</text><text x='365' y='166'>1000 GB</text><rect x='8' y='176' width='120' height='76' rx='6' fill='#E8F8EF' stroke='#0E9F5D' stroke-width='2'/><rect x='140' y='176' width='120' height='76' rx='6' fill='#EFEBFF' stroke='#7C5CFF' stroke-width='2'/><rect x='272' y='176' width='120' height='76' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><g font-weight='bold'><text x='68' y='192'>Binary addition</text><text x='200' y='192'>Binary shifts</text><text x='332' y='192'>Overflow</text></g><text x='68' y='209'>0+0=0, 0+1=1</text><text x='68' y='223'>1+1 = 10 (carry 1)</text><text x='68' y='237'>1+1+1 = 11</text><text x='200' y='209'>Left: × 2 per place</text><text x='200' y='223'>0011 → 0110 (3→6)</text><text x='200' y='237'>Right: ÷ 2, bits lost</text><text x='332' y='209'>Result needs more</text><text x='332' y='223'>bits than available</text><text x='332' y='237'>8-bit: 255+1 needs 9</text></g></svg>
