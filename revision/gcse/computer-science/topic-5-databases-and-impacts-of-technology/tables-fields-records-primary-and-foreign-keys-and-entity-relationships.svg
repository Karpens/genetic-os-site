<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='10' y='16' font-size='13' font-weight='bold'>One-to-many: one customer, many orders</text><text x='10' y='36' font-weight='bold'>Customer</text><rect x='10' y='42' width='100' height='66' fill='#FBEFD5'/><rect x='10' y='42' width='300' height='66' fill='none' stroke='#1D1A15' stroke-width='1.5'/><path d='M10 64H310M10 86H310M110 42V108M210 42V108' stroke='#1D1A15' fill='none'/><g font-weight='bold'><text x='16' y='57'>CustomerID PK</text><text x='116' y='57'>Name</text><text x='216' y='57'>Town</text></g><text x='16' y='79'>C01</text><text x='116' y='79'>Ali</text><text x='216' y='79'>Leeds</text><text x='16' y='101'>C02</text><text x='116' y='101'>Bea</text><text x='216' y='101'>York</text><text x='316' y='57'>← fields</text><text x='316' y='79'>← record</text><path d='M60 108V124H160V150' stroke='#7C5CFF' stroke-width='2' fill='none'/><text x='66' y='120' font-weight='bold'>1</text><text x='170' y='120'>1 customer : many orders</text><text x='168' y='144' font-weight='bold'>many</text><text x='10' y='142' font-weight='bold'>Orders</text><rect x='10' y='150' width='100' height='66' fill='#FBEFD5'/><rect x='110' y='150' width='100' height='66' fill='#FFE3EC'/><rect x='10' y='150' width='300' height='66' fill='none' stroke='#1D1A15' stroke-width='1.5'/><path d='M10 172H310M10 194H310M110 150V216M210 150V216' stroke='#1D1A15' fill='none'/><g font-weight='bold'><text x='16' y='165'>OrderID PK</text><text x='116' y='165'>CustomerID FK</text><text x='216' y='165'>Date</text></g><text x='16' y='187'>O101</text><text x='116' y='187'>C01</text><text x='216' y='187'>05/03</text><text x='16' y='209'>O102</text><text x='116' y='209'>C01</text><text x='216' y='209'>09/03</text><text x='10' y='236'>PK = primary key: unique for every record</text><text x='10' y='252'>FK = foreign key: holds a PK from another tabl