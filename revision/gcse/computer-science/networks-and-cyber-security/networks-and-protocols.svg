">R</text><text x="325" y="144">R</text><text x="385" y="102">R</text><text x="446" y="128">reassembles</text><text x="450" y="141">packets</text><text x="95" y="226" font-weight="bold">HEADER</text><text x="95" y="240">to/from IP address, number</text><text x="255" y="226" font-weight="bold">PAYLOAD</text><text x="255" y="240">piece of the data</text><text x="410" y="214" font-weight="bold">Client-server:</text><text x="410" y="226">central server</text><text x="410" y="241" font-weight="bold">Peer-to-peer:</text><text x="410" y="253">devices share direct</text></g><g font-family="sans-serif" font-size="11" fill="#1D1A15"><text x="10" y="16" font-size="12" font-weight="bold">LAN: small area (star)</text><text x="250" y="16" font-size="12" font-weight="bold">WAN: large area (internet)</text><text x="10" y="182">Every device connects to the switch</text><text x="345" y="152">Packet 2</text><text x="345" y="50">Packet 1</text><text x="245" y="190">R = router (uses IP addresses to route)</text><text x="10" y="204" font-size="12" font-weight="bold">A packet = header + payload</text><text x="10" y="272">TCP/IP: packets + addressing   HTTP/HTTPS: web (S = encrypted)</text><text x="10" y="287">SMTP/IMAP: email   FTP: file transfer</text><text x="10" y="302">Speed depends on: bandwidth, users, interference, wired vs wireless</text></g></svg>
