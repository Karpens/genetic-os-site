<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='13' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-weight='bold'>Binary addition: 45 + 27 (8 bits)</text><text x='8' y='42' font-size='11' fill='#FF5D8F'>carries</text><text x='110 138 166 194 222 250 278 306' y='42' text-anchor='middle' fill='#FF5D8F'>01111110</text><text x='8' y='66'>A (45)</text><text x='110 138 166 194 222 250 278 306' y='66' text-anchor='middle'>00101101</text><text x='8' y='88'>B (27)</text><text x='110 138 166 194 222 250 278 306' y='88' text-anchor='middle'>00011011</text><line x1='96' y1='96' x2='322' y2='96' stroke='#1D1A15' stroke-width='1.5'/><text x='8' y='118' font-weight='bold'>Sum</text><text x='110 138 166 194 222 250 278 306' y='118' text-anchor='middle' fill='#0E9F5D' font-weight='bold'>01001000</text><text x='332' y='118'>= 72</text><rect x='8' y='134' width='384' height='118' rx='6' fill='#2FB5FF' fill-opacity='0.08' stroke='#2FB5FF'/><text x='200' y='153' text-anchor='middle' font-weight='bold'>Logical left shift by 2 = x 4</text><text x='16' y='180' font-size='11'>before</text><text x='110 138 166 194 222 250 278 306' y='180' text-anchor='middle'>00001101</text><text x='332' y='180'>13</text><path d='M200 188 V208 M195 201 L200 209 L205 201' stroke='#7C5CFF' stroke-width='2' fill='none'/><text x='214' y='203' font-size='11'>2 places left, fill with 0s</text><text x='16' y='230' font-size='11'>after</text><text x='110 138 166 194 222 250 278 306' y='230' text-anchor='middle' fill='#0E9F5D' font-weight='bold'>00110100</text><text x='332' y='230'>52</text><text x='200' y='246' text-anchor='middle' font-size='11'>13 x 4 = 52 (right shift divides instead)</text></svg>
