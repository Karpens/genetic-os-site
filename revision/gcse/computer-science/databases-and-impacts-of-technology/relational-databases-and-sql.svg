<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><g font-family="sans-serif" font-size="11" fill="#1D1A15"><text x="10" y="15" font-weight="bold">students table</text><text x="280" y="15" font-weight="bold">classes table</text><rect x="10" y="22" width="220" height="72" fill="#E3F5FF" stroke="#2FB5FF" stroke-width="2"/><rect x="11" y="23" width="218" height="17" fill="#BFE8FF"/><path d="M10 40H230M10 58H230M10 76H230M65 22V94M120 22V94M165 22V94" stroke="#2FB5FF" stroke-width="1" fill="none"/><g text-anchor="middle"><g font-weight="bold"><text x="37" y="35">ID (PK)</text><text x="92" y="35">name</text><text x="142" y="35">year</text><text x="197" y="35">class (FK)</text></g><text x="37" y="53">1</text><text x="92" y="53">Ann</text><text x="142" y="53">11</text><text x="197" y="53">A</text><text x="37" y="71">2</text><text x="92" y="71">Raj</text><text x="142" y="71">10</text><text x="197" y="71">B</text><text x="37" y="89">3</text><text x="92" y="89">Tia</text><text x="142" y="89">11</text><text x="197" y="89">A</text></g><rect x="280" y="22" width="110" height="72" fill="#EEE9FF" stroke="#7C5CFF" stroke-width="2"/><rect x="281" y="23" width="108" height="17" fill="#D9D0FF"/><path d="M280 40H390M280 58H390M280 76H390M330 22V94" stroke="#7C5CFF" stroke-width="1" fill="none"/><g text-anchor="middle"><g font-weight="bold"><text x="305" y="35">ID (PK)</text><text x="360" y="35">tutor</text></g><text x="305" y="53">A</text><text x="360" y="53">Mr Lee</text><text x="305" y="71">B</text><text x="360" y="71">Ms Ode</text><text x="305" y="89">C</text><text x="360" y="89">Ms Cho</text></g><path d="M232 49H272M232 67H272" stroke="#FF5D8F" stroke-width="2" fill="none"/><polygon points="278,49 271,45 271,53" fill="#FF5D8F" stroke="#FF5D8F"/><polygon points="278,67 271,63 271,71" fill="#FF5D8F" stroke="#FF5D8F"/><text x="255" y="43" text-anchor="middle">links</text><text x="10" y="112">Row = record; column = field</text><text x="10" y="127">PK = unique ID of each record; FK = matches a PK in another table</text><text x="10" y="142">Linked tables store each fact once: less duplication</text><rect x="10" y="152" width="380" height="76" rx="6" fill="#FFF6E3" stroke="#E8A93A" stroke-width="2"/><rect x="18" y="158" width="6" height="13" fill="#0E9F5D"/><rect x="18" y="174" width="6" height="13" fill="#2FB5FF"/><rect x="18" y="190" width="6" height="13" fill="#FF5D8F"/><rect x="18" y="206" width="6" height="13" fill="#7C5CFF"/><g font-size="12"><text x="32" y="169"><tspan font-weight="bold">SELECT</tspan> name</text><text x="32" y="185"><tspan font-weight="bold">FROM</tspan> students</text><text x="32" y="201"><tspan font-weight="bold">WHERE</tspan> year = 11</text><text x="32" y="217"><tspan font-weight="bold">ORDER BY</tspan> name</text></g><text x="230" y="169">choose the fields</text><text x="230" y="185">choose the table</text><text x="230" y="201">filter the records</text><text x="230" y="217">sort the results</text><text x="10" y="247">Also: INSERT INTO (add), UPDATE (change), DELETE (remove)</text></g></svg>
