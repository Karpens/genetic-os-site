<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><rect x='10' y='10' width='150' height='62' rx='8' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='85' y='30' text-anchor='middle' font-weight='bold'>Phishing</text><text x='85' y='48' text-anchor='middle' font-size='11'>fake email or text</text><text x='85' y='63' text-anchor='middle' font-size='11'>with a bad link</text><rect x='240' y='10' width='150' height='62' rx='8' fill='#E8F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='315' y='30' text-anchor='middle' font-weight='bold'>Pharming</text><text x='315' y='48' text-anchor='middle' font-size='11'>redirects to a fake site</text><text x='315' y='63' text-anchor='middle' font-size='11'>even if URL is correct</text><rect x='10' y='188' width='150' height='62' rx='8' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='85' y='208' text-anchor='middle' font-weight='bold'>Blagging</text><text x='85' y='226' text-anchor='middle' font-size='11'>invented story, often</text><text x='85' y='241' text-anchor='middle' font-size='11'>by phone, to get info</text><rect x='240' y='188' width='150' height='62' rx='8' fill='#EDE8FF' stroke='#7C5CFF' stroke-width='2'/><text x='315' y='208' text-anchor='middle' font-weight='bold'>Shouldering</text><text x='315' y='226' text-anchor='middle' font-size='11'>watching you enter</text><text x='315' y='241' text-anchor='middle' font-size='11'>a PIN or password</text><circle cx='200' cy='130' r='38' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='127' text-anchor='middle' font-weight='bold'>Victim</text><text x='200' y='143' text-anchor='middle' font-size='11'>(the user)</text><path d='M125 72L172 104' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><path d='M275 72L228 104' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><path d='M125 188L172 156' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><path d='M275 188L228 156' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a)'/><text x='75' y='128' text-anchor='middle' font-size='11'>Target: people,</text><text x='75' y='143' text-anchor='middle' font-size='11'>not software</text><text x='325' y='128' text-anchor='middle' font-size='11'>Goal: steal data,</text><text x='325' y='143' text-anchor='middle' font-size='11'>money or access</text></svg>
