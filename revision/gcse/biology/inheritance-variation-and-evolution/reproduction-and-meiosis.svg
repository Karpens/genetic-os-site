<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a0' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0L8 4L0 8z' fill='#1D1A15'/></marker></defs><text x='10' y='16' font-size='13' font-weight='bold'>Sexual reproduction (2 parents)</text><circle cx='40' cy='62' r='20' fill='#DDF2FF' stroke='#2FB5FF' stroke-width='2.5'/><text x='40' y='66' text-anchor='middle' font-size='12'>2n</text><text x='40' y='96' text-anchor='middle'>Parent cell</text><path d='M64 62H104' fill='none' stroke='#1D1A15' stroke-width='2.5' marker-end='url(#a0)'/><text x='84' y='54' text-anchor='middle' font-weight='bold'>meiosis</text><circle cx='125' cy='50' r='10' fill='#FFE0EB' stroke='#FF5D8F' stroke-width='2'/><circle cx='155' cy='50' r='10' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><circle cx='125' cy='76' r='10' fill='#E9E3FF' stroke='#7C5CFF' stroke-width='2'/><circle cx='155' cy='76' r='10' fill='#DFF5EA' stroke='#0E9F5D' stroke-width='2'/><text x='125' y='54' text-anchor='middle'>n</text><text x='155' y='54' text-anchor='middle'>n</text><text x='125' y='80' text-anchor='middle'>n</text><text x='155' y='80' text-anchor='middle'>n</text><text x='140' y='104' text-anchor='middle'>4 different gametes (n)</text><path d='M178 62H260' fill='none' stroke='#1D1A15' stroke-width='2.5' marker-end='url(#a0)'/><text x='219' y='54' text-anchor='middle' font-weight='bold'>fertilisation</text><text x='219' y='78' text-anchor='middle'>+ 2nd gamete</text><circle cx='288' cy='62' r='20' fill='#E9E3FF' stroke='#7C5CFF' stroke-width='2.5'/><text x='288' y='66' text-anchor='middle' font-size='12'>2n</text><text x='288' y='96' text-anchor='middle'>Zygote</text><text x='10' y='122'>Fertilisation restores the full chromosome number</text><line x1='10' y1='130' x2='390' y2='130' stroke='#1D1A15' stroke-width='2' opacity='0.2'/><text x='10' y='148' font-size='13' font-weight='bold'>Asexual reproduction (1 parent)</text><circle cx='40' cy='184' r='20' fill='#DDF2FF' stroke='#2FB5FF' stroke-width='2.5'/><text x='40' y='188' text-anchor='middle' font-size='12'>2n</text><text x='40' y='218' text-anchor='middle'>Parent cell</text><path d='M64 184H104' fill='none' stroke='#1D1A15' stroke-width='2.5' marker-end='url(#a0)'/><text x='84' y='176' text-anchor='middle' font-weight='bold'>mitosis</text><circle cx='132' cy='184' r='16' fill='#DDF2FF' stroke='#2FB5FF' stroke-width='2.5'/><circle cx='168' cy='184' r='16' fill='#DDF2FF' stroke='#2FB5FF' stroke-width='2.5'/><text x='132' y='188' text-anchor='middle'>2n</text><text x='168' y='188' text-anchor='middle'>2n</text><text x='150' y='218' text-anchor='middle'>2 identical clones</text><rect x='215' y='156' width='175' height='82' rx='8' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='225' y='173' font-weight='bold'>Some organisms use both:</text><text x='225' y='188'>• malaria parasite</text><text x='225' y='202'>• fungi</text><text x='225' y='216'>• plants: seeds, and</text><text x='225' y='230'>  runners / bulbs</text><text x='10' y='252'>Sexual = variation; asexual = no variation</text></svg>
