<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='18' text-anchor='middle' font-size='14' font-weight='bold'>Monohybrid cross: Tt × Tt (F1 × F1)</text><text x='170' y='40' text-anchor='middle'>Male gametes</text><text x='170' y='62' text-anchor='middle' font-weight='bold'>T</text><text x='230' y='62' text-anchor='middle' font-weight='bold'>t</text><text x='65' y='108' text-anchor='middle'>Female</text><text x='65' y='123' text-anchor='middle'>gametes</text><text x='125' y='98' text-anchor='middle' font-weight='bold'>T</text><text x='125' y='143' text-anchor='middle' font-weight='bold'>t</text><rect x='140' y='70' width='60' height='45' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><rect x='200' y='70' width='60' height='45' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><rect x='140' y='115' width='60' height='45' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><rect x='200' y='115' width='60' height='45' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='170' y='98' text-anchor='middle' font-size='14'>TT</text><text x='230' y='98' text-anchor='middle' font-size='14'>Tt</text><text x='170' y='143' text-anchor='middle' font-size='14'>Tt</text><text x='230' y='143' text-anchor='middle' font-size='14'>tt</text><text x='275' y='90' font-size='11'>T = tall (dominant)</text><text x='275' y='108' font-size='11'>t = dwarf (recessive)</text><text x='200' y='185' text-anchor='middle'>Genotypes: 1 TT : 2 Tt : 1 tt</text><text x='200' y='205' text-anchor='middle' font-weight='bold'>Phenotypes: 3 tall : 1 dwarf</text><text x='200' y='235' text-anchor='middle' font-size='11'>Mendel's F2 peas: 787 tall : 277 dwarf (≈ 3 : 1)</text></svg>
