<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><rect x='10' y='10' width='175' height='34' rx='6' fill='#E7F6EE' stroke='#0E9F5D'/><text x='97' y='31' text-anchor='middle'>1 Hypothesis (testable)</text><line x1='97' y1='44' x2='97' y2='59' stroke='#1D1A15' marker-end='url(#a)'/><rect x='10' y='60' width='175' height='34' rx='6' fill='#FFF4DD' stroke='#E8A93A'/><text x='97' y='81' text-anchor='middle'>2 Plan: IV, DV, controls</text><line x1='97' y1='94' x2='97' y2='109' stroke='#1D1A15' marker-end='url(#a)'/><rect x='10' y='110' width='175' height='34' rx='6' fill='#E6F6FF' stroke='#2FB5FF'/><text x='97' y='131' text-anchor='middle'>3 Risk assessment</text><line x1='97' y1='144' x2='97' y2='159' stroke='#1D1A15' marker-end='url(#a)'/><rect x='10' y='160' width='175' height='34' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='97' y='181' text-anchor='middle'>4 Collect repeat data</text><line x1='97' y1='194' x2='97' y2='209' stroke='#1D1A15' marker-end='url(#a)'/><rect x='10' y='210' width='175' height='34' rx='6' fill='#EFEAFF' stroke='#7C5CFF'/><text x='97' y='231' text-anchor='middle'>5 Analyse and evaluate</text><text x='300' y='22' text-anchor='middle' font-size='12' font-weight='bold'>Example: pH and amylase</text><rect x='205' y='34' width='190' height='50' rx='6' fill='#E6F6FF' stroke='#2FB5FF'/><text x='300' y='53' text-anchor='middle' font-weight='bold'>Independent variable</text><text x='300' y='71' text-anchor='middle'>pH of buffer (you change)</text><rect x='205' y='94' width='190' height='50' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='300' y='113' text-anchor='middle' font-weight='bold'>Dependent variable</text><text x='300' y='131' text-anchor='middle'>time for starch to vanish (s)</text><rect x='205' y='154' width='190' height='78' rx='6' fill='#E7F6EE' stroke='#0E9F5D'/><text x='300' y='172' text-anchor='middle' font-weight='bold'>Control variables</text><text x='300' y='190' text-anchor='middle'>temperature</text><text x='300' y='206' text-anchor='middle'>volume of enzyme</text><text x='300' y='222' text-anchor='middle'>starch concentration</text><text x='300' y='250' text-anchor='middle'>Repeat, then calculate a mean</text></svg>
