<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0L8,4L0,8z' fill='#1D1A15'/></marker></defs><text x='200' y='14' text-anchor='middle' font-size='13' font-weight='bold'>Photosynthesis (endothermic)</text><text x='200' y='30' text-anchor='middle'>carbon dioxide + water → glucose + oxygen</text><circle cx='200' cy='50' r='9' fill='#FBE9C0' stroke='#E8A93A' stroke-width='2'/><text x='216' y='54'>light energy</text><path d='M200 61V83' stroke='#E8A93A' stroke-width='3' fill='none' marker-end='url(#a)'/><ellipse cx='200' cy='130' rx='70' ry='45' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='3'/><text x='200' y='116' text-anchor='middle' font-weight='bold'>Chloroplast</text><text x='200' y='131' text-anchor='middle'>chlorophyll</text><text x='200' y='146' text-anchor='middle'>absorbs light</text><path d='M20 112H132' stroke='#7C5CFF' stroke-width='3' fill='none' marker-end='url(#a)'/><text x='20' y='104'>carbon dioxide</text><path d='M20 150H132' stroke='#2FB5FF' stroke-width='3' fill='none' marker-end='url(#a)'/><text x='20' y='142'>water</text><path d='M268 112H380' stroke='#0E9F5D' stroke-width='3' fill='none' marker-end='url(#a)'/><text x='274' y='104'>glucose</text><path d='M268 150H380' stroke='#FF5D8F' stroke-width='3' fill='none' marker-end='url(#a)'/><text x='274' y='142'>oxygen</text><text x='200' y='192' text-anchor='middle' font-weight='bold'>Rate limited by the factor in shortest supply</text><rect x='10' y='198' width='90' height='34' rx='6' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='55' y='212' text-anchor='middle'>Temperature</text><text x='55' y='225' text-anchor='middle'>(enzymes)</text><rect x='108' y='198' width='90' height='34' rx='6' fill='#FDF1D6' stroke='#E8A93A' stroke-width='2'/><text x='153' y='212' text-anchor='middle'>Light</text><text x='153' y='225' text-anchor='middle'>intensity</text><rect x='206' y='198' width='90' height='34' rx='6' fill='#ECE7FF' stroke='#7C5CFF' stroke-width='2'/><text x='251' y='212' text-anchor='middle'>CO₂</text><text x='251' y='225' text-anchor='middle'>concentration</text><rect x='304' y='198' width='90' height='34' rx='6' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='349' y='212' text-anchor='middle'>Amount of</text><text x='349' y='225' text-anchor='middle'>chlorophyll</text><text x='200' y='250' text-anchor='middle'>Inverse square law: intensity ∝ 1 ÷ distance² (double distance → ¼)</text></svg>
