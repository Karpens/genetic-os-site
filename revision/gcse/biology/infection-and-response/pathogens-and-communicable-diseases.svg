<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a0' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M1 1L9 5L1 9' fill='none' stroke='#1D1A15' stroke-width='2'/></marker></defs><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='15' font-size='13' font-weight='bold'>Pathogens cause communicable disease</text><rect x='6' y='24' width='92' height='84' rx='8' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='52' y='40' font-weight='bold'>Viruses</text><text x='52' y='57'>measles</text><text x='52' y='71'>HIV</text><text x='52' y='85'>tobacco</text><text x='52' y='99'>mosaic virus</text><rect x='106' y='24' width='92' height='84' rx='8' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='152' y='40' font-weight='bold'>Bacteria</text><text x='152' y='57'>salmonella</text><text x='152' y='71'>gonorrhoea</text><rect x='206' y='24' width='92' height='84' rx='8' fill='#FFE6EE' stroke='#FF5D8F' stroke-width='2'/><text x='252' y='40' font-weight='bold'>Protists</text><text x='252' y='57'>malaria</text><text x='252' y='71'>spread by</text><text x='252' y='85'>mosquito</text><text x='252' y='99'>(vector)</text><rect x='306' y='24' width='92' height='84' rx='8' fill='#FDF1DA' stroke='#E8A93A' stroke-width='2'/><text x='352' y='40' font-weight='bold'>Fungi</text><text x='352' y='57'>rose black</text><text x='352' y='71'>spot</text><path d='M200 110V130' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a0)'/><rect x='14' y='134' width='112' height='28' rx='6' fill='#E4F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='70' y='152'>Air (droplets)</text><rect x='144' y='134' width='112' height='28' rx='6' fill='#E4F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='200' y='152'>Direct contact</text><rect x='274' y='134' width='112' height='28' rx='6' fill='#E4F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='330' y='152'>Water</text><path d='M200 164V182' stroke='#1D1A15' stroke-width='2' fill='none' marker-end='url(#a0)'/><rect x='14' y='184' width='372' height='66' rx='8' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='201' font-weight='bold'>Reduce spread by:</text><text x='200' y='219'>good hygiene  •  isolating infected people</text><text x='200' y='235'>destroying vectors  •  vaccination</text></g></svg>
