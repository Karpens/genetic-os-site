<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><marker id="a0" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1D1A15"/></marker></defs><g font-family="sans-serif" font-size="11" fill="#1D1A15"><text x="200" y="18" font-size="13" font-weight="bold" text-anchor="middle">Ecosystem = community + environment</text><rect x="10" y="28" width="160" height="82" rx="6" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="20" y="44" font-weight="bold">ABIOTIC (non-living)</text><text x="20" y="60">Light &amp; temperature</text><text x="20" y="74">Moisture &amp; soil pH</text><text x="20" y="88">Wind</text><text x="20" y="102">CO₂ &amp; oxygen</text><rect x="230" y="28" width="160" height="82" rx="6" fill="#E7F7EF" stroke="#0E9F5D" stroke-width="2"/><text x="240" y="44" font-weight="bold">BIOTIC (living)</text><text x="240" y="60">Food availability</text><text x="240" y="74">New predators</text><text x="240" y="88">New pathogens</text><text x="240" y="102">Competition</text><path d="M174 74H226" stroke="#1D1A15" stroke-width="2" marker-start="url(#a0)" marker-end="url(#a0)"/><text x="200" y="66" text-anchor="middle">interact</text><rect x="10" y="122" width="380" height="50" rx="6" fill="#FFF4DD" stroke="#E8A93A" stroke-width="2"/><text x="20" y="138" font-weight="bold">COMPETITION</text><text x="20" y="152">Plants: light, space, water, minerals</text><text x="20" y="166">Animals: food, mates, territory</text><rect x="10" y="180" width="185" height="70" rx="6" fill="#F0ECFF" stroke="#7C5CFF" stroke-width="2"/><text x="20" y="196" font-weight="bold">INTERDEPENDENCE</text><text x="20" y="210">Food and shelter,</text><text x="20" y="223">pollination, seed dispersal</text><text x="20" y="240">Stable community = balance</text><rect x="205" y="180" width="185" height="70" rx="6" fill="#FFE9F1" stroke="#FF5D8F" stroke-width="2"/><text x="215" y="195" font-weight="bold">ADAPTATIONS</text><text x="215" y="208">Structural – body features</text><text x="215" y="220">Behavioural – actions</text><text x="215" y="232">Functional – processes</text><text x="215" y="245">Extremophiles: harsh habitats</text></g></svg>
