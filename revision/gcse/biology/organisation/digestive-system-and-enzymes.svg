<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 310'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0L7 4L0 8z' fill='#1D1A15'/></marker></defs><g fill='none' stroke='#1D1A15' stroke-width='2'><path d='M60 28V67' stroke-width='3'/><ellipse cx='60' cy='95' rx='26' ry='28' fill='#FFF1D6' stroke='#E8A93A' stroke-width='3'/><ellipse cx='125' cy='85' rx='28' ry='16' fill='#E5F7EE' stroke='#0E9F5D'/><ellipse cx='120' cy='112' rx='7' ry='10' fill='#E5F7EE' stroke='#0E9F5D'/><ellipse cx='120' cy='145' rx='28' ry='8' fill='#F1EBFF' stroke='#7C5CFF'/><path d='M60 123V140L35 150L85 160L35 170L85 180L35 190L85 200L60 212' stroke='#FF5D8F' stroke-width='3'/><rect x='300' y='28' width='20' height='12' fill='#FFE3EC' stroke='#FF5D8F'/><path d='M310 42V57' marker-end='url(#a)'/><path d='M270 60H300V72H320V60H350V105H270Z' fill='#DDF3FF' stroke='#2FB5FF' stroke-width='3'/><path d='M357 68H323' marker-end='url(#a)'/><rect x='300' y='146' width='20' height='12' fill='#FFE3EC' stroke='#FF5D8F'/><path d='M326 148L338 160M338 148L326 160' stroke='#FF5D8F'/><path d='M270 172L295 182L303 194L318 180L350 172V212H270Z' fill='#F1EBFF' stroke='#7C5CFF' stroke-width='3'/></g><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='75' y='22'>Salivary glands: amylase</text><text x='60' y='92' text-anchor='middle'>Stomach</text><text x='60' y='106' text-anchor='middle'>protease</text><text x='160' y='82'>Liver: makes bile</text><text x='160' y='116'>Gall bladder: stores bile</text><text x='160' y='141'>Pancreas: amylase,</text><text x='160' y='153'>protease, lipase</text><text x='100' y='186'>Small intestine:</text><text x='100' y='198'>digestion ends,</text><text x='100' y='210'>food absorbed</text><text x='10' y='236'>Amylase: starch → sugars</text><text x='10' y='250'>Protease: protein → amino acids</text><text x='10' y='264'>Lipase: lipid → fatty acids + glycerol</text><text x='10' y='278'>Bile: neutralises acid, emulsifies fat</text><text x='10' y='297' font-weight='bold'>Cells → tissues → organs → organ systems</text><text x='370' y='18' text-anchor='middle' font-size='12' font-weight='bold'>Lock and key model</text><text x='330' y='38'>Substrate</text><text x='310' y='95' text-anchor='middle'>Enzyme</text><text x='360' y='72'>Active site</text><text x='270' y='122'>Specific: only the matching</text><text x='270' y='134'>substrate fits the active site</text><text x='310' y='206' text-anchor='middle'>Denatured</text><text x='270' y='226'>High temperature or extreme pH</text><text x='270' y='238'>changes the active site shape:</text><text x='270' y='250'>substrate no longer fits.</text><text x='270' y='266'>Tests: iodine = blue-black (starch)</text><text x='270' y='278'>Benedict's = brick red (sugar)</text><text x='270' y='290'>biuret = purple (protein)</text><text x='270' y='302'>ethanol = cloudy (lipid)</text></g></svg>
