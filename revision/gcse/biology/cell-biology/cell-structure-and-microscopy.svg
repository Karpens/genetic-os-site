<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 450 300' font-family='sans-serif' font-size='11' fill='#1D1A15'><g font-size='12' font-weight='bold' text-anchor='middle'><text x='65' y='18'>Animal cell (eukaryote)</text><text x='275' y='18'>Plant cell (eukaryote)</text><text x='80' y='160'>Prokaryote (bacterium)</text></g><ellipse cx='65' cy='75' rx='58' ry='42' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='3'/><circle cx='50' cy='72' r='15' fill='#E6DEFF' stroke='#7C5CFF' stroke-width='2'/><ellipse cx='88' cy='98' rx='11' ry='6' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><path d='M90 58h.1M97 62h.1M92 66h.1' stroke='#1D1A15' stroke-width='4' stroke-linecap='round'/><rect x='225' y='33' width='100' height='84' rx='8' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='3'/><ellipse cx='258' cy='78' rx='24' ry='32' fill='#DDF2FF' stroke='#2FB5FF' stroke-width='2'/><circle cx='304' cy='76' r='9' fill='#E6DEFF' stroke='#7C5CFF' stroke-width='2'/><ellipse cx='303' cy='52' rx='9' ry='5' fill='#C9EEDB' stroke='#0E9F5D' stroke-width='2'/><ellipse cx='303' cy='100' rx='9' ry='5' fill='#C9EEDB' stroke='#0E9F5D' stroke-width='2'/><g stroke='#1D1A15' stroke-width='1.2' fill='none'><path d='M106 45H130M97 62H130M64 78H130M99 98H130M70 112H130M325 38H336M312 52H336M313 76H336M258 110V128M62 211V234M116 208V254'/></g><text x='134' y='49'>cell membrane</text><text x='134' y='66'>ribosomes</text><text x='134' y='82'>nucleus</text><text x='134' y='102'>mitochondria</text><text x='134' y='116'>cytoplasm</text><text x='340' y='42'>cellulose cell wall</text><text x='340' y='56'>chloroplasts</text><text x='340' y='80'>nucleus</text><text x='258' y='141' text-anchor='middle'>permanent vacuole (cell sap)</text><rect x='15' y='172' width='130' height='56' rx='28' fill='#FFF1D6' stroke='#E8A93A' stroke-width='3'/><ellipse cx='62' cy='200' rx='26' ry='11' fill='none' stroke='#7C5CFF' stroke-width='2.5'/><circle cx='116' cy='200' r='8' fill='none' stroke='#FF5D8F' stroke-width='2.5'/><text x='15' y='246'>single DNA loop</text><text x='100' y='266'>plasmid</text><text x='15' y='289'>No nucleus; much smaller</text><rect x='175' y='150' width='265' height='128' rx='8' fill='#FFF8E8' stroke='#E8A93A' stroke-width='2.5'/><text x='187' y='170' font-size='12' font-weight='bold'>Magnification</text><text x='187' y='188'>= size of image ÷ size of real object</text><text x='187' y='206'>Image 20 mm ÷ real 0.1 mm = × 200</text><path d='M187 216H428' stroke='#E8A93A' stroke-width='2'/><text x='187' y='232'>Electron microscope vs light:</text><text x='187' y='248'>higher magnification and resolution,</text><text x='187' y='264'>so ribosomes show in detail</text></svg>
