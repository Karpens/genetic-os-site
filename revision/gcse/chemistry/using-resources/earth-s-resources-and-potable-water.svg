<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='8' y='16' font-size='12' font-weight='bold'>1. Fresh water: filter, then sterilise</text><g stroke='#1D1A15' stroke-width='2' fill='none'><rect x='8' y='24' width='80' height='30' rx='5' fill='#E6F6FF' stroke='#2FB5FF'/><rect x='108' y='24' width='80' height='30' rx='5' fill='#FFF4DD' stroke='#E8A93A'/><rect x='208' y='24' width='80' height='30' rx='5' fill='#F0ECFF' stroke='#7C5CFF'/><rect x='308' y='24' width='80' height='30' rx='5' fill='#E3F6EC' stroke='#0E9F5D'/><path d='M88 39H106M101 35L106 39L101 43'/><path d='M188 39H206M201 35L206 39L201 43'/><path d='M288 39H306M301 35L306 39L301 43'/></g><g text-anchor='middle'><text x='48' y='43'>Fresh water</text><text x='148' y='43'>Filtration</text><text x='248' y='43'>Sterilisation</text><text x='348' y='43'>Potable</text><text x='148' y='68'>removes solids</text><text x='248' y='68'>chlorine, ozone</text><text x='248' y='80'>or UV light</text><text x='348' y='68'>safe to drink</text></g><text x='8' y='104' font-size='12' font-weight='bold'>2. Little fresh water: desalination</text><g stroke='#1D1A15' stroke-width='2' fill='none'><rect x='8' y='112' width='80' height='30' rx='5' fill='#E6F6FF' stroke='#2FB5FF'/><rect x='118' y='112' width='110' height='30' rx='5' fill='#FFE6EF' stroke='#FF5D8F'/><rect x='258' y='112' width='84' height='30' rx='5' fill='#E3F6EC' stroke='#0E9F5D'/><path d='M88 127H116M111 123L116 127L111 131'/><path d='M228 127H256M251 123L256 127L251 131'/></g><g text-anchor='middle'><text x='48' y='131'>Sea water</text><text x='173' y='131'>Desalination</text><text x='300' y='131'>Potable</text></g><text x='8' y='158'>distillation or reverse osmosis: uses a lot of energy</text><text x='8' y='184' font-size='12' font-weight='bold'>3. Waste water treatment</text><g stroke='#1D1A15' stroke-width='2' fill='none'><rect x='8' y='192' width='82' height='30' rx='5' fill='#FFF4DD' stroke='#E8A93A'/><rect x='108' y='192' width='82' height='30' rx='5' fill='#F0ECFF' stroke='#7C5CFF'/><rect x='208' y='192' width='82' height='30' rx='5' fill='#E3F6EC' stroke='#0E9F5D'/><rect x='308' y='192' width='82' height='30' rx='5' fill='#E6F6FF' stroke='#2FB5FF'/><path d='M90 207H106M101 203L106 207L101 211'/><path d='M190 207H206M201 203L206 207L201 211'/><path d='M290 207H306M301 203L306 207L301 211'/></g><g text-anchor='middle'><text x='49' y='211'>Screening</text><text x='149' y='211'>Sedimentation</text><text x='249' y='211'>Biological</text><text x='349' y='211'>Released</text><text x='49' y='238'>removes debris</text><text x='149' y='238'>solids settle</text><text x='249' y='238'>microbes</text><text x='349' y='238'>to environment</text></g><text x='8' y='254'>Potable water is safe to drink but not pure H₂O</text></svg>
