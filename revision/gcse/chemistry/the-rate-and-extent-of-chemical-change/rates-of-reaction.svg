<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><rect width="400" height="260" fill="#fff"/><path d="M40 165V18M40 165H386" stroke="#1D1A15" stroke-width="2" fill="none"/><polygon points="40,12 36,20 44,20"/><polygon points="392,165 384,161 384,169"/><path d="M45 110H100C140 110 150 35 190 35C230 35 245 140 285 140H385" stroke="#FF5D8F" stroke-width="3" fill="none"/><path d="M100 110C130 110 150 70 190 70C230 70 245 140 285 140" stroke="#2FB5FF" stroke-width="3" stroke-dasharray="6 4" fill="none"/><path d="M55 108V42" stroke="#7C5CFF" stroke-width="2" fill="none"/><polygon points="55,35 51,44 59,44" fill="#7C5CFF"/><path d="M55 35H172" stroke="#7C5CFF" stroke-width="2" stroke-dasharray="4 3" fill="none"/><text x="61" y="70">Activation</text><text x="61" y="83">energy (Ea)</text><text x="45" y="127">Reactants</text><text x="335" y="157" text-anchor="middle">Products</text><text x="190" y="25" text-anchor="middle">No catalyst</text><text x="250" y="58">Catalyst: lower Ea</text><text x="250" y="71">(dashed path)</text><text x="14" y="95" text-anchor="middle" transform="rotate(-90 14 95)">Energy</text><text x="215" y="182" text-anchor="middle">Progress of reaction</text><text x="12" y="200">Rate = how fast reactant is used up / product forms</text><text x="12" y="213">Collisions must have energy of at least Ea to react</text><text x="12" y="226">Higher concentration / pressure: more frequent collisions</text><text x="12" y="239">Higher temperature: more frequent AND more energetic</text><text x="12" y="252">Larger surface area: more exposed. Catalyst: lower Ea</text></svg>
