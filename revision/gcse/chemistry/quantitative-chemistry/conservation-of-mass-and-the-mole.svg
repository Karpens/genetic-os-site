<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect x='10' y='10' width='140' height='52' rx='6' fill='#2FB5FF' fill-opacity='0.15' stroke='#2FB5FF' stroke-width='2'/><text x='80' y='26' text-anchor='middle' font-weight='bold'>Reactants</text><text x='80' y='42' text-anchor='middle'>2Mg + O₂</text><text x='80' y='57' text-anchor='middle'>48 g + 32 g = 80 g</text><path d='M158 44 L242 44 M232 38 L242 44 L232 50' fill='none' stroke='#7C5CFF' stroke-width='3'/><text x='200' y='20' text-anchor='middle'>atoms</text><text x='200' y='34' text-anchor='middle'>rearranged</text><text x='200' y='62' text-anchor='middle'>same mass</text><rect x='250' y='10' width='140' height='52' rx='6' fill='#0E9F5D' fill-opacity='0.15' stroke='#0E9F5D' stroke-width='2'/><text x='320' y='26' text-anchor='middle' font-weight='bold'>Product</text><text x='320' y='42' text-anchor='middle'>2MgO</text><text x='320' y='57' text-anchor='middle'>2 × 40 = 80 g</text><text x='100' y='98' text-anchor='middle' font-weight='bold'>mole triangle</text><polygon points='100,105 20,215 180,215' fill='#E8A93A' fill-opacity='0.15' stroke='#E8A93A' stroke-width='3'/><path d='M60 160 L140 160 M100 160 L100 215' fill='none' stroke='#E8A93A' stroke-width='2'/><text x='100' y='150' text-anchor='middle'>mass</text><text x='60' y='196' text-anchor='middle'>Mr</text><text x='140' y='196' text-anchor='middle'>moles</text><rect x='200' y='80' width='190' height='70' rx='6' fill='#0E9F5D' fill-opacity='0.15' stroke='#0E9F5D' stroke-width='2'/><text x='210' y='97' font-weight='bold'>Mr of H₂O</text><text x='210' y='113'>= (2 × 1) + 16 = 18</text><text x='210' y='129'>1 mole = 18 g of H₂O</text><text x='210' y='144'>moles = mass ÷ Mr</text><rect x='200' y='160' width='190' height='54' rx='6' fill='#FF5D8F' fill-opacity='0.15' stroke='#FF5D8F' stroke-width='2'/><text x='210' y='177'>1 mole = 6.02 × 10²³</text><text x='210' y='192'>particles</text><text x='210' y='207'>(Avogadro's constant)</text><text x='200' y='234'>Open container: gas escapes,</text><text x='200' y='249'>so mass appears to drop</text></svg>
