<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' font-family='sans-serif' font-size='13' font-weight='bold' text-anchor='middle' fill='#1D1A15'>The atmosphere and climate change</text><circle cx='40' cy='42' r='13' fill='#FFF1CC' stroke='#E8A93A' stroke-width='2'/><text x='58' y='46' font-family='sans-serif' font-size='11' fill='#1D1A15'>Sun</text><rect x='10' y='90' width='185' height='50' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2' stroke-dasharray='5 3'/><text x='128' y='109' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>Greenhouse gases</text><text x='128' y='125' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>CO₂  CH₄  H₂O</text><rect x='10' y='195' width='185' height='22' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='102' y='210' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>Earth's surface</text><path d='M40 58 L40 190' stroke='#E8A93A' stroke-width='3' fill='none'/><path d='M34 180 L40 192 L46 180 Z' fill='#E8A93A' stroke='#E8A93A' stroke-width='2'/><text x='48' y='76' font-family='sans-serif' font-size='11' fill='#1D1A15'>Sunlight</text><path d='M60 192 L60 144' stroke='#FF5D8F' stroke-width='3' fill='none'/><path d='M54 154 L60 142 L66 154 Z' fill='#FF5D8F' stroke='#FF5D8F' stroke-width='2'/><text x='68' y='164' font-family='sans-serif' font-size='11' fill='#1D1A15'>infrared</text><path d='M185 142 L185 190' stroke='#FF5D8F' stroke-width='3' fill='none'/><path d='M179 180 L185 192 L191 180 Z' fill='#FF5D8F' stroke='#FF5D8F' stroke-width='2'/><text x='178' y='182' font-family='sans-serif' font-size='11' text-anchor='end' fill='#1D1A15'>re-emitted</text><text x='215' y='36' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Atmosphere today</text><rect x='215' y='44' width='128' height='22' fill='#EEE8FF' stroke='#7C5CFF' stroke-width='2'/><rect x='343' y='44' width='32' height='22' fill='#FDE7C2' stroke='#E8A93A' stroke-width='2'/><text x='279' y='59' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>N₂ ~80%</text><text x='359' y='59' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>O₂</text><text x='359' y='81' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>~20%</text><text x='215' y='81' font-family='sans-serif' font-size='11' fill='#1D1A15'>+ trace CO₂, Ar</text><text x='215' y='106' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Early atmosphere</text><rect x='215' y='112' width='160' height='22' fill='#FFF0D6' stroke='#E8A93A' stroke-width='2'/><text x='295' y='127' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>mostly CO₂ (volcanoes)</text><text x='215' y='150' font-family='sans-serif' font-size='11' fill='#1D1A15'>little or no O₂</text><text x='215' y='170' font-family='sans-serif' font-size='11' font-weight='bold' fill='#1D1A15'>Over billions of years:</text><text x='215' y='185' font-family='sans-serif' font-size='11' fill='#1D1A15'>Algae/plants: photosynthesis</text><text x='215' y='199' font-family='sans-serif' font-size='11' fill='#1D1A15'>makes O₂, so O₂ rises</text><text x='215' y='213' font-family='sans-serif' font-size='11' fill='#1D1A15'>CO₂ falls: oceans, limestone,</text><text x='215' y='227' font-family='sans-serif' font-size='11' fill='#1D1A15'>fossil fuels</text><text x='200' y='243' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>More CO₂ and CH₄ from humans: global warming</text><text x='200' y='257' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>Effects: sea level rise, extreme weather, species move</text></svg>
