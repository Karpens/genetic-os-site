lten compound</text><text x='212' y='87'>(lots of energy needed)</text><path d='M196 149 H204 V211 H196' fill='none' stroke='#2FB5FF' stroke-width='2'/><text x='212' y='175'>Heat oxide with carbon</text><text x='212' y='191'>(carbon reduces it)</text><path d='M196 225 H204' fill='none' stroke='#E8A93A' stroke-width='2'/><text x='212' y='229'>Found as the metal</text><text x='8' y='264'>Oxidation: gain O / lose e⁻  Reduction: lose O / gain e⁻</text><text x='8' y='282'>Fe₂O₃ + 3CO → 2Fe + 3CO₂ (iron oxide reduced)</text><text x='8' y='299'>Displacement: Mg + CuSO₄ → MgSO₄ + Cu</text></svg>
