<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='200' y='18' text-anchor='middle' font-size='13' font-weight='bold'>AQA Paper 3 Section A: working method</text><rect x='15' y='30' width='110' height='60' rx='6' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><text x='22' y='46' font-weight='bold'>1 Understand</text><text x='22' y='61'>issue, place,</text><text x='22' y='75'>scale, timing</text><rect x='145' y='30' width='110' height='60' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='152' y='46' font-weight='bold'>2 Analyse</text><text x='152' y='61'>maps, graphs,</text><text x='152' y='75'>quote data</text><rect x='275' y='30' width='110' height='60' rx='6' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='282' y='46' font-weight='bold'>3 Stakeholders</text><text x='282' y='61'>who gains/loses?</text><text x='282' y='75'>views, bias</text><rect x='275' y='150' width='110' height='60' rx='6' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='282' y='166' font-weight='bold'>4 Options</text><text x='282' y='181'>costs, benefits,</text><text x='282' y='195'>sustainability</text><rect x='145' y='150' width='110' height='60' rx='6' fill='#ECE6FF' stroke='#7C5CFF' stroke-width='2'/><text x='152' y='166' font-weight='bold'>5 Decide</text><text x='152' y='181'>pick one option</text><text x='152' y='195'>link to evidence</text><rect x='15' y='150' width='110' height='60' rx='6' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><text x='22' y='166' font-weight='bold'>6 Justify</text><text x='22' y='181'>reject others,</text><text x='22' y='195'>give a caveat</text><g fill='none' stroke='#1D1A15' stroke-width='2'><path d='M127 60 H143 M138 56 L143 60 L138 64'/><path d='M257 60 H273 M268 56 L273 60 L268 64'/><path d='M330 92 V148 M326 143 L330 148 L334 143'/><path d='M273 180 H257 M262 176 L257 180 L262 184'/><path d='M143 180 H127 M132 176 L127 180 L132 184'/></g><text x='200' y='235' text-anchor='middle'>Paper 3: 1 h 15 min, 76 marks; Section A = 37 marks</text><text x='200' y='250' text-anchor='middle'>Final 9-mark question: decision + evidence + why others rejected</text></g></svg>
