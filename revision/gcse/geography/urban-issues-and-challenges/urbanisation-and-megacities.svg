<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='200' y='16' font-size='13' font-weight='bold' text-anchor='middle'>Urbanisation and megacities</text><rect x='10' y='26' width='100' height='74' rx='6' fill='#E7F6EE' stroke='#0E9F5D' stroke-width='2'/><text x='60' y='41' font-weight='bold' text-anchor='middle'>RURAL</text><text x='60' y='55' text-anchor='middle'>Push factors:</text><text x='60' y='68' text-anchor='middle'>few jobs,</text><text x='60' y='81' text-anchor='middle'>poor services</text><text x='60' y='94' text-anchor='middle'>drought</text><path d='M112 63 H170 M162 58 L170 63 L162 68' fill='none' stroke='#1D1A15' stroke-width='2'/><text x='141' y='56' text-anchor='middle'>migrate</text><rect x='172' y='26' width='110' height='74' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='227' y='41' font-weight='bold' text-anchor='middle'>CITY</text><text x='227' y='55' text-anchor='middle'>Pull factors:</text><text x='227' y='68' text-anchor='middle'>jobs, schools,</text><text x='227' y='81' text-anchor='middle'>healthcare,</text><text x='227' y='94' text-anchor='middle'>services</text><rect x='300' y='26' width='90' height='74' rx='6' fill='#FFE6EE' stroke='#FF5D8F' stroke-width='2'/><text x='345' y='41' font-weight='bold' text-anchor='middle'>NATURAL</text><text x='345' y='54' font-weight='bold' text-anchor='middle'>INCREASE</text><text x='345' y='72' text-anchor='middle'>more births</text><text x='345' y='85' text-anchor='middle'>than deaths</text><path d='M300 63 H284 M292 58 L284 63 L292 68' fill='none' stroke='#1D1A15' stroke-width='2'/><rect x='10' y='108' width='380' height='20' rx='6' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='200' y='122' text-anchor='middle'>MEGACITY = over 10 million people (e.g. Lagos, Mumbai)</text><path d='M100 129 V141 M96 136 L100 141 L104 136 M300 129 V141 M296 136 L300 141 L304 136' fill='none' stroke='#1D1A15' stroke-width='2'/><rect x='10' y='142' width='185' height='78' rx='6' fill='#E7F6EE' stroke='#0E9F5D' stroke-width='2'/><text x='18' y='157' font-weight='bold'>Opportunities</text><text x='18' y='171'>Access to services</text><text x='18' y='184'>Healthcare and education</text><text x='18' y='197'>Employment</text><text x='18' y='210'>Improved infrastructure</text><rect x='205' y='142' width='185' height='78' rx='6' fill='#FFE6EE' stroke='#FF5D8F' stroke-width='2'/><text x='213' y='157' font-weight='bold'>Challenges</text><text x='213' y='171'>Squatter settlements</text><text x='213' y='184'>Unemployment, informal work</text><text x='213' y='197'>Congestion and waste</text><text x='213' y='210'>Water and air pollution</text><rect x='10' y='226' width='380' height='26' rx='6' fill='#EEE9FF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='243' text-anchor='middle'>Planning: site and service, self-help schemes, sanitation</text></g></svg>
