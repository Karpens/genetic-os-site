<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='17' font-size='13' font-weight='bold'>Planning: effect of temperature on catalase</text><rect x='10' y='28' width='185' height='50' rx='6' fill='#E6F6FF' stroke='#2FB5FF'/><text x='102' y='46' font-weight='bold'>Independent variable</text><text x='102' y='63'>temperature (10–60 °C)</text><rect x='205' y='28' width='185' height='50' rx='6' fill='#E3F6EC' stroke='#0E9F5D'/><text x='297' y='46' font-weight='bold'>Dependent variable</text><text x='297' y='63'>O₂ volume in 60 s (cm³)</text><rect x='10' y='90' width='380' height='52' rx='6' fill='#FFF4DC' stroke='#E8A93A'/><text x='200' y='108' font-weight='bold'>Control variables (keep constant)</text><text x='200' y='126'>pH · H₂O₂ concentration · enzyme volume · time</text><rect x='10' y='154' width='185' height='44' rx='6' fill='#F0EBFF' stroke='#7C5CFF'/><text x='102' y='172' font-weight='bold'>Control experiment</text><text x='102' y='188'>boiled catalase → no O₂</text><rect x='205' y='154' width='185' height='44' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='297' y='172' font-weight='bold'>Risk assessment</text><text x='297' y='188'>H₂O₂ irritant: wear goggles</text><rect x='10' y='208' width='380' height='42' rx='6' fill='#fff' stroke='#1D1A15'/><text x='200' y='226' font-weight='bold'>Repeat at least 3 times → calculate mean</text><text x='200' y='242'>identify anomalies (improves reliability)</text></g></svg>
