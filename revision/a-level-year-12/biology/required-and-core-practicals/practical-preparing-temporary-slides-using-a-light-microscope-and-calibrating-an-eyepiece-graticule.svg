<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Calibrating an eyepiece graticule</text><text x='40' y='42' font-family='sans-serif' font-size='11' fill='#1D1A15'>Stage micrometer (1 division = 10 µm)</text><text x='40' y='57' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>0</text><text x='200' y='57' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>80 µm</text><path d='M40 75H200M40 62v13M60 62v13M80 62v13M100 62v13M120 62v13M140 62v13M160 62v13M180 62v13M200 62v13' stroke='#2FB5FF' stroke-width='2' fill='none'/><text x='40' y='104' font-family='sans-serif' font-size='11' fill='#1D1A15'>Eyepiece graticule (arbitrary units)</text><path d='M40 131H200M40 118v13M56 118v13M72 118v13M88 118v13M104 118v13M120 118v13M136 118v13M152 118v13M168 118v13M184 118v13M200 118v13' stroke='#7C5CFF' stroke-width='2' fill='none'/><text x='40' y='146' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>0</text><text x='200' y='146' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>10</text><path d='M40 77V116M200 77V116' stroke='#E8A93A' stroke-width='1.5' stroke-dasharray='4 3' fill='none'/><text x='225' y='70' font-family='sans-serif' font-size='11' fill='#1D1A15'>Line up the zero marks,</text><text x='225' y='85' font-family='sans-serif' font-size='11' fill='#1D1A15'>then find a second point</text><text x='225' y='100' font-family='sans-serif' font-size='11' fill='#1D1A15'>where lines match exactly</text><text x='225' y='115' font-family='sans-serif' font-size='11' fill='#1D1A15'>and count divisions.</text><rect x='15' y='160' width='370' height='90' rx='6' fill='#0E9F5D' fill-opacity='0.1' stroke='#0E9F5D'/><text x='28' y='181' font-family='sans-serif' font-size='12' fill='#1D1A15'>10 graticule divisions = 80 µm</text><text x='28' y='199' font-family='sans-serif' font-size='12' fill='#1D1A15'>1 graticule division = 80 ÷ 10 = 8 µm</text><text x='28' y='217' font-family='sans-serif' font-size='12' fill='#1D1A15'>Cell 5 divisions long = 5 × 8 = 40 µm</text><text x='28' y='238' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Recalibrate for every objective lens</text></svg>
