<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#2FB5FF'/></marker><marker id='b' viewBox='0 0 10 10' refX='8' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#FF5D8F'/></marker></defs><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Size, SA:V and gas exchange</text><line x1='198' y1='26' x2='198' y2='190' stroke='#1D1A15' stroke-width='1' opacity='.25'/><text x='100' y='38' text-anchor='middle' font-weight='bold'>Cube side → SA : V</text><rect x='15' y='110' width='20' height='20' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><rect x='50' y='90' width='40' height='40' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><rect x='105' y='70' width='60' height='60' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='2'/><text x='25' y='146' text-anchor='middle'>1 cm</text><text x='70' y='146' text-anchor='middle'>2 cm</text><text x='135' y='146' text-anchor='middle'>3 cm</text><text x='25' y='162' text-anchor='middle' font-weight='bold'>6 : 1</text><text x='70' y='162' text-anchor='middle' font-weight='bold'>3 : 1</text><text x='135' y='162' text-anchor='middle' font-weight='bold'>2 : 1</text><text x='100' y='180' text-anchor='middle'>Ratio falls as size rises</text><text x='10' y='200' font-weight='bold'>Good exchange surface:</text><text x='10' y='214'>large area, thin (short</text><text x='10' y='228'>distance), steep gradient</text><text x='10' y='244'>Insects: spiracle → trachea → tracheole</text><text x='10' y='256'>Leaf: stomata → air spaces → mesophyll</text><text x='300' y='36' text-anchor='middle' font-weight='bold'>Fish gill lamella: countercurrent</text><text x='216' y='54'>Water (O₂-rich) flows this way</text><line x1='216' y1='62' x2='388' y2='62' stroke='#2FB5FF' stroke-width='3' marker-end='url(#a)'/><text x='225' y='78' text-anchor='middle'>100%</text><text x='302' y='78' text-anchor='middle'>65%</text><text x='372' y='78' text-anchor='middle'>30%</text><rect x='216' y='84' width='172' height='44' rx='6' fill='#FFE9F0' stroke='#FF5D8F' stroke-width='2'/><text x='302' y='99' text-anchor='middle'>blood in lamella</text><line x1='384' y1='113' x2='220' y2='113' stroke='#FF5D8F' stroke-width='3' marker-end='url(#b)'/><text x='225' y='144' text-anchor='middle'>90%</text><text x='302' y='144' text-anchor='middle'>55%</text><text x='372' y='144' text-anchor='middle'>20%</text><text x='216' y='162'>Numbers = % O₂ saturation</text><text x='216' y='178'>Opposite flows: water always</text><text x='216' y='191'>has more O₂ than blood</text><text x='216' y='208'>Parallel flow stops at ~50%</text><text x='216' y='222'>Countercurrent absorbs more</text></svg>
