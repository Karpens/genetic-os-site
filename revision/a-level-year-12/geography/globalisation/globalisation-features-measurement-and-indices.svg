<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='100' y='8' width='200' height='34' rx='6' fill='#EDE7FF' stroke='#7C5CFF'/><text x='200' y='23' text-anchor='middle' font-weight='bold'>KOF Globalisation Index</text><text x='200' y='37' text-anchor='middle' font-size='11'>score 0-100 per country</text><line x1='200' y1='42' x2='68' y2='85' stroke='#1D1A15'/><line x1='200' y1='42' x2='200' y2='85' stroke='#1D1A15'/><line x1='200' y1='42' x2='332' y2='85' stroke='#1D1A15'/><rect x='8' y='85' width='120' height='80' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='68' y='102' text-anchor='middle' font-weight='bold'>Economic</text><text x='68' y='119' text-anchor='middle' font-size='11'>Trade, FDI,</text><text x='68' y='134' text-anchor='middle' font-size='11'>portfolio flows,</text><text x='68' y='149' text-anchor='middle' font-size='11'>tariffs</text><rect x='140' y='85' width='120' height='80' rx='6' fill='#FFF4DD' stroke='#E8A93A'/><text x='200' y='102' text-anchor='middle' font-weight='bold'>Social</text><text x='200' y='119' text-anchor='middle' font-size='11'>Internet use,</text><text x='200' y='134' text-anchor='middle' font-size='11'>tourists, migrants,</text><text x='200' y='149' text-anchor='middle' font-size='11'>cultural goods</text><rect x='272' y='85' width='120' height='80' rx='6' fill='#E3F5FF' stroke='#2FB5FF'/><text x='332' y='102' text-anchor='middle' font-weight='bold'>Political</text><text x='332' y='119' text-anchor='middle' font-size='11'>Embassies,</text><text x='332' y='134' text-anchor='middle' font-size='11'>int. organisations,</text><text x='332' y='149' text-anchor='middle' font-size='11'>treaties</text><rect x='8' y='180' width='384' height='72' rx='6' fill='#FFE6EE' stroke='#FF5D8F'/><text x='200' y='200' text-anchor='middle' font-size='11'>De facto = actual flows (e.g. trade as % of GDP)</text><text x='200' y='218' text-anchor='middle' font-size='11'>De jure = policies (e.g. tariffs, capital controls)</text><text x='200' y='236' text-anchor='middle' font-size='11' font-weight='bold'>Higher score = more globalised</text></svg>
