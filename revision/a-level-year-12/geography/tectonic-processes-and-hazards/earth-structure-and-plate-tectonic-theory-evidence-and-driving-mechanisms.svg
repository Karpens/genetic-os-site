<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='10' y='18' font-family='sans-serif' font-size='13' fill='#1D1A15'>Structure of the Earth (not to scale)</text><circle cx='110' cy='130' r='100' fill='#1D1A15' fill-opacity='0.15' stroke='#1D1A15'/><circle cx='110' cy='130' r='90' fill='#E8A93A' fill-opacity='0.35' stroke='#E8A93A'/><circle cx='110' cy='130' r='55' fill='#FF5D8F' fill-opacity='0.25' stroke='#FF5D8F'/><circle cx='110' cy='130' r='28' fill='#FF5D8F' fill-opacity='0.55' stroke='#FF5D8F'/><line x1='165' y1='52' x2='222' y2='52' stroke='#1D1A15'/><text x='226' y='56' font-family='sans-serif' font-size='12' fill='#1D1A15'>Crust: 5–70 km</text><line x1='150' y1='95' x2='222' y2='95' stroke='#1D1A15'/><text x='226' y='99' font-family='sans-serif' font-size='12' fill='#1D1A15'>Mantle: to 2900 km</text><text x='226' y='113' font-family='sans-serif' font-size='11' fill='#1D1A15'>(solid, flows slowly)</text><line x1='130' y1='130' x2='222' y2='130' stroke='#1D1A15'/><text x='226' y='134' font-family='sans-serif' font-size='12' fill='#1D1A15'>Inner core: solid</text><text x='226' y='148' font-family='sans-serif' font-size='11' fill='#1D1A15'>5150–6371 km</text><line x1='140' y1='170' x2='222' y2='170' stroke='#1D1A15'/><text x='226' y='174' font-family='sans-serif' font-size='12' fill='#1D1A15'>Outer core: liquid</text><text x='226' y='188' font-family='sans-serif' font-size='11' fill='#1D1A15'>2900–5150 km</text><text x='226' y='222' font-family='sans-serif' font-size='11' fill='#1D1A15'>Lithosphere = crust +</text><text x='226' y='236' font-family='sans-serif' font-size='11' fill='#1D1A15'>rigid upper mantle</text></svg>
