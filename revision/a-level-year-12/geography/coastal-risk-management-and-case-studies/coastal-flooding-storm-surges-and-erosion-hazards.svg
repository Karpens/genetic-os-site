<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0 0L10 5L0 10z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='20' y='18' font-size='14' font-weight='bold'>Storm surge formation</text><ellipse cx='90' cy='55' rx='70' ry='22' fill='#EFEAFF' stroke='#7C5CFF'/><text x='90' y='52' text-anchor='middle'>Low pressure</text><text x='90' y='67' text-anchor='middle'>(e.g. 960 hPa)</text><text x='180' y='50' font-size='11'>Each 1 hPa fall lifts</text><text x='180' y='64' font-size='11'>sea level by ~1 cm</text><line x1='40' y1='112' x2='200' y2='112' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='40' y='104' font-size='11'>Strong onshore wind</text><path d='M20 170 C150 170 230 150 320 135 L320 235 L20 235 Z' fill='#DDF3FF' stroke='#2FB5FF'/><line x1='20' y1='170' x2='320' y2='170' stroke='#1D1A15' stroke-dasharray='5 4'/><rect x='320' y='160' width='70' height='75' fill='#FFF1D2' stroke='#E8A93A'/><rect x='320' y='152' width='60' height='8' fill='#BFE8FF'/><text x='326' y='146' font-size='11'>Flooding</text><text x='328' y='190' font-size='11'>Low-lying</text><text x='328' y='205' font-size='11'>land</text><line x1='290' y1='168' x2='290' y2='146' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='215' y='128' font-size='11'>Surge height</text><text x='30' y='192' font-size='11'>Dashed line = predicted tide level</text><text x='30' y='210' font-size='11'>Surge funnels up narrowing basins</text><text x='20' y='252' font-size='11'>Surge + high spring tide = greatest flood risk</text></svg>
