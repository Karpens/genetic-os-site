<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0L8,4L0,8z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><rect x='90' y='8' width='220' height='44' rx='8' fill='#E6F6FF' stroke='#2FB5FF'/><text x='200' y='26' font-weight='bold'>ATMOSPHERE</text><text x='200' y='42'>CO₂ · CH₄ · water vapour</text><ellipse cx='200' cy='130' rx='55' ry='28' fill='#FFE3EC' stroke='#FF5D8F'/><text x='200' y='127'>Global</text><text x='200' y='141'>temperature</text><line x1='200' y1='52' x2='200' y2='100' stroke='#1D1A15' marker-end='url(#a)'/><text x='206' y='80' text-anchor='start'>greenhouse effect</text><rect x='6' y='105' width='104' height='50' rx='8' fill='#E6F6FF' stroke='#2FB5FF'/><text x='58' y='122' font-weight='bold'>OCEANS</text><text x='58' y='136'>warmer = less</text><text x='58' y='149'>CO₂ dissolves</text><line x1='145' y1='130' x2='112' y2='130' stroke='#1D1A15' marker-end='url(#a)'/><rect x='290' y='105' width='104' height='50' rx='8' fill='#DDF5E8' stroke='#0E9F5D'/><text x='342' y='122' font-weight='bold'>VEGETATION</text><text x='342' y='136'>photosynthesis</text><text x='342' y='149'>&amp; transpiration</text><line x1='255' y1='130' x2='288' y2='130' stroke='#1D1A15' marker-end='url(#a)'/><line x1='120' y1='52' x2='70' y2='103' stroke='#1D1A15' marker-end='url(#a)'/><text x='6' y='80' text-anchor='start'>CO₂ sink</text><line x1='280' y1='52' x2='330' y2='103' stroke='#1D1A15' marker-end='url(#a)'/><text x='394' y='80' text-anchor='end'>CO₂ sink</text><rect x='90' y='190' width='220' height='40' rx='8' fill='#F1ECFF' stroke='#7C5CFF'/><text x='200' y='207' font-weight='bold'>ICE &amp; PERMAFROST</text><text x='200' y='222'>melt: less albedo, CH₄ released</text><line x1='200' y1='158' x2='200' y2='190' stroke='#1D1A15' marker-end='url(#a)'/><text x=