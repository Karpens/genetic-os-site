<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L7,4L0,8z" fill="#1D1A15"/></marker></defs><rect x="10" y="8" width="170" height="52" rx="6" fill="#E8F7EF" stroke="#0E9F5D" stroke-width="2"/><text x="20" y="28" font-weight="bold">Endogenous (internal)</text><text x="20" y="46">location, land use, people</text><rect x="220" y="8" width="170" height="52" rx="6" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="230" y="28" font-weight="bold">Exogenous (links)</text><text x="230" y="46">flows: people, money, ideas</text><path d="M95 60L160 92" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M305 60L240 92" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><ellipse cx="200" cy="115" rx="65" ry="32" fill="#FFF3DB" stroke="#E8A93A" stroke-width="3"/><text x="200" y="112" font-size="14" font-weight="bold" text-anchor="middle">PLACE</text><text x="200" y="128" text-anchor="middle">sense of place</text><path d="M160 140L75 170" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M200 147L200 170" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M240 140L325 170" stroke="#1D1A15" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="5" y="172" width="125" height="78" rx="6" fill="#E8F7EF" stroke="#0E9F5D" stroke-width="2"/><text x="15" y="190" font-weight="bold">INSIDER view</text><text x="15" y="208">lives in / belongs,</text><text x="15" y="224">belonging, attachment</text><rect x="140" y="172" width="120" height="78" rx="6" fill="#F0EBFF" stroke="#7C5CFF" stroke-width="2"/><text x="150" y="188" font-weight="bold">REPRESENTED</text><text x="150" y="204">census statistics</text><text x="150" y="220">vs photos, film,</text><text x="150" y="236">art, social media</text><rect x="270" y="172" width="125" height="78" rx="6" fill="#FFE9F0" stroke="#FF5D8F" stroke-width="2"/><text x="280" y="190" font-weight="bold">OUTSIDER view</text><text x="280" y="208">visitor or excluded,</text><text x="280" y="224">sees it differently</text></svg>
