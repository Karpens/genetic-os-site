<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='5' y='5' width='100' height='34' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><rect x='125' y='5' width='150' height='34' rx='6' fill='#F0EBFF' stroke='#7C5CFF' stroke-width='2'/><rect x='295' y='5' width='100' height='34' rx='6' fill='#E0F6EA' stroke='#0E9F5D' stroke-width='2'/><path d='M107 22H123M118 17l6 5-6 5M277 22H293M288 17l6 5-6 5' fill='none' stroke='#1D1A15' stroke-width='2'/><g text-anchor='middle'><text x='55' y='19' font-weight='bold'>INPUTS</text><text x='55' y='33'>energy, sediment</text><text x='200' y='19' font-weight='bold'>PROCESSES + STORES</text><text x='200' y='33'>erode, move, deposit</text><text x='345' y='19' font-weight='bold'>OUTPUTS</text><text x='345' y='33'>sediment out</text><text x='200' y='54' font-style='italic'>all within a sediment cell (self-contained coast section)</text></g><path d='M10 160H214L212 182L10 212Z' fill='#DDF1FF'/><path d='M10 212L212 182L226 180V164L214 162V78H390V228H10Z' fill='#FBEBC8' stroke='#1D1A15' stroke-width='2.5' stroke-linejoin='round'/><path d='M10 160q10-8 20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0t20 0' fill='none' stroke='#2FB5FF' stroke-width='2.5'/><path d='M130 148H206M200 143l6 5-6 5' fill='none' stroke='#2FB5FF' stroke-width='2.5'/><path d='M206 88V140M201 134l5 6 5-6' fill='none' stroke='#FF5D8F' stroke-width='2.5'/><path d='M62 188L64 201' fill='none' stroke='#1D1A15' stroke-width='2'/><text x='14' y='68' font-weight='bold'>MARINE (wave energy)</text><text x='14' y='82'>erosion: hydraulic action,</text><text x='14' y='96'>abrasion, attrition, solution</text><text x='14' y='110'>transport: longshore drift,</text><text x='14' y='124'>traction, saltation, suspension</text><text x='14' y='138'>deposition when energy falls</text><text x='14' y='184'>wave-cut platform</text><text x='300' y='72' font-size='12' font-weight='bold'>cliff</text><text x='232' y='94' font-weight='bold'>SUB-AERIAL (from above)</text><text x='232' y='108'>weathering: mechanical,</text><text x='232' y='122'>chemical, biological</text><text x='232' y='136'>mass movement: rockfall,</text><text x='232' y='150'>slumping, landslide</text><text x='232' y='176'>wave-cut notch</text><text x='232' y='194' font-weight='bold'>Sea level change:</text><text x='232' y='208'>eustatic = water volume</text><text x='232' y='222'>isostatic = land moves</text><text x='10' y='243'>Erosional: platform, headland/bay, cave → arch → stack → stump</text><text x='10' y='256'>Depositional: beach, spit, tombolo, bar, dunes</text></svg>
