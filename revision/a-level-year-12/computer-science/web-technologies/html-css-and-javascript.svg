<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle'><text x='200' y='20' font-size='14' font-weight='bold'>Three layers of a web page</text><rect x='15' y='35' width='110' height='85' rx='6' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='70' y='55' font-weight='bold' font-size='14'>HTML</text><text x='70' y='74'>structure and</text><text x='70' y='88'>content</text><text x='70' y='108' font-size='11'>&lt;h1&gt; &lt;p&gt; &lt;a&gt;</text><rect x='145' y='35' width='110' height='85' rx='6' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='200' y='55' font-weight='bold' font-size='14'>CSS</text><text x='200' y='74'>presentation</text><text x='200' y='88'>colour, layout</text><text x='200' y='108' font-size='11'>h1 {color:blue;}</text><rect x='275' y='35' width='110' height='85' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><text x='330' y='55' font-weight='bold' font-size='14'>JavaScript</text><text x='330' y='74'>behaviour and</text><text x='330' y='88'>interaction</text><text x='330' y='108' font-size='11'>onclick, validation</text><line x1='70' y1='122' x2='140' y2='163' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='200' y1='122' x2='200' y2='163' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='330' y1='122' x2='260' y2='163' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='60' y='165' width='280' height='45' rx='6' fill='#F1ECFF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='184'>Browser builds the DOM and renders</text><text x='200' y='200'>the page for the user</text><text x='200' y='238' font-size='11'>Separate files: index.html, style.css, script.js</text></g></svg>
