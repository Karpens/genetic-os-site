<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="11" fill="#1D1A15"><rect width="400" height="260" fill="#fff"/><path d="M30 215 L30 28 M25 38 L30 28 L35 38" fill="none" stroke="#1D1A15" stroke-width="2"/><path d="M30 215 L202 215 M192 210 L202 215 L192 220" fill="none" stroke="#1D1A15" stroke-width="2"/><text x="115" y="235" text-anchor="middle">Input size n</text><text x="12" y="125" text-anchor="middle" transform="rotate(-90 12 125)">Time / steps</text><path d="M30 200 L195 200" fill="none" stroke="#0E9F5D" stroke-width="2.5"/><text x="199" y="204" fill="#0E9F5D">O(1)</text><path d="M30 215 C45 185 80 178 195 168" fill="none" stroke="#2FB5FF" stroke-width="2.5"/><text x="199" y="172" fill="#1D1A15">O(log n)</text><path d="M30 215 L195 135" fill="none" stroke="#E8A93A" stroke-width="2.5"/><text x="199" y="139">O(n)</text><path d="M30 215 Q120 185 195 90" fill="none" stroke="#7C5CFF" stroke-width="2.5"/><text x="199" y="94">O(n log n)</text><path d="M30 215 Q110 208 160 32" fill="none" stroke="#FF5D8F" stroke-width="2.5"/><text x="166" y="34">O(n²)</text><path d="M30 215 Q75 212 112 32" fill="none" stroke="#1D1A15" stroke-width="2.5"/><text x="106" y="28" text-anchor="end">O(2ⁿ)</text><rect x="260" y="36" width="136" height="34" rx="5" fill="#FFF6E3" stroke="#E8A93A" stroke-width="2"/><text x="265" y="50">Linear search</text><text x="391" y="50" text-anchor="end">O(n)</text><text x="265" y="64">works unsorted</text><rect x="260" y="74" width="136" height="34" rx="5" fill="#E6F6FF" stroke="#2FB5FF" stroke-width="2"/><text x="265" y="88">Binary search</text><text x="391" y="88" text-anchor="end">O(log n)</text><text x="265" y="102">halves; sorted only</text><rect x="260" y="112" width="136" height="34" rx="5" fill="#FFE9F0" stroke="#FF5D8F" stroke-width="2"/><text x="265" y="126">Bubble sort</text><text x="391" y="126" text-anchor="end">O(n²)</text><text x="265" y="140">swap neighbours</text><rect x="260" y="150" width="136" height="34" rx="5" fill="#FFE9F0" stroke="#FF5D8F" stroke-width="2"/><text x="265" y="164">Insertion sort</text><text x="391" y="164" text-anchor="end">O(n²)</text><text x="265" y="178">build sorted part</text><rect x="260" y="188" width="136" height="34" rx="5" fill="#EFE9FF" stroke="#7C5CFF" stroke-width="2"/><text x="265" y="202">Merge sort</text><text x="391" y="202" text-anchor="end">O(n log n)</text><text x="265" y="216">divide and conquer</text><text x="200" y="254" text-anchor="middle">Big O ignores constants &amp; lower terms</text></svg>
