<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='b' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0L7 4L0 8z' fill='#2FB5FF'/></marker><marker id='g' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0L7 4L0 8z' fill='#0E9F5D'/></marker><marker id='p' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0 0L7 4L0 8z' fill='#FF5D8F'/></marker></defs><g fill='#F1ECFF' stroke='#7C5CFF' stroke-width='2'><rect x='6' y='6' width='94' height='26' rx='5'/><rect x='104' y='6' width='94' height='26' rx='5'/><rect x='202' y='6' width='94' height='26' rx='5'/><rect x='300' y='6' width='94' height='26' rx='5'/></g><g text-anchor='middle' font-weight='bold'><text x='53' y='23'>Sequence</text><text x='151' y='23'>Selection</text><text x='249' y='23'>Iteration</text><text x='347' y='23'>Subroutines</text></g><text x='25' y='54' font-weight='bold'>Call stack: fact(3)</text><text x='190' y='54' text-anchor='middle'>call</text><text x='226' y='54' text-anchor='middle'>return</text><rect x='25' y='62' width='150' height='28' rx='4' fill='#DDF5E8' stroke='#0E9F5D' stroke-width='2'/><rect x='25' y='96' width='150' height='28' rx='4' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><rect x='25' y='130' width='150' height='28' rx='4' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><rect x='25' y='164' width='150' height='28' rx='4' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><g text-anchor='middle'><text x='100' y='80'>fact(1) = 1 (base case)</text><text x='100' y='114'>fact(2) = 2 x fact(1)</text><text x='100' y='148'>fact(3) = 3 x fact(2)</text><text x='100' y='182'>main calls fact(3)</text></g><path d='M190 190V72' fill='none' stroke='#2FB5FF' stroke-width='3' marker-end='url(#b)'/><path d='M226 72V190' fill='none' stroke='#0E9F5D' stroke-width='3' marker-end='url(#g)'/><rect x='25' y='200' width='215' height='30' rx='4' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><text x='32' y='213'>No base case: calls never stop</text><text x='32' y='226'>so the stack overflows</text><text x='252' y='54' font-weight='bold'>Parameters</text><text x='252' y='70'>By value: a copy</text><rect x='252' y='76' width='50' height='24' rx='4' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><rect x='328' y='76' width='60' height='24' rx='4' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><path d='M304 88H326' fill='none' stroke='#2FB5FF' stroke-width='3' marker-end='url(#b)'/><g text-anchor='middle'><text x='277' y='92'>x = 5</text><text x='358' y='92'>n = 5</text></g><text x='252' y='114'>n is a copy; x stays 5</text><text x='252' y='134'>By reference: original</text><rect x='252' y='140' width='50' height='24' rx='4' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><rect x='328' y='140' width='60' height='24' rx='4' fill='#FFE3EC' stroke='#FF5D8F' stroke-width='2'/><path d='M326 152H304' fill='none' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p)'/><g text-anchor='middle'><text x='277' y='156'>x = 6</text><text x='358' y='156'>n to x</text></g><text x='252' y='178'>n changes x itself: x = 6</text><text x='252' y='198'>Local: in subroutine</text><text x='252' y='213'>Global: whole program</text><rect x='6' y='238' width='388' height='18' rx='4' fill='#F1ECFF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='251' text-anchor='middle'>OOP: class, objects | encapsulation, inheritance, polymorphism</text></svg>
