<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='16' font-size='12' font-weight='bold'>Two's complement (8-bit): MSB has a negative place value</text><g stroke='#1D1A15' stroke-width='2'><rect x='40' y='24' width='40' height='22' fill='#FFE3EC'/><rect x='80' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='120' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='160' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='200' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='240' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='280' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='320' y='24' width='40' height='22' fill='#E3F5FF'/><rect x='40' y='46' width='40' height='26' fill='#FFE3EC'/><rect x='80' y='46' width='40' height='26' fill='#fff'/><rect x='120' y='46' width='40' height='26' fill='#fff'/><rect x='160' y='46' width='40' height='26' fill='#fff'/><rect x='200' y='46' width='40' height='26' fill='#fff'/><rect x='240' y='46' width='40' height='26' fill='#fff'/><rect x='280' y='46' width='40' height='26' fill='#fff'/><rect x='320' y='46' width='40' height='26' fill='#fff'/></g><text x='60' y='39'>-128</text><text x='100' y='39'>64</text><text x='140' y='39'>32</text><text x='180' y='39'>16</text><text x='220' y='39'>8</text><text x='260' y='39'>4</text><text x='300' y='39'>2</text><text x='340' y='39'>1</text><g font-size='14' font-weight='bold'><text x='60' y='64'>1</text><text x='100' y='64'>1</text><text x='140' y='64'>1</text><text x='180' y='64'>1</text><text x='220' y='64'>1</text><text x='260' y='64'>1</text><text x='300' y='64'>1</text><text x='340' y='64'>1</text></g><text x='200' y='90'>-128+64+32+16+8+4+2+1 = -1</text><g fill='none' stroke='#7C5CFF' stroke-width='2'><path d='M42 98 V104 H198 V98'/><path d='M202 98 V104 H358 V98'/></g><text x='120' y='119' fill='#7C5CFF'>1111 = F</text><text x='280' y='119' fill='#7C5CFF'>1111 = F</text><text x='200' y='137'>Hex FF: each hex digit = 4 bits (shorthand for binary)</text><text x='200' y='158' font-size='12' font-weight='bold'>Floating point: value = mantissa x 2^exponent</text><g stroke='#1D1A15' stroke-width='2'><rect x='40' y='166' width='200' height='26' fill='#DDF3E8'/><rect x='240' y='166' width='120' height='26' fill='#FBEBCB'/></g><text x='140' y='183'>mantissa = precision</text><text x='300' y='183'>exponent = range</text><text x='200' y='212'>Normalised (01.. or 10..) = maximum precision</text><text x='200' y='230'>Overflow: 01111111 + 1 = 10000000 (-128, wrong!)</text><text x='200' y='248'>ASCII 'A' = 65 = 01000001; Unicode has more characters</text></g></svg>
