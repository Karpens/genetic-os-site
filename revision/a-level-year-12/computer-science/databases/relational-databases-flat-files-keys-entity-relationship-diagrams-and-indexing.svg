<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='10' y='16'>ER diagram: ORDER_LINE resolves the many-to-many link</text><rect x='10' y='30' width='110' height='80' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='1.5'/><text x='65' y='46' text-anchor='middle' font-weight='bold'>CUSTOMER</text><line x1='10' y1='52' x2='120' y2='52' stroke='#2FB5FF'/><text x='16' y='68'>CustomerID (PK)</text><text x='16' y='84'>Name</text><text x='16' y='100'>Email</text><rect x='260' y='30' width='130' height='80' fill='#E9F8F0' stroke='#0E9F5D' stroke-width='1.5'/><text x='325' y='46' text-anchor='middle' font-weight='bold'>ORDER</text><line x1='260' y1='52' x2='390' y2='52' stroke='#0E9F5D'/><text x='266' y='68'>OrderID (PK)</text><text x='266' y='84'>CustomerID (FK)</text><text x='266' y='100'>OrderDate</text><line x1='120' y1='70' x2='260' y2='70' stroke='#1D1A15' stroke-width='1.5'/><line x1='128' y1='63' x2='128' y2='77' stroke='#1D1A15' stroke-width='1.5'/><line x1='244' y1='70' x2='260' y2='58' stroke='#1D1A15' stroke-width='1.5'/><line x1='244' y1='70' x2='260' y2='82' stroke='#1D1A15' stroke-width='1.5'/><text x='190' y='62' text-anchor='middle'>places</text><line x1='325' y1='110' x2='325' y2='150' stroke='#1D1A15' stroke-width='1.5'/><line x1='318' y1='118' x2='332' y2='118' stroke='#1D1A15' stroke-width='1.5'/><line x1='325' y1='134' x2='313' y2='150' stroke='#1D1A15' stroke-width='1.5'/><line x1='325' y1='134' x2='337' y2='150' stroke='#1D1A15' stroke-width='1.5'/><text x='345' y='128'>has</text><rect x='260' y='150' width='130' height='76' fill='#FFF5E0' stroke='#E8A93A' stroke-width='1.5'/><text x='325' y='166' text-anchor='middle' font-weight='bold'>ORDER_LINE</text><line x1='260' y1='172' x2='390' y2='172' stroke='#E8A93A'/><text x='266' y='188'>OrderID (PK, FK)</text><text x='266' y='202'>ProductID (PK, FK)</text><text x='266' y='216'>Quantity</text><rect x='10' y='150' width='110' height='76' fill='#EFEAFF' stroke='#7C5CFF' stroke-width='1.5'/><text x='65' y='166' text-anchor='middle' font-weight='bold'>PRODUCT</text><line x1='10' y1='172' x2='120' y2='172' stroke='#7C5CFF'/><text x='16' y='188'>ProductID (PK)</text><text x='16' y='202'>Name</text><text x='16' y='216'>Price</text><line x1='120' y1='188' x2='260' y2='188' stroke='#1D1A15' stroke-width='1.5'/><line x1='128' y1='181' x2='128' y2='195' stroke='#1D1A15' stroke-width='1.5'/><line x1='244' y1='188' x2='260' y2='176' stroke='#1D1A15' stroke-width='1.5'/><line x1='244' y1='188' x2='260' y2='200' stroke='#1D1A15' stroke-width='1.5'/><text x='190' y='180' text-anchor='middle'>is in</text><text x='10' y='248'>PK = primary key   FK = foreign key   crow's foot = many</text></g></svg>
