<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 396' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0L8,4L0,8z'/></marker></defs><rect width='460' height='396' fill='#fff'/><text x='10' y='18' font-size='14' font-weight='bold'>TCP/IP stack and how data travels</text><g stroke-width='2'><rect x='10' y='28' width='170' height='34' rx='4' fill='#7C5CFF' fill-opacity='.18' stroke='#7C5CFF'/><rect x='10' y='66' width='170' height='34' rx='4' fill='#2FB5FF' fill-opacity='.18' stroke='#2FB5FF'/><rect x='10' y='104' width='170' height='34' rx='4' fill='#0E9F5D' fill-opacity='.18' stroke='#0E9F5D'/><rect x='10' y='142' width='170' height='34' rx='4' fill='#E8A93A' fill-opacity='.18' stroke='#E8A93A'/></g><g font-size='12' font-weight='bold'><text x='18' y='43'>Application</text><text x='18' y='81'>Transport</text><text x='18' y='119'>Network (internet)</text><text x='18' y='157'>Link</text></g><text x='18' y='56'>HTTP, DNS, SMTP</text><text x='18' y='94'>TCP/UDP: ports, segments</text><text x='18' y='132'>IP: addressing, routing</text><text x='18' y='170'>Ethernet/Wi-Fi: frames</text><text x='200' y='40' font-size='12' font-weight='bold' fill='#7C5CFF'>Packet switching</text><g stroke-width='2'><rect x='200' y='95' width='56' height='28' rx='4' fill='#2FB5FF' fill-opacity='.18' stroke='#2FB5FF'/><rect x='394' y='95' width='56' height='28' rx='4' fill='#2FB5FF' fill-opacity='.18' stroke='#2FB5FF'/><path d='M256,109L313,64M337,64L394,109' fill='none' stroke='#7C5CFF' marker-end='url(#a)'/><path d='M256,109L313,109M337,109L392,109' fill='none' stroke='#7C5CFF' marker-end='url(#a)'/><path d='M256,109L313,154M337,154L394,109' fill='none' stroke='#7C5CFF' marker-end='url(#a)'/><circle cx='325' cy='64' r='12' fill='#fff' stroke='#7C5CFF'/><circle cx='325' cy='109' r='12' fill='#fff' stroke='#7C5CFF'/><circle cx='325' cy='154' r='12' fill='#fff' stroke='#7C5CFF'/></g><g text-anchor='middle'><text x='228' y='113'>Sender</text><text x='422' y='113'>Receiver</text><text x='325' y='68'>R</text><text x='325' y='113'>R</text><text x='325' y='158'>R</text></g><g fill='#E8A93A' fill-opacity='.5'><rect x='358' y='80' width='16' height='14'/><rect x='358' y='102' width='16' height='14'/><rect x='358' y='124' width='16' height='14'/></g><g text-anchor='middle'><text x='366' y='91'>1</text><text x='366' y='113'>2</text><text x='366' y='135'>3</text></g><text x='200' y='184'>Packets take different routes,</text><text x='200' y='197'>reassembled in order at the end</text><text x='10' y='192' fill='#FF5D8F' font-weight='bold'>Circuit switching:</text><text x='10' y='205'>one path reserved for the call</text><text x='10' y='228' font-size='12' font-weight='bold' fill='#0E9F5D'>DNS: the internet's address book</text><g stroke-width='2'><rect x='10' y='238' width='64' height='28' rx='4' fill='#0E9F5D' fill-opacity='.18' stroke='#0E9F5D'/><rect x='150' y='238' width='84' height='28' rx='4' fill='#0E9F5D' fill-opacity='.18' stroke='#0E9F5D'/><rect x='330' y='238' width='84' height='28' rx='4' fill='#0E9F5D' fill-opacity='.18' stroke='#0E9F5D'/><path d='M74,246H148' fill='none' stroke='#1D1A15' marker-end='url(#a)'/><path d='M148,258H76' fill='none' stroke='#1D1A15' marker-end='url(#a)'/><path d='M42,266V284H372V267' fill='none' stroke='#1D1A15' marker-end='url(#a)'/></g><g text-anchor='middle'><text x='42' y='256'>Browser</text><text x='192' y='256'>DNS server</text><text x='372' y='256'>Web server</text><text x='111' y='242'>1 name?</text><text x='111' y='271'>2 IP address</text><text x='207' y='299'>3 connect using the IP address</text></g><g stroke-width='2'><rect x='10' y='312' width='140' height='78' rx='4' fill='#E8A93A' fill-opacity='.15' stroke='#E8A93A'/><rect x='160' y='312' width='140' height='78' rx='4' fill='#2FB5FF' fill-opacity='.15' stroke='#2FB5FF'/><rect x='310' y='312' width='140' height='78' rx='4' fill='#FF5D8F' fill-opacity='.15' stroke='#FF5D8F'/></g><g font-size='11'><text x='17' y='327' font-weight='bold'>Client-server:</text><text x='17' y='340'>central, easy to secure</text><text x='17' y='353' font-weight='bold'>Peer-to-peer: equal</text><text x='17' y='366'>nodes share the work</text><text x='167' y='327'>Router: NAT shares one</text><text x='167' y='340'>public IP between</text><text x='167' y='353'>devices; firewall</text><text x='167' y='366'>filters traffic</text><text x='317' y='327' font-weight='bold'>Encryption: symmetric</text><text x='317' y='340'>= one shared key;</text><text x='317' y='353'>asymmetric = public</text><text x='317' y='366'>+ private key pair;</text><text x='317' y='379'>certificate = identity</text></g></svg>
