<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='22' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Q = (A AND B) OR (NOT C)</text><g stroke='#1D1A15' stroke-width='1.5' fill='none'><path d='M60 50H120M60 80H120M170 65H210V112H257M60 190H120M158 190H210V138H257M322 125H365'/></g><path d='M120 40H145A25 25 0 0 1 145 90H120Z' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><path d='M120 175L120 205L150 190Z' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='2'/><circle cx='154' cy='190' r='4' fill='#fff' stroke='#FF5D8F' stroke-width='2'/><path d='M250 100Q272 125 250 150Q300 150 322 125Q300 100 250 100Z' fill='#EAF6FF' stroke='#2FB5FF' stroke-width='2'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='40' y='54'>A</text><text x='40' y='84'>B</text><text x='40' y='194'>C</text><text x='124' y='69' font-size='11'>AND</text><text x='135' y='225' text-anchor='middle' font-size='11'>NOT</text><text x='275' y='129' font-size='11'>OR</text><text x='372' y='129'>Q</text><text x='186' y='58' font-size='11'>P</text></g><text x='200' y='252' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>A=1, B=0, C=0: P = 0, NOT C = 1, so Q = 0 OR 1 = 1</text></svg>
