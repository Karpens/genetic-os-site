<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='22' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Three methods of proof</text><rect x='10' y='35' width='120' height='150' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='140' y='35' width='120' height='150' rx='6' fill='#EAF7FF' stroke='#2FB5FF'/><rect x='270' y='35' width='120' height='150' rx='6' fill='#FFE9F1' stroke='#FF5D8F'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='70' y='58' font-size='12' font-weight='bold'>Deduction</text><text x='70' y='82'>Logical steps from</text><text x='70' y='98'>known facts to a</text><text x='70' y='114'>general result</text><text x='70' y='138'>Even: 2k  Odd: 2k+1</text><text x='70' y='164' font-weight='bold'>Proves ALL cases</text><text x='200' y='58' font-size='12' font-weight='bold'>Exhaustion</text><text x='200' y='82'>Split into a finite</text><text x='200' y='98'>number of cases</text><text x='200' y='114'>and check each one</text><text x='200' y='138'>n = 3k, 3k+1, 3k+2</text><text x='200' y='164' font-weight='bold'>Proves ALL cases</text><text x='330' y='58' font-size='12' font-weight='bold'>Counter-example</text><text x='330' y='82'>Find ONE case that</text><text x='330' y='98'>breaks the claim</text><text x='330' y='114'>n²+n+41 at n = 40</text><text x='330' y='130'>gives 41², not prime</text><text x='330' y='164' font-weight='bold'>Disproves only</text></g><rect x='10' y='200' width='380' height='48' rx='6' fill='#FFF6E3' stroke='#E8A93A'/><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle'><text x='200' y='221'>Checking examples that work is NOT a proof.</text><text x='200' y='239'>Finish with: therefore ... as required.</text></g></svg>
