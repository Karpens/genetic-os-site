<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><line x1='200' y1='10' x2='200' y2='175' stroke='#1D1A15' stroke-dasharray='4'/><text x='105' y='25' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Mutually exclusive</text><circle cx='60' cy='85' r='38' fill='#DDF3E8' stroke='#0E9F5D' stroke-width='2'/><circle cx='150' cy='85' r='38' fill='#DFF3FF' stroke='#2FB5FF' stroke-width='2'/><text x='60' y='90' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#1D1A15'>A</text><text x='150' y='90' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#1D1A15'>B</text><text x='105' y='150' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>P(A ∩ B) = 0</text><text x='105' y='168' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>P(A ∪ B) = P(A) + P(B)</text><text x='295' y='25' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Overlapping events</text><circle cx='270' cy='85' r='40' fill='#DDF3E8' fill-opacity='0.8' stroke='#0E9F5D' stroke-width='2'/><circle cx='320' cy='85' r='40' fill='#DFF3FF' fill-opacity='0.8' stroke='#2FB5FF' stroke-width='2'/><text x='252' y='90' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#1D1A15'>A</text><text x='338' y='90' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#1D1A15'>B</text><text x='295' y='89' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>A∩B</text><text x='295' y='150' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</text><text x='295' y='168' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>P(A′) = 1 − P(A)</text><rect x='30' y='188' width='340' height='62' rx='6' fill='#F1EDFF' stroke='#7C5CFF'/><text x='200' y='208' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Independent: P(A ∩ B) = P(A) × P(B)</text><text x='200' y='226' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>equivalently P(A | B) = P(A)</text><text x='200' y='243' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Exclusive events (P &gt; 0) are never independent</text></svg>
