<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g fill='none' stroke-width='2' stroke-linecap='round'><path d='M10 90H130M145 90H265M280 90H395' stroke='#1D1A15'/><path d='M20 30Q70 200 120 30' stroke='#2FB5FF'/><path d='M155 30Q205 150 255 30' stroke='#7C5CFF'/><path d='M290 30Q340 90 390 30' stroke='#FF5D8F'/></g><g fill='#E8A93A' stroke='#1D1A15' stroke-width='1.5'><circle cx='43' cy='90' r='4'/><circle cx='97' cy='90' r='4'/><circle cx='205' cy='90' r='4'/></g><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle'><text x='200' y='16' font-weight='bold'>Quadratic y = ax² + bx + c: discriminant b² − 4ac</text><text x='70' y='137'>b² − 4ac &gt; 0</text><text x='205' y='137'>b² − 4ac = 0</text><text x='340' y='137'>b² − 4ac &lt; 0</text><text x='70' y='153'>two roots</text><text x='205' y='153'>one repeated root</text><text x='340' y='153'>no real roots</text></g><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='10' y='178'>Completing the square: x² + bx + c = (x + b/2)² − (b/2)² + c</text><text x='10' y='195'>e.g. x² + 6x + 5 = (x + 3)² − 4, so minimum at (−3, −4)</text><text x='10' y='214'>f(x) + a: up a      f(x + a): left a</text><text x='10' y='230'>a·f(x): stretch ×a vertically      f(ax): stretch ×1/a horizontally</text><text x='10' y='248'>Proof: deduction · exhaustion · counter-example. Keep surds exact.</text></g></svg>
