<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><polygon points='40,170 240,170 150,50' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><g font-family='sans-serif' font-size='13' fill='#1D1A15'><text x='26' y='184' text-anchor='middle' font-weight='bold'>A</text><text x='248' y='184' text-anchor='middle' font-weight='bold'>B</text><text x='150' y='40' text-anchor='middle' font-weight='bold'>C</text><text x='214' y='104' text-anchor='middle' font-style='italic' fill='#7C5CFF'>a</text><text x='80' y='104' text-anchor='middle' font-style='italic' fill='#E8A93A'>b</text><text x='140' y='190' text-anchor='middle' font-style='italic' fill='#FF5D8F'>c</text></g><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='262' y='60'>Sine rule when you</text><text x='262' y='75'>know a side-angle</text><text x='262' y='90'>pair (opposite)</text><text x='262' y='125'>Cosine rule for</text><text x='262' y='140'>SAS or SSS</text></g><line x1='20' y1='200' x2='380' y2='200' stroke='#2FB5FF' stroke-width='1.5'/><g font-family='sans-serif' font-size='13' fill='#1D1A15'><text x='20' y='218'>Sine: a/sin A = b/sin B = c/sin C</text><text x='20' y='236'>Cosine: a² = b² + c² − 2bc cos A</text><text x='20' y='254'>Area = ½ab sin C (C between a and b)</text></g></svg>
