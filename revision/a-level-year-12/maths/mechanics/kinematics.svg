<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='10' y='18' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Velocity-time graph (constant a)</text><polygon points='50,210 50,150 230,70 230,210' fill='#DFF3FF'/><path d='M50 210 V38 M45 46 L50 38 L55 46 M50 210 H255 M247 205 L255 210 L247 215' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M50 150 L230 70' fill='none' stroke='#7C5CFF' stroke-width='3'/><path d='M50 150 H230' fill='none' stroke='#1D1A15' stroke-width='2' stroke-dasharray='4 3'/><path d='M230 150 V70' fill='none' stroke='#FF5D8F' stroke-width='3'/><text x='60' y='36' font-family='sans-serif' font-size='12' fill='#1D1A15'>v (m/s)</text><text x='44' y='154' font-family='sans-serif' font-size='12' text-anchor='end' fill='#1D1A15'>u</text><text x='236' y='70' font-family='sans-serif' font-size='12' fill='#1D1A15'>v</text><text x='236' y='114' font-family='sans-serif' font-size='12' fill='#FF5D8F'>at</text><text x='230' y='226' font-family='sans-serif' font-size='12' text-anchor='middle' fill='#1D1A15'>t</text><text x='140' y='246' font-family='sans-serif' font-size='12' text-anchor='middle' fill='#1D1A15'>time (s)</text><text x='60' y='92' font-family='sans-serif' font-size='12' fill='#FF5D8F'>gradient = a</text><text x='140' y='186' font-family='sans-serif' font-size='12' font-weight='bold' text-anchor='middle' fill='#1D1A15'>area = s</text><text x='140' y='202' font-family='sans-serif' font-size='11' text-anchor='middle' fill='#1D1A15'>(displacement)</text><text x='268' y='58' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>SUVAT (const. a)</text><text x='268' y='86' font-family='sans-serif' font-size='12' fill='#1D1A15'>v = u + at</text><text x='268' y='110' font-family='sans-serif' font-size='12' fill='#1D1A15'>s = ut + ½at²</text><text x='268' y='134' font-family='sans-serif' font-size='12' fill='#1D1A15'>v² = u² + 2as</text><text x='268' y='158' font-family='sans-serif' font-size='12' fill='#1D1A15'>s = ½(u + v)t</text><text x='268' y='188' font-family='sans-serif' font-size='11' fill='#1D1A15'>Calculus: v = ds/dt</text><text x='268' y='204' font-family='sans-serif' font-size='11' fill='#1D1A15'>a = dv/dt</text><text x='268' y='226' font-family='sans-serif' font-size='11' fill='#1D1A15'>g = 9.8 m/s² down</text></svg>
