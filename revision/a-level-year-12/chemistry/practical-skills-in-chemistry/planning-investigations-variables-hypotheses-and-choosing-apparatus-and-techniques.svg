<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='18' text-anchor='middle' font-size='14' font-weight='bold'>Variables in an investigation</text><rect x='10' y='30' width='110' height='60' rx='6' fill='#E6F6FF' stroke='#2FB5FF'/><text x='65' y='50' text-anchor='middle'>Independent</text><text x='65' y='65' text-anchor='middle'>variable</text><text x='65' y='81' text-anchor='middle' font-size='11'>(you change it)</text><line x1='120' y1='60' x2='144' y2='60' stroke='#1D1A15' stroke-width='2'/><polygon points='150,60 142,55 142,65' fill='#1D1A15'/><rect x='150' y='30' width='100' height='60' rx='6' fill='#F1ECFF' stroke='#7C5CFF'/><text x='200' y='64' text-anchor='middle'>Investigation</text><line x1='250' y1='60' x2='274' y2='60' stroke='#1D1A15' stroke-width='2'/><polygon points='280,60 272,55 272,65' fill='#1D1A15'/><rect x='280' y='30' width='110' height='60' rx='6' fill='#E8F7EF' stroke='#0E9F5D'/><text x='335' y='50' text-anchor='middle'>Dependent</text><text x='335' y='65' text-anchor='middle'>variable</text><text x='335' y='81' text-anchor='middle' font-size='11'>(you measure it)</text><rect x='10' y='118' width='380' height='50' rx='6' fill='#FFF4DD' stroke='#E8A93A'/><text x='200' y='138' text-anchor='middle' font-weight='bold'>Control variables (keep constant)</text><text x='200' y='157' text-anchor='middle' font-size='11'>volume, concentration, mass, temperature, apparatus</text><line x1='200' y1='118' x2='200' y2='98' stroke='#1D1A15' stroke-width='2'/><polygon points='200,92 195,100 205,100' fill='#1D1A15'/><rect x='10' y='182' width='380' height='68' rx='6' fill='#FFEBF2' stroke='#FF5D8F'/><text x='20' y='200' font-size='11' font-weight='bold'>Example: Na₂S₂O₃ + HCl 'disappearing cross'</text><text x='20' y='216' font-size='11'>IV: temperature (°C)   DV: time for cross to vanish (s)</text><text x='20' y='232' font-size='11'>Controls: concentrations, volumes, same flask, same cross</text></svg>
