<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Dynamic equilibrium and Kc</text><path d='M40 30 V150 H190' fill='none' stroke='#1D1A15' stroke-width='2'/><polygon points='40,26 36,34 44,34' fill='#1D1A15'/><polygon points='194,150 186,146 186,154' fill='#1D1A15'/><path d='M42 50 C65 95 90 113 115 115 H185' fill='none' stroke='#2FB5FF' stroke-width='3'/><path d='M42 140 C65 135 90 120 115 115' fill='none' stroke='#FF5D8F' stroke-width='3'/><path d='M115 40 V150' fill='none' stroke='#7C5CFF' stroke-width='2' stroke-dasharray='5 4'/><text x='115' y='36' text-anchor='middle' fill='#7C5CFF'>equilibrium</text><text x='48' y='44' fill='#2FB5FF' font-weight='bold'>forward</text><text x='48' y='134' fill='#FF5D8F' font-weight='bold'>reverse</text><text x='152' y='108' text-anchor='middle'>rates equal</text><text x='14' y='90' text-anchor='middle' transform='rotate(-90 14 90)'>Rate</text><text x='115' y='166' text-anchor='middle'>Time</text><text x='215' y='42' font-size='12'>aA + bB ⇌ cC + dD</text><text x='215' y='76' font-size='12'>Kc =</text><path d='M250 72 H340' fill='none' stroke='#1D1A15' stroke-width='2'/><text x='295' y='65' text-anchor='middle' font-size='12'>[C]^c [D]^d</text><text x='295' y='87' text-anchor='middle' font-size='12'>[A]^a [B]^b</text><path d='M222 118 H378' fill='none' stroke='#0E9F5D' stroke-width='3'/><polygon points='215,118 224,113 224,123' fill='#0E9F5D'/><polygon points='385,118 376,113 376,123' fill='#0E9F5D'/><text x='215' y='108'>small Kc</text><text x='385' y='108' text-anchor='end'>large Kc</text><text x='215' y='136'>reactants</text><text x='385' y='136' text-anchor='end'>products</text><rect x='10' y='176' width='380' height='76' rx='8' fill='#E8A93A' fill-opacity='0.15' stroke='#E8A93A' stroke-width='2'/><text x='20' y='193' font-weight='bold'>Le Chatelier: system shifts to oppose a change</text><text x='20' y='210'>Concentration or pressure: position shifts, Kc same</text><text x='20' y='226'>Temperature: position AND Kc change</text><text x='20' y='242'>Catalyst: no change to Kc or position (faster only)</text></svg>
