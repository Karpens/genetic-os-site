<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='16' text-anchor='middle' font-size='14' font-weight='bold'>Organic basics</text><text x='12' y='36'>Homologous series (alkanes CnH2n+2): each member +CH₂</text><g fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'><rect x='12' y='44' width='56' height='26' rx='5'/><rect x='118' y='44' width='56' height='26' rx='5'/><rect x='224' y='44' width='56' height='26' rx='5'/><rect x='330' y='44' width='56' height='26' rx='5'/></g><g stroke='#1D1A15' stroke-width='2' fill='none' stroke-linecap='round'><path d='M71 57 L115 57 M108 53 L115 57 L108 61'/><path d='M177 57 L221 57 M214 53 L221 57 L214 61'/><path d='M283 57 L327 57 M320 53 L327 57 L320 61'/></g><g text-anchor='middle'><text x='40' y='61'>CH₄</text><text x='146' y='61'>C₂H₆</text><text x='252' y='61'>C₃H₈</text><text x='358' y='61'>C₄H₁₀</text><text x='93' y='51' font-size='11'>+CH₂</text><text x='199' y='51' font-size='11'>+CH₂</text><text x='305' y='51' font-size='11'>+CH₂</text></g><text x='12' y='92'>Structural isomers: same formula C₄H₁₀, different structure</text><g fill='none' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><path d='M30 150 L60 128 L90 150 L120 128' stroke='#7C5CFF'/><path d='M290 140 L265 155 M290 140 L315 155 M290 140 L290 112' stroke='#FF5D8F'/></g><g text-anchor='middle'><text x='75' y='172'>butane</text><text x='290' y='172'>2-methylpropane</text><text x='190' y='144' font-size='14'>vs</text></g><text x='12' y='192' fill='#0E9F5D' font-weight='bold'>Skeletal: each end/corner = C, H on C omitted</text><text x='12' y='214'>Heterolytic fission: curly arrow = e⁻ pair moves</text><g text-anchor='middle' font-size='14'><text x='80' y='248'>A</text><text x='145' y='248'>B</text></g><g fill='none' stroke-width='2.5' stroke-linecap='round'><path d='M92 244 L130 244' stroke='#1D1A15'/><path d='M111 240 Q130 218 142 233 M137 224 L142 233 L133 232' stroke='#FF5D8F'/></g><text x='190' y='248' font-size='13'>→ A⁺ + B⁻</text><text x='272' y='248' font-size='11'>both e⁻ go to B</text></svg>
