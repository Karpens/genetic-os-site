<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#ffffff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Unit conversions and standard form</text><rect x='20' y='36' width='90' height='34' rx='6' fill='#E6F6EE' stroke='#0E9F5D'/><text x='65' y='58' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>cm³</text><rect x='155' y='36' width='90' height='34' rx='6' fill='#E6F6EE' stroke='#0E9F5D'/><text x='200' y='58' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>dm³</text><rect x='290' y='36' width='90' height='34' rx='6' fill='#E6F6EE' stroke='#0E9F5D'/><text x='335' y='58' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>m³</text><line x1='112' y1='56' x2='152' y2='56' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='247' y1='56' x2='287' y2='56' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><text x='132' y='48' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>÷1000</text><text x='267' y='48' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>÷1000</text><text x='200' y='88' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>going the other way: ×1000 each step</text><rect x='20' y='98' width='360' height='72' rx='6' fill='#FFF6E3' stroke='#E8A93A'/><text x='30' y='118' font-family='sans-serif' font-size='12' fill='#1D1A15'>Standard form: A × 10ⁿ with 1 ≤ A &lt; 10</text><text x='30' y='137' font-family='sans-serif' font-size='12' fill='#1D1A15'>0.000450 = 4.50 × 10⁻⁴ (point moves 4 places)</text><text x='30' y='156' font-family='sans-serif' font-size='12' fill='#1D1A15'>Multiply: add powers. Divide: subtract powers.</text><rect x='20' y='180' width='360' height='72' rx='6' fill='#E8F6FF' stroke='#2FB5FF'/><text x='30' y='200' font-family='sans-serif' font-size='12' fill='#1D1A15'>Significant figures: 0.004070 has 4 s.f.</text><text x='30' y='218' font-family='sans-serif' font-size='12' fill='#1D1A15'>Leading zeros do not count; later zeros do.</text><text x='30' y='236' font-family='sans-serif' font-size='12' fill='#1D1A15'>Answer to the fewest s.f. in the data. 25 °C = 298 K</text></svg>
