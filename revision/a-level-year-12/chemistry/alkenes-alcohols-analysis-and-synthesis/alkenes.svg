<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='14' text-anchor='middle' font-size='14' font-weight='bold'>Electrophilic addition: C=C + Br₂</text><g text-anchor='middle' font-size='14'><text x='45' y='75'>C</text><text x='105' y='75'>C</text><text x='200' y='60'>Br</text><text x='264' y='60'>Br</text><text x='200' y='80' font-size='11'>δ+</text><text x='264' y='80' font-size='11'>δ−</text><text x='75' y='96' font-size='11'>π bond (weak site)</text></g><g stroke='#1D1A15' stroke-width='2.5' fill='none' stroke-linecap='round'><path d='M55 68 L95 68 M55 74 L95 74'/><path d='M214 56 L250 56'/><path d='M75 63 Q130 20 193 48 M185 44 L193 48 L186 53' stroke='#7C5CFF'/><path d='M232 52 Q255 28 264 46 M257 43 L264 48 L267 40' stroke='#FF5D8F'/></g><text x='12' y='114'>Intermediate: carbocation C⁺ + Br⁻; Br⁻ attacks C⁺</text><text x='12' y='130'>Product: dibromoalkane (orange → colourless)</text><text x='12' y='150' fill='#0E9F5D' font-weight='bold'>Markovnikov (HBr): Br on more substituted C</text><text x='12' y='165' font-size='11'>(more alkyl groups = more stable carbocation)</text><text x='85' y='184' text-anchor='middle'>Z: same side</text><text x='300' y='184' text-anchor='middle'>E: opposite sides</text><g stroke-width='3' stroke-linecap='round' fill='none'><path d='M67 220 L103 220 M67 225 L103 225 M65 222 L56 203 M65 226 L56 240 M105 222 L114 203 M105 226 L114 240' stroke='#0E9F5D'/><path d='M282 220 L318 220 M282 225 L318 225 M280 222 L271 203 M280 226 L271 240 M320 222 L329 240 M320 222 L329 203' stroke='#E8A93A'/></g><g text-anchor='middle' font-size='11'><text x='46' y='198'>CH₃</text><text x='124' y='198'>CH₃</text><text x='52' y='252'>H</text><text x='118' y='252'>H</text><text x='261' y='198'>CH₃</text><text x='267' y='252'>H</text><text x='335' y='198'>H</text><text x='338' y='252'>CH₃</text><text x='192' y='218'>restricted rotation</text><text x='192' y='232'>(π bond)</text></g></svg>
