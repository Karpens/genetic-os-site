<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle' stroke-width='1.5'><rect x='20' y='8' width='360' height='30' rx='5' fill='#E7F7EF' stroke='#0E9F5D'/><text x='200' y='28'>AIM: what the study intends to investigate</text><line x1='200' y1='38' x2='200' y2='46' stroke='#1D1A15'/><polygon points='195,44 205,44 200,52'/><rect x='20' y='52' width='360' height='46' rx='5' fill='#F0ECFF' stroke='#7C5CFF'/><text x='200' y='71'>HYPOTHESIS: testable prediction</text><text x='200' y='88' font-size='11'>Directional | Non-directional | Null</text><line x1='95' y1='98' x2='95' y2='118' stroke='#1D1A15'/><polygon points='90,118 100,118 95,124'/><line x1='305' y1='98' x2='305' y2='118' stroke='#1D1A15'/><polygon points='300,118 310,118 305,124'/><rect x='20' y='124' width='150' height='50' rx='5' fill='#E6F6FF' stroke='#2FB5FF'/><text x='95' y='145'>IV: manipulated</text><text x='95' y='162' font-size='11'>e.g. noise level</text><line x1='170' y1='149' x2='224' y2='149' stroke='#1D1A15'/><polygon points='224,144 224,154 230,149'/><text x='200' y='142' font-size='11'>affects?</text><rect x='230' y='124' width='150' height='50' rx='5' fill='#FFEAF2' stroke='#FF5D8F'/><text x='305' y='145'>DV: measured</text><text x='305' y='162' font-size='11'>e.g. words recalled /20</text><text x='200' y='192' font-size='11'>Operationalise both: define them clearly so they can be measured</text><rect x='20' y='204' width='360' height='48' rx='5' fill='#FFF6E3' stroke='#E8A93A'/><text x='200' y='223'>Extraneous variables: keep them controlled</text><text x='200' y='240' font-size='11'>Confounding variable = varies systematically with the IV</text></g></svg>
