<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 420 280'><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle'><text x='210' y='18' font-size='14' font-weight='bold'>Two-process model of phobias</text><rect x='10' y='30' width='190' height='150' rx='8' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='2'/><text x='105' y='48' font-weight='bold'>1 ACQUISITION</text><text x='105' y='62' font-size='11'>classical conditioning</text><rect x='20' y='72' width='170' height='34' rx='6' fill='#FFFFFF' stroke='#0E9F5D' stroke-width='2'/><text x='105' y='93'>Dog (NS) + bite (UCS)</text><path d='M105 106 V126 M99 120 L105 128 L111 120' fill='none' stroke='#0E9F5D' stroke-width='2'/><rect x='20' y='130' width='170' height='34' rx='6' fill='#FFFFFF' stroke='#0E9F5D' stroke-width='2'/><text x='105' y='151' font-size='11'>Dog (CS) alone → fear (CR)</text><rect x='215' y='30' width='195' height='150' rx='8' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='312' y='48' font-weight='bold'>2 MAINTENANCE</text><text x='312' y='62' font-size='11'>operant conditioning</text><rect x='235' y='72' width='140' height='30' rx='6' fill='#FFFFFF' stroke='#E8A93A' stroke-width='2'/><text x='305' y='91'>Avoid the dog</text><path d='M305 102 V120 M299 114 L305 122 L311 114' fill='none' stroke='#E8A93A' stroke-width='2'/><rect x='235' y='122' width='140' height='30' rx='6' fill='#FFFFFF' stroke='#E8A93A' stroke-width='2'/><text x='305' y='141'>Anxiety is reduced</text><path d='M375 137 H396 V87 H377 M385 81 L377 87 L385 93' fill='none' stroke='#E8A93A' stroke-width='2'/><text x='312' y='171' font-size='11' font-weight='bold'>Negative reinforcement</text><rect x='10' y='195' width='400' height='78' rx='8' fill='#EEE9FF' stroke='#7C5CFF' stroke-width='2'/><text x='210' y='214' font-weight='bold'>Treatment: systematic desensitisation</text><rect x='18' y='224' width='116' height='30' rx='6' fill='#FFFFFF' stroke='#7C5CFF' stroke-width='2'/><text x='76' y='243'>Fear hierarchy</text><path d='M134 239 H150 M144 233 L152 239 L144 245' fill='none' stroke='#7C5CFF' stroke-width='2'/><rect x='152' y='224' width='116' height='30' rx='6' fill='#FFFFFF' stroke='#7C5CFF' stroke-width='2'/><text x='210' y='243'>Relaxation</text><path d='M268 239 H284 M278 233 L286 239 L278 245' fill='none' stroke='#7C5CFF' stroke-width='2'/><rect x='286' y='224' width='116' height='30' rx='6' fill='#FFFFFF' stroke='#7C5CFF' stroke-width='2'/><text x='344' y='243'>Gradual exposure</text><text x='210' y='267' font-size='11'>Relaxation gradually replaces the fear response</text></g></svg>
