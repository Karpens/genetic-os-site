<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><line x1='25' y1='222' x2='25' y2='30' stroke='#1D1A15' stroke-width='2'/><path d='M19 30 L25 16 L31 30 Z' fill='#1D1A15'/><text x='8' y='245' font-family='sans-serif' font-size='11' fill='#1D1A15'>More information and precision</text><rect x='45' y='14' width='345' height='48' rx='6' fill='#E9E3FF' stroke='#7C5CFF' stroke-width='2'/><text x='55' y='34' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>RATIO: equal gaps and a true zero</text><text x='55' y='52' font-family='sans-serif' font-size='11' fill='#1D1A15'>e.g. reaction time (ms), mass (kg), words recalled</text><rect x='45' y='69' width='345' height='48' rx='6' fill='#DDF1FF' stroke='#2FB5FF' stroke-width='2'/><text x='55' y='89' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>INTERVAL: equal gaps, no true zero</text><text x='55' y='107' font-family='sans-serif' font-size='11' fill='#1D1A15'>e.g. temperature (°C), IQ score</text><rect x='45' y='124' width='345' height='48' rx='6' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='55' y='144' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>ORDINAL: rank order, unequal gaps</text><text x='55' y='162' font-family='sans-serif' font-size='11' fill='#1D1A15'>e.g. rating scale 1–5, finishing position</text><rect x='45' y='179' width='345' height='48' rx='6' fill='#DFF5EA' stroke='#0E9F5D' stroke-width='2'/><text x='55' y='199' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>NOMINAL: separate categories (frequencies)</text><text x='55' y='217' font-family='sans-serif' font-size='11' fill='#1D1A15'>e.g. attachment type, favourite colour</text></svg>
