<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='18' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Milgram (1963) set-up</text><rect x='10' y='32' width='200' height='158' rx='6' fill='#F7FBF9' stroke='#0E9F5D'/><text x='18' y='48' font-family='sans-serif' font-size='11' fill='#1D1A15'>Room 1</text><rect x='20' y='56' width='84' height='40' rx='4' fill='#FFF3DC' stroke='#E8A93A'/><text x='62' y='73' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Experimenter</text><text x='62' y='88' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>gives prods</text><rect x='20' y='122' width='84' height='40' rx='4' fill='#E3F6FF' stroke='#2FB5FF'/><text x='62' y='139' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Teacher</text><text x='62' y='154' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(participant)</text><rect x='116' y='92' width='86' height='62' rx='4' fill='#EFE9FF' stroke='#7C5CFF'/><text x='159' y='110' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Shock gen.</text><text x='159' y='126' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>15-450 V</text><text x='159' y='142' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>30 switches</text><line x1='104' y1='142' x2='116' y2='130' stroke='#1D1A15'/><rect x='240' y='32' width='150' height='158' rx='6' fill='#FFF5F9' stroke='#FF5D8F'/><text x='248' y='48' font-family='sans-serif' font-size='11' fill='#1D1A15'>Room 2</text><rect x='262' y='90' width='108' height='56' rx='4' fill='#FFE3EE' stroke='#FF5D8F'/><text x='316' y='111' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Learner</text><text x='316' y='127' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(confederate)</text><line x1='202' y1='122' x2='262' y2='118' stroke='#1D1A15' stroke-dasharray='4 3'/><text x='226' y='168' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>fake</text><text x='226' y='182' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>shocks</text><text x='200' y='212' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Learner (recorded): 150 V demands release, 285 V scream</text><text x='200' y='230' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Result: all 40 reached 300 V; 26/40 (65%) reached 450 V</text><text x='200' y='248' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Rigged draw: participant always the teacher</text></svg>
