<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Ethical issue and how it is addressed</text><rect x='15' y='32' width='150' height='38' rx='6' fill='#FFE3EE' stroke='#FF5D8F'/><text x='90' y='48' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>No informed</text><text x='90' y='62' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>consent</text><line x1='168' y1='51' x2='222' y2='51' stroke='#1D1A15' stroke-width='1.5'/><polygon points='222,46 232,51 222,56' fill='#1D1A15'/><rect x='235' y='32' width='150' height='38' rx='6' fill='#DDF5E9' stroke='#0E9F5D'/><text x='310' y='48' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Consent form;</text><text x='310' y='62' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>parental consent</text><rect x='15' y='80' width='150' height='38' rx='6' fill='#FFE3EE' stroke='#FF5D8F'/><text x='90' y='104' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Deception</text><line x1='168' y1='99' x2='222' y2='99' stroke='#1D1A15' stroke-width='1.5'/><polygon points='222,94 232,99 222,104' fill='#1D1A15'/><rect x='235' y='80' width='150' height='38' rx='6' fill='#DDF5E9' stroke='#0E9F5D'/><text x='310' y='96' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Debrief;</text><text x='310' y='110' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>presumptive consent</text><rect x='15' y='128' width='150' height='38' rx='6' fill='#FFE3EE' stroke='#FF5D8F'/><text x='90' y='144' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Psychological</text><text x='90' y='158' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>or physical harm</text><line x1='168' y1='147' x2='222' y2='147' stroke='#1D1A15' stroke-width='1.5'/><polygon points='222,142 232,147 222,152' fill='#1D1A15'/><rect x='235' y='128' width='150' height='38' rx='6' fill='#DDF5E9' stroke='#0E9F5D'/><text x='310' y='144' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Right to withdraw;</text><text x='310' y='158' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>stop if distressed</text><rect x='15' y='176' width='150' height='38' rx='6' fill='#FFE3EE' stroke='#FF5D8F'/><text x='90' y='192' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Loss of privacy /</text><text x='90' y='206' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>confidentiality</text><line x1='168' y1='195' x2='222' y2='195' stroke='#1D1A15' stroke-width='1.5'/><polygon points='222,190 232,195 222,200' fill='#1D1A15'/><rect x='235' y='176' width='150' height='38' rx='6' fill='#DDF5E9' stroke='#0E9F5D'/><text x='310' y='192' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Anonymity;</text><text x='310' y='206' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>secure data storage</text><rect x='15' y='226' width='370' height='28' rx='6' fill='#EFEAFF' stroke='#7C5CFF'/><text x='200' y='244' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>BPS principles: respect, competence, responsibility, integrity</text></svg>
