<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='10' y='16' font-weight='bold'>1. Before conditioning</text><rect x='10' y='24' width='160' height='26' rx='4' fill='#E8F7EF' stroke='#0E9F5D'/><text x='90' y='41' text-anchor='middle'>Food (UCS)</text><line x1='172' y1='37' x2='210' y2='37' stroke='#1D1A15' marker-end='url(#a)'/><rect x='215' y='24' width='175' height='26' rx='4' fill='#E8F7EF' stroke='#0E9F5D'/><text x='302' y='41' text-anchor='middle'>Salivation (UCR)</text><rect x='10' y='58' width='160' height='26' rx='4' fill='#E6F6FF' stroke='#2FB5FF'/><text x='90' y='75' text-anchor='middle'>Bell (NS)</text><line x1='172' y1='71' x2='210' y2='71' stroke='#1D1A15' marker-end='url(#a)'/><rect x='215' y='58' width='175' height='26' rx='4' fill='#E6F6FF' stroke='#2FB5FF'/><text x='302' y='75' text-anchor='middle'>No salivation</text><text x='10' y='104' font-weight='bold'>2. During: repeated pairing</text><rect x='10' y='112' width='160' height='26' rx='4' fill='#FFF4DC' stroke='#E8A93A'/><text x='90' y='129' text-anchor='middle'>Bell (NS) + Food (UCS)</text><line x1='172' y1='125' x2='210' y2='125' stroke='#1D1A15' marker-end='url(#a)'/><rect x='215' y='112' width='175' height='26' rx='4' fill='#FFF4DC' stroke='#E8A93A'/><text x='302' y='129' text-anchor='middle'>Salivation (UCR)</text><text x='10' y='164' font-weight='bold'>3. After conditioning (acquisition)</text><rect x='10' y='172' width='160' height='26' rx='4' fill='#F0EBFF' stroke='#7C5CFF'/><text x='90' y='189' text-anchor='middle'>Bell (CS)</text><line x1='172' y1='185' x2='210' y2='185' stroke='#1D1A15' marker-end='url(#a)'/><rect x='215' y='172' width='175' height='26' rx='4' fill='#F0EBFF' stroke='#7C5CFF'/><text x='302' y='189' text-anchor='middle'>Salivation (CR)</text><text x='10' y='225'>Extinction: CS alone, repeated, so CR fades.</text><text x='10' y='243'>Spontaneous recovery: CR returns after a rest.</text></svg>
