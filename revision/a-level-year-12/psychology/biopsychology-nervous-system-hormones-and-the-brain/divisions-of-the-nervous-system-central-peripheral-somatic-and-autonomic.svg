<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='145' y='8' width='110' height='26' rx='6' fill='#F3F0E8' stroke='#1D1A15'/><text x='200' y='25' text-anchor='middle' font-weight='bold'>Nervous system</text><path d='M200 34V47H80V60M200 47H305V60' fill='none' stroke='#1D1A15'/><rect x='20' y='60' width='120' height='34' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='80' y='81' text-anchor='middle'>Central (CNS)</text><rect x='235' y='60' width='140' height='34' rx='6' fill='#E6F4FF' stroke='#2FB5FF'/><text x='305' y='81' text-anchor='middle'>Peripheral (PNS)</text><text x='80' y='112' text-anchor='middle' font-size='11'>Brain + spinal cord</text><text x='80' y='126' text-anchor='middle' font-size='11'>Reflexes, decisions</text><path d='M305 94V107H235V120M305 107H347V120' fill='none' stroke='#1D1A15'/><rect x='190' y='120' width='90' height='30' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='235' y='139' text-anchor='middle'>Somatic</text><rect x='300' y='120' width='95' height='30' rx='6' fill='#FFE6EF' stroke='#FF5D8F'/><text x='347' y='139' text-anchor='middle'>Autonomic</text><text x='190' y='166' font-size='11'>Voluntary</text><text x='190' y='179' font-size='11'>movement</text><path d='M347 150V172H250V190M347 172V190' fill='none' stroke='#1D1A15'/><rect x='205' y='190' width='90' height='28' rx='6' fill='#F0ECFF' stroke='#7C5CFF'/><text x='250' y='208' text-anchor='middle' font-size='11'>Sympathetic</text><rect x='300' y='190' width='95' height='28' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='347' y='208' text-anchor='middle' font-size='11'>Parasympathetic</text><text x='250' y='234' text-anchor='middle' font-size='11'>Arouses body,</text><text x='250' y='247' text-anchor='middle' font-size='11'>fight or flight</text><text x='347' y='234' text-anchor='middle' font-size='11'>Calms body,</text><text x='347' y='247' text-anchor='middle' font-size='11'>rest and digest</text><text x='10' y='252' font-size='11'>ANS = involuntary; SNS = voluntary</text></svg>
