<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#1D1A15'/></marker></defs><rect x='20' y='12' width='150' height='40' rx='6' fill='#E8F6FF' stroke='#2FB5FF'/><text x='95' y='36' text-anchor='middle'>Left visual field</text><rect x='230' y='12' width='150' height='40' rx='6' fill='#FFF0F5' stroke='#FF5D8F'/><text x='305' y='36' text-anchor='middle'>Right visual field</text><text x='200' y='38' text-anchor='middle' font-size='18'>+</text><line x1='95' y1='52' x2='292' y2='88' stroke='#2FB5FF' stroke-width='2' marker-end='url(#a)'/><line x1='305' y1='52' x2='108' y2='88' stroke='#FF5D8F' stroke-width='2' marker-end='url(#a)'/><ellipse cx='105' cy='130' rx='80' ry='40' fill='#FFF0F5' stroke='#FF5D8F' stroke-width='2'/><ellipse cx='295' cy='130' rx='80' ry='40' fill='#E8F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='105' y='127' text-anchor='middle'>LEFT hemisphere</text><text x='105' y='144' text-anchor='middle'>speech, language</text><text x='295' y='127' text-anchor='middle'>RIGHT hemisphere</text><text x='295' y='144' text-anchor='middle'>spatial; left hand</text><line x1='194' y1='122' x2='206' y2='138' stroke='#FF5D8F' stroke-width='2.5'/><line x1='194' y1='138' x2='206' y2='122' stroke='#FF5D8F' stroke-width='2.5'/><text x='200' y='186' text-anchor='middle'>Corpus callosum cut</text><text x='200' y='210' text-anchor='middle'>Right field → left hemisphere → can say what it saw</text><text x='200' y='229' text-anchor='middle'>Left field → right hemisphere → can't name; left hand selects</text><text x='200' y='248' text-anchor='middle'>Image shown for 0.1 s while eyes fixate on +</text></svg>
