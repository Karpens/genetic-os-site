<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Time periods and productivity</text><rect x='15' y='35' width='175' height='108' rx='8' fill='#E3F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='102' y='54' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>SHORT RUN</text><text x='102' y='75' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>At least one factor fixed</text><text x='102' y='91' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(e.g. capital, land)</text><text x='102' y='107' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Output changed by varying</text><text x='102' y='123' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>labour or other variable inputs</text><text x='102' y='137' text-anchor='middle' font-family='sans-serif' font-size='10' fill='#1D1A15'>Diminishing returns apply</text><rect x='210' y='35' width='175' height='108' rx='8' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='297' y='54' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>LONG RUN</text><text x='297' y='75' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>All factors are variable</text><text x='297' y='91' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Scale of production can change</text><text x='297' y='107' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(new factory, more machinery)</text><text x='297' y='123' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Economies and diseconomies</text><text x='297' y='137' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>of scale apply</text><rect x='15' y='158' width='370' height='88' rx='8' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><text x='200' y='177' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Productivity = output per unit of input</text><text x='200' y='197' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Labour productivity = total output ÷ number of workers</text><text x='200' y='215' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(or per worker per hour)</text><text x='200' y='235' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>More workers raise production, not necessarily productivity</text></svg>
