<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='18' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Converting nominal to real values</text><rect x='20' y='32' width='160' height='48' rx='6' fill='#FFF3DC' stroke='#E8A93A' stroke-width='2'/><text x='100' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Nominal wage</text><text x='100' y='69' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>£500 (current prices)</text><rect x='220' y='32' width='160' height='48' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='2'/><text x='300' y='52' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Price index (CPI)</text><text x='300' y='69' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>125 (base year = 100)</text><line x1='100' y1='80' x2='140' y2='116' stroke='#1D1A15' stroke-width='2'/><polygon points='140,122 133,112 144,111' fill='#1D1A15'/><line x1='300' y1='80' x2='260' y2='116' stroke='#1D1A15' stroke-width='2'/><polygon points='260,122 256,111 267,112' fill='#1D1A15'/><rect x='70' y='124' width='260' height='42' rx='6' fill='#E2F6EC' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='150' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Real = Nominal ÷ Index × 100</text><line x1='200' y1='166' x2='200' y2='190' stroke='#1D1A15' stroke-width='2'/><polygon points='200,196 194,186 206,186' fill='#1D1A15'/><rect x='70' y='198' width='260' height='46' rx='6' fill='#F0EBFF' stroke='#7C5CFF' stroke-width='2'/><text x='200' y='217' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>£500 ÷ 125 × 100 = £400</text><text x='200' y='235' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(real wage in base-year prices)</text></svg>
