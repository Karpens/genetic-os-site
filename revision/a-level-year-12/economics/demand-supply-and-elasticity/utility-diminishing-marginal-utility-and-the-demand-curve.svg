<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12'><rect width='400' height='260' fill='#fff'/><rect x='50' y='120' width='169' height='90' fill='#E8A93A' fill-opacity='0.25'/><polygon points='50,30 50,120 219,120' fill='#2FB5FF' fill-opacity='0.3'/><line x1='50' y1='20' x2='50' y2='210' stroke='#1D1A15' stroke-width='1.5'/><line x1='50' y1='210' x2='370' y2='210' stroke='#1D1A15' stroke-width='1.5'/><line x1='50' y1='30' x2='350' y2='190' stroke='#7C5CFF' stroke-width='2.5'/><line x1='50' y1='120' x2='219' y2='120' stroke='#1D1A15' stroke-dasharray='4 3'/><line x1='219' y1='120' x2='219' y2='210' stroke='#1D1A15' stroke-dasharray='4 3'/><text x='8' y='14' fill='#1D1A15'>Price (£)</text><text x='318' y='228' fill='#1D1A15'>Quantity</text><text x='22' y='124' fill='#1D1A15'>P*</text><text x='213' y='226' fill='#1D1A15'>Q*</text><text x='62' y='106' fill='#1D1A15'>Consumer surplus</text><text x='62' y='170' fill='#1D1A15'>Expenditure = P* × Q*</text><text x='225' y='60' fill='#1D1A15'>D = marginal utility (£)</text><text x='20' y='252' font-size='11' fill='#1D1A15'>Falling MU → lower willingness to pay for each extra unit</text></svg>
