"178" font-size="11" fill="#FF5D8F" font-weight="bold">Withdrawals</text><text x="76" y="192" font-size="11" fill="#FF5D8F">S + T + M</text><polyline points="272,225 330,225 330,153" fill="none" stroke="#0E9F5D" stroke-width="2" marker-end="url(#c)"/><text x="324" y="178" text-anchor="end" font-size="11" fill="#0E9F5D" font-weight="bold">Injections</text><text x="324" y="192" text-anchor="end" font-size="11" fill="#0E9F5D">I + G + X</text></svg>
