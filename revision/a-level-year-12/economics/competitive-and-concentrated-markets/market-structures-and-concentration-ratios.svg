<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='14' text-anchor='middle' font-size='13' font-weight='bold'>Market structure spectrum</text><line x1='20' y1='34' x2='372' y2='34' stroke='#1D1A15' stroke-width='2'/><polygon points='382,34 370,28 370,40' fill='#1D1A15'/><text x='20' y='28'>More competition</text><text x='372' y='28' text-anchor='end'>More concentrated</text><rect x='8' y='44' width='88' height='92' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='52' y='59' text-anchor='middle' font-weight='bold'>Perfect</text><text x='52' y='72' text-anchor='middle' font-weight='bold'>competition</text><text x='52' y='92' text-anchor='middle'>Many firms</text><text x='52' y='105' text-anchor='middle'>Same product</text><text x='52' y='118' text-anchor='middle'>Free entry</text><text x='52' y='131' text-anchor='middle'>Price takers</text><rect x='104' y='44' width='88' height='92' rx='6' fill='#E4F6FF' stroke='#2FB5FF'/><text x='148' y='59' text-anchor='middle' font-weight='bold'>Monopolistic</text><text x='148' y='72' text-anchor='middle' font-weight='bold'>competition</text><text x='148' y='92' text-anchor='middle'>Many firms</text><text x='148' y='105' text-anchor='middle'>Differentiated</text><text x='148' y='118' text-anchor='middle'>Low barriers</text><text x='148' y='131' text-anchor='middle'>Brand loyalty</text><rect x='200' y='44' width='88' height='92' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='244' y='59' text-anchor='middle' font-weight='bold'>Oligopoly</text><text x='244' y='72' text-anchor='middle'>(concentrated)</text><text x='244' y='92' text-anchor='middle'>Few large firms</text><text x='244' y='105' text-anchor='middle'>Interdependent</text><text x='244' y='118' text-anchor='middle'>High barriers</text><text x='244' y='131' text-anchor='middle'>Collusion risk</text><rect x='296' y='44' width='88' height='92' rx='6' fill='#FFE6EF' stroke='#FF5D8F'/><text x='340' y='59' text-anchor='middle' font-weight='bold'>Monopoly</text><text x='340' y='72' text-anchor='middle'>(pure)</text><text x='340' y='92' text-anchor='middle'>One firm</text><text x='340' y='105' text-anchor='middle'>Unique product</text><text x='340' y='118' text-anchor='middle'>Blocked entry</text><text x='340' y='131' text-anchor='middle'>Price maker</text><text x='20' y='158' font-weight='bold'>Worked example: market shares</text><rect x='20' y='166' width='108' height='26' fill='#E9E3FF' stroke='#7C5CFF'/><rect x='128' y='166' width='90' height='26' fill='#E4F6FF' stroke='#7C5CFF'/><rect x='218' y='166' width='54' height='26' fill='#E6F7EE' stroke='#7C5CFF'/><rect x='272' y='166' width='36' height='26' fill='#FFF3DC' stroke='#1D1A15'/><rect x='308' y='166' width='72' height='26' fill='#EEEEEE' stroke='#1D1A15'/><text x='74' y='183' text-anchor='middle'>A 30%</text><text x='173' y='183' text-anchor='middle'>B 25%</text><text x='245' y='183' text-anchor='middle'>C 15%</text><text x='290' y='183' text-anchor='middle'>D 10%</text><text x='344' y='183' text-anchor='middle'>Other 20%</text><line x1='20' y1='202' x2='272' y2='202' stroke='#7C5CFF' stroke-width='2'/><line x1='20' y1='197' x2='20' y2='207' stroke='#7C5CFF' stroke-width='2'/><line x1='272' y1='197' x2='272' y2='207' stroke='#7C5CFF' stroke-width='2'/><text x='146' y='221' text-anchor='middle' font-weight='bold'>CR3 = 30 + 25 + 15 = 70%</text><text x='200' y='245' text-anchor='middle'>CRn = (sales of top n firms ÷ total sales) × 100</text></svg>
