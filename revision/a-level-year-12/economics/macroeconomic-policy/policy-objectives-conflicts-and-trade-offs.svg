<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Short-run Phillips curve trade-off</text><line x1='60' y1='220' x2='375' y2='220' stroke='#1D1A15' stroke-width='2'/><line x1='60' y1='40' x2='60' y2='220' stroke='#1D1A15' stroke-width='2'/><text x='215' y='246' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Unemployment rate (%)</text><text x='20' y='130' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15' transform='rotate(-90 20 130)'>Inflation (%)</text><path d='M 85 60 Q 110 190 350 205' fill='none' stroke='#7C5CFF' stroke-width='3'/><text x='95' y='52' font-family='sans-serif' font-size='12' fill='#7C5CFF'>SRPC</text><circle cx='119' cy='128' r='5' fill='#FF5D8F'/><circle cx='225' cy='186' r='5' fill='#0E9F5D'/><text x='140' y='92' font-family='sans-serif' font-size='11' fill='#1D1A15'>A: low unemployment,</text><text x='140' y='106' font-family='sans-serif' font-size='11' fill='#1D1A15'>high inflation</text><text x='235' y='160' font-family='sans-serif' font-size='11' fill='#1D1A15'>B: higher unemployment,</text><text x='235' y='174' font-family='sans-serif' font-size='11' fill='#1D1A15'>lower inflation</text><path d='M 124 131 L 218 183' fill='none' stroke='#E8A93A' stroke-width='1.5' stroke-dasharray='4 3'/></svg>
