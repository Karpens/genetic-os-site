<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 Z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#ffffff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Percentage change: worked method</text><rect x='30' y='32' width='340' height='34' rx='6' fill='#E6F6EE' stroke='#0E9F5D'/><text x='200' y='54' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>1. Find the change = new − old</text><line x1='200' y1='66' x2='200' y2='80' stroke='#1D1A15' marker-end='url(#a)'/><rect x='30' y='82' width='340' height='34' rx='6' fill='#FDF3DD' stroke='#E8A93A'/><text x='200' y='104' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>2. Divide by the ORIGINAL (old) value</text><line x1='200' y1='116' x2='200' y2='130' stroke='#1D1A15' marker-end='url(#a)'/><rect x='30' y='132' width='340' height='34' rx='6' fill='#E3F4FF' stroke='#2FB5FF'/><text x='200' y='154' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>3. × 100, then state % and increase/decrease</text><rect x='30' y='180' width='340' height='68' rx='6' fill='#F1ECFF' stroke='#7C5CFF'/><text x='200' y='198' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Example: sales £250,000 → £300,000</text><text x='200' y='216' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>(50,000 ÷ 250,000) × 100 = +20%</text><text x='200' y='236' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Index = (value ÷ base) × 100, base = 100</text></svg>
