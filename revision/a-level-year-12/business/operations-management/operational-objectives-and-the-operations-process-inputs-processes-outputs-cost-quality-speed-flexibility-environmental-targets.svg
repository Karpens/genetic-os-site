<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='18' font-size='13' font-weight='bold'>The operations process</text><rect x='5' y='30' width='110' height='70' rx='6' fill='#E6F6EE' stroke='#0E9F5D' stroke-width='1.5'/><text x='60' y='48' font-size='12' font-weight='bold'>INPUTS</text><text x='60' y='66'>Labour, capital,</text><text x='60' y='82'>materials, energy</text><rect x='145' y='30' width='110' height='70' rx='6' fill='#FFF3DB' stroke='#E8A93A' stroke-width='1.5'/><text x='200' y='48' font-size='12' font-weight='bold'>PROCESS</text><text x='200' y='66'>Transform: make,</text><text x='200' y='82'>assemble, serve</text><rect x='285' y='30' width='110' height='70' rx='6' fill='#E3F4FF' stroke='#2FB5FF' stroke-width='1.5'/><text x='340' y='48' font-size='12' font-weight='bold'>OUTPUTS</text><text x='340' y='66'>Goods, services</text><text x='340' y='82'>(and waste)</text><path d='M117 65 H139' stroke='#1D1A15' stroke-width='1.5'/><polygon points='139,60 145,65 139,70' fill='#1D1A15'/><path d='M257 65 H279' stroke='#1D1A15' stroke-width='1.5'/><polygon points='279,60 285,65 279,70' fill='#1D1A15'/><text x='200' y='118'>Value added = selling price − cost of bought-in inputs</text><text x='200' y='138' font-size='12' font-weight='bold'>Operational objectives (trade-offs likely)</text><rect x='2' y='146' width='76' height='52' rx='6' fill='#E6F6EE' stroke='#0E9F5D'/><text x='40' y='164' font-size='12' font-weight='bold'>Cost</text><text x='40' y='179'>unit cost</text><text x='40' y='192'>down</text><rect x='82' y='146' width='76' height='52' rx='6' fill='#FFF3DB' stroke='#E8A93A'/><text x='120' y='164' font-size='12' font-weight='bold'>Quality</text><text x='120' y='179'>fit for</text><text x='120' y='192'>purpose</text><rect x='162' y='146' width='76' height='52' rx='6' fill='#E3F4FF' stroke='#2FB5FF'/><text x='200' y='164' font-size='12' font-weight='bold'>Speed</text><text x='200' y='179'>short lead</text><text x='200' y='192'>times</text><rect x='242' y='146' width='76' height='52' rx='6' fill='#FFE6EE' stroke='#FF5D8F'/><text x='280' y='164' font-size='12' font-weight='bold'>Flexibility</text><text x='280' y='179'>adapt volume</text><text x='280' y='192'>and design</text><rect x='322' y='146' width='76' height='52' rx='6' fill='#EEE9FF' stroke='#7C5CFF'/><text x='360' y='164' font-size='12' font-weight='bold'>Environment</text><text x='360' y='179'>less waste</text><text x='360' y='192'>and carbon</text><text x='200' y='224'>Objectives should support corporate objectives</text><text x='200' y='242'>and suit the target market (budget vs premium)</text></g></svg>
