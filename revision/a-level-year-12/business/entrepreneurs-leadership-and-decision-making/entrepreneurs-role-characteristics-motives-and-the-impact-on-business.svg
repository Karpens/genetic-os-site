<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#fff"/><g font-family="sans-serif" font-size="11" fill="#1D1A15"><line x1="85" y1="75" x2="155" y2="108" stroke="#1D1A15"/><line x1="315" y1="75" x2="245" y2="108" stroke="#1D1A15"/><line x1="85" y1="185" x2="155" y2="152" stroke="#1D1A15"/><line x1="315" y1="185" x2="245" y2="152" stroke="#1D1A15"/><ellipse cx="200" cy="130" rx="58" ry="28" fill="#FDF1D8" stroke="#E8A93A" stroke-width="2"/><text x="200" y="134" text-anchor="middle" font-size="13" font-weight="bold">Entrepreneur</text><rect x="10" y="15" width="170" height="60" rx="6" fill="#E3F6EC" stroke="#0E9F5D"/><text x="20" y="32" font-weight="bold">ROLE</text><text x="20" y="47">Spots opportunities,</text><text x="20" y="60">organises resources,</text><text x="20" y="72">bears the risk</text><rect x="220" y="15" width="170" height="60" rx="6" fill="#E6F6FF" stroke="#2FB5FF"/><text x="230" y="32" font-weight="bold">CHARACTERISTICS</text><text x="230" y="47">Risk-taker, creative,</text><text x="230" y="60">determined, confident,</text><text x="230" y="72">adaptable</text><rect x="10" y="185" width="170" height="60" rx="6" fill="#FFE6EF" stroke="#FF5D8F"/><text x="20" y="202" font-weight="bold">MOTIVES</text><text x="20" y="217">Profit, independence,</text><text x="20" y="230">passion, challenge,</text><text x="20" y="242">social aims</text><rect x="220" y="185" width="170" height="60" rx="6" fill="#EEE9FF" stroke="#7C5CFF"/><text x="230" y="202" font-weight="bold">IMPACT</text><text x="230" y="217">Jobs, innovation, tax,</text><text x="230" y="230">competition, growth;</text><text x="230" y="242">risk of failure</text></g></svg>
