<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='p0' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#FF5D8F'/></marker><marker id='b0' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#2FB5FF'/></marker><marker id='g0' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto-start-reverse' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#0E9F5D'/></marker></defs><text x='15' y='20' font-weight='bold'>Resolving a force</text><line x1='30' y1='150' x2='90' y2='46' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p0)'/><line x1='30' y1='150' x2='88' y2='150' stroke='#2FB5FF' stroke-width='3' marker-end='url(#b0)'/><line x1='90' y1='150' x2='90' y2='52' stroke='#0E9F5D' stroke-width='3' marker-end='url(#g0)'/><path d='M55 150 A25 25 0 0 0 42.5 128.4' fill='none' stroke='#1D1A15' stroke-width='2'/><text x='60' y='142' font-size='11'>60°</text><text x='98' y='62'>F = 20 N</text><text x='98' y='100'>Fsinθ = 17.3 N</text><text x='30' y='168'>Fcosθ = 10 N</text><text x='15' y='197' font-weight='bold'>Equilibrium:</text><text x='15' y='212'>resultant force = 0 and</text><text x='15' y='226'>resultant moment = 0</text><text x='15' y='244'>Topples if centre of mass</text><text x='15' y='257'>falls outside the base</text><text x='215' y='20' font-weight='bold'>Moment = F × d</text><rect x='215' y='70' width='170' height='10' fill='#FDF3DC' stroke='#E8A93A' stroke-width='2'/><polygon points='250,80 238,102 262,102' fill='#FDF3DC' stroke='#E8A93A' stroke-width='2'/><text x='268' y='100' font-size='11'>pivot</text><line x1='360' y1='30' x2='360' y2='66' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p0)'/><text x='368' y='48'>F</text><line x1='252' y1='118' x2='358' y2='118' stroke='#2FB5FF' stroke-width='2' marker-start='url(#b0)' marker-end='url(#b0)'/><text x='301' y='111'>d</text><text x='215' y='160' font-weight='bold'>Couple: equal, opposite,</text><text x='215' y='174' font-weight='bold'>parallel forces</text><circle cx='292' cy='212' r='28' fill='#E6F6FF' stroke='#2FB5FF' stroke-width='2'/><line x1='264' y1='192' x2='264' y2='234' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p0)'/><line x1='320' y1='234' x2='320' y2='192' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p0)'/><text x='249' y='216'>F</text><text x='327' y='216'>F</text><text x='215' y='256'>moment = F × d between them</text></svg>
