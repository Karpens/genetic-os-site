<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='20' font-size='13' text-anchor='middle'>I = ΔQ/Δt     V = W/Q     R = V/I</text><text x='200' y='38' text-anchor='middle'>Ohm's law: I ∝ V at constant temperature</text><g fill='none' stroke='#1D1A15' stroke-width='2'><path d='M25 70V170H120'/><path d='M150 70V170H245'/><path d='M275 70V170H370'/></g><g stroke-width='3' fill='none'><path d='M25 170L115 90' stroke='#0E9F5D'/><path d='M150 170Q175 105 240 90' stroke='#FF5D8F'/><path d='M275 170H322Q338 168 346 80' stroke='#7C5CFF'/></g><g font-size='11' text-anchor='middle'><text x='17' y='80'>I</text><text x='122' y='186'>V</text><text x='142' y='80'>I</text><text x='247' y='186'>V</text><text x='267' y='80'>I</text><text x='372' y='186'>V</text><text x='322' y='186'>0.7 V</text><text x='72' y='205' font-size='12'>Ohmic</text><text x='72' y='219'>straight line, constant R</text><text x='197' y='205' font-size='12'>Filament lamp</text><text x='197' y='219'>R rises as it heats</text><text x='322' y='205' font-size='12'>Diode</text><text x='322' y='219'>forward threshold only</text></g><text x='200' y='242' text-anchor='middle'>ρ = RA/L (Ω m)  |  Superconductor: ρ = 0 below critical T</text><path d='M322 170V174' stroke='#1D1A15' stroke-width='2'/></g></svg>
