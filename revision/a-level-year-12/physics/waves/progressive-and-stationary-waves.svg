<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="12" fill="#1D1A15"><text x="200" y="14" text-anchor="middle" font-size="13" font-weight="bold">Stationary waves on a string fixed at both ends</text><path d="M50 70H350" stroke="#1D1A15" stroke-width="2" stroke-dasharray="4 4" opacity="0.3" fill="none"/><path d="M50 55V85M350 55V85" stroke="#1D1A15" stroke-width="3" fill="none"/><path d="M50 70Q200 0 350 70" fill="none" stroke="#2FB5FF" stroke-width="3"/><path d="M50 70Q200 140 350 70" fill="none" stroke="#FF5D8F" stroke-width="3"/><circle cx="50" cy="70" r="4" fill="#7C5CFF"/><circle cx="350" cy="70" r="4" fill="#7C5CFF"/><circle cx="200" cy="35" r="4" fill="#0E9F5D"/><circle cx="200" cy="105" r="4" fill="#0E9F5D"/><text x="200" y="28" text-anchor="middle" font-weight="bold" fill="#0E9F5D">A</text><text x="50" y="98" text-anchor="middle" font-weight="bold" fill="#7C5CFF">N</text><text x="350" y="98" text-anchor="middle" font-weight="bold" fill="#7C5CFF">N</text><path d="M50 118H350M50 118l8-4M50 118l8 4M350 118l-8-4M350 118l-8 4" stroke="#E8A93A" stroke-width="2" fill="none"/><text x="200" y="135" text-anchor="middle">1st harmonic: L = λ/2</text><text x="200" y="152" text-anchor="middle" font-weight="bold">2nd harmonic: L = λ, f₂ = 2f₁</text><path d="M50 170V200M350 170V200" stroke="#1D1A15" stroke-width="3" fill="none"/><path d="M50 185Q125 145 200 185Q275 225 350 185" fill="none" stroke="#2FB5FF" stroke-width="3"/><path d="M50 185Q125 225 200 185Q275 145 350 185" fill="none" stroke="#FF5D8F" stroke-width="3"/><circle cx="50" cy="185" r="4" fill="#7C5CFF"/><circle cx="200" cy="185" r="4" fill="#7C5CFF"/><circle cx="350" cy="185" r="4" fill="#7C5CFF"/><text x="50" y="224" text-anchor="middle" font-weight="bold" fill="#7C5CFF">N</text><text x="200" y="224" text-anchor="middle" font-weight="bold" fill="#7C5CFF">N</text><text x="350" y="224" text-anchor="middle" font-weight="bold" fill="#7C5CFF">N</text><text x="200" y="242" text-anchor="middle" font-size="11">N = node (zero), A = antinode (max); adjacent nodes λ/2 apart</text><text x="200" y="257" text-anchor="middle" font-weight="bold">f₁ = (1 ÷ 2L)√(T ÷ μ)</text></svg>
