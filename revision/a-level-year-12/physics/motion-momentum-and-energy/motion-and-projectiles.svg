<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='p1' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#FF5D8F'/></marker><marker id='b1' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#2FB5FF'/></marker><marker id='g1' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#0E9F5D'/></marker><marker id='k1' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto' markerUnits='userSpaceOnUse'><path d='M0 0L8 4L0 8z' fill='#1D1A15'/></marker></defs><text x='15' y='18' font-weight='bold'>Projectile motion</text><line x1='15' y1='150' x2='195' y2='150' stroke='#1D1A15' stroke-width='2'/><path d='M25 150 Q105 -10 185 150' fill='none' stroke='#7C5CFF' stroke-width='3'/><line x1='25' y1='150' x2='46' y2='108' stroke='#FF5D8F' stroke-width='3' marker-end='url(#p1)'/><text x='28' y='116'>u</text><line x1='100' y1='58' x2='140' y2='58' stroke='#2FB5FF' stroke-width='3' marker-end='url(#b1)'/><text x='62' y='45' font-size='11'>horizontal v constant</text><line x1='105' y1='82' x2='105' y2='120' stroke='#0E9F5D' stroke-width='3' marker-end='url(#g1)'/><text x='113' y='108'>a = g</text><text x='15' y='178' font-weight='bold'>SUVAT (constant a)</text><text x='15' y='194'>v = u + at</text><text x='15' y='208'>s = ut + ½at²</text><text x='15' y='222'>v² = u² + 2as</text><text x='15' y='236'>s = ½(u + v)t</text><text x='15' y='252' font-size='11'>s–t graph: gradient = v</text><text x='215' y='18' font-weight='bold'>v–t graph</text><path d='M240 120 L240 28' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#k1)'/><path d='M240 120 L390 120' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#k1)'/><text x='224' y='40'>v</text><text x='380' y='135'>t</text><polygon points='240,120 240,100 350,45 350,120' fill='#E6F6FF'/><line x1='240' y1='100' x2='350' y2='45' stroke='#2FB5FF' stroke-width='3'/><text x='250' y='114' font-size='11'>area = s</text><text x='285' y='100' font-size='11'>gradient = a</text><text x='215' y='148' font-weight='bold'>Terminal velocity</text><path d='M240 240 L240 158' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#k1)'/><path d='M240 240 L390 240' fill='none' stroke='#1D1A15' stroke-width='2' marker-end='url(#k1)'/><text x='224' y='170'>v</text><text x='380' y='254'>t</text><path d='M240 240 C262 190 285 182 385 182' fill='none' stroke='#0E9F5D' stroke-width='3'/><text x='300' y='174' font-size='11'>drag = weight</text><text x='290' y='204' font-size='11'>a = 0, v constant</text></svg>
