<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="#fff"/><g font-family="sans-serif" font-size="11" fill="#1D1A15"><path d="M202 8V252M8 128H392" stroke="#1D1A15" stroke-width="2" opacity=".25" fill="none"/><text x="8" y="18" font-size="13" font-weight="bold">SI base units</text><g stroke="#0E9F5D" stroke-width="2" fill="#E3F6EC"><rect x="8" y="26" width="58" height="34" rx="6"/><rect x="70" y="26" width="58" height="34" rx="6"/><rect x="132" y="26" width="58" height="34" rx="6"/><rect x="8" y="64" width="58" height="34" rx="6"/><rect x="70" y="64" width="58" height="34" rx="6"/><rect x="132" y="64" width="58" height="34" rx="6"/></g><g text-anchor="middle"><text x="37" y="40">metre</text><text x="37" y="54" font-weight="bold">m</text><text x="99" y="40">kilogram</text><text x="99" y="54" font-weight="bold">kg</text><text x="161" y="40">second</text><text x="161" y="54" font-weight="bold">s</text><text x="37" y="78">ampere</text><text x="37" y="92" font-weight="bold">A</text><text x="99" y="78">kelvin</text><text x="99" y="92" font-weight="bold">K</text><text x="161" y="78">mole</text><text x="161" y="92" font-weight="bold">mol</text></g><text x="8" y="116">Others derived: N, J, W</text><text x="300" y="18" font-size="13" font-weight="bold" text-anchor="middle">Types of error</text><g stroke="#2FB5FF" stroke-width="2" fill="#E6F6FF"><circle cx="250" cy="62" r="28"/><circle cx="350" cy="62" r="28"/></g><g stroke="#2FB5FF" stroke-width="2" fill="none"><circle cx="250" cy="62" r="13"/><circle cx="350" cy="62" r="13"/></g><g fill="#FF5D8F"><circle cx="232" cy="50" r="3"/><circle cx="268" cy="48" r="3"/><circle cx="262" cy="78" r="3"/><circle cx="238" cy="76" r="3"/><circle cx="250" cy="40" r="3"/></g><g fill="#7C5CFF"><circle cx="366" cy="48" r="3"/><circle cx="370" cy="54" r="3"/><circle cx="363" cy="54" r="3"/><circle cx="368" cy="46" r="3"/></g><g text-anchor="middle"><text x="250" y="106" font-weight="bold">Random</text><text x="250" y="120">average it out</text><text x="350" y="106" font-weight="bold">Systematic</text><text x="350" y="120">zero error stays</text></g><text x="8" y="148" font-size="13" font-weight="bold">Quality of measurement</text><rect x="12" y="158" width="176" height="22" fill="#FFF3DC" stroke="#E8A93A" stroke-width="2"/><path d="M23 158v10M34 158v10M45 158v10M56 158v10M67 158v10M78 158v10M89 158v10M100 158v10M111 158v10M122 158v10M133 158v10M144 158v10M155 158v10M166 158v10M177 158v10" stroke="#E8A93A" stroke-width="2" fill="none"/><path d="M56 192H67M56 187V197M67 187V197" stroke="#2FB5FF" stroke-width="2" fill="none"/><text x="76" y="196">smallest step</text><rect x="10" y="205" width="8" height="8" fill="#7C5CFF"/><text x="24" y="213">Precise: readings grouped</text><rect x="10" y="221" width="8" height="8" fill="#0E9F5D"/><text x="24" y="229">Accurate: near true value</text><rect x="10" y="237" width="8" height="8" fill="#2FB5FF"/><text x="24" y="245">Resolution: smallest change</text><text x="212" y="148" font-size="13" font-weight="bold">Percentage uncertainty</text><rect x="212" y="158" width="180" height="30" rx="6" fill="#FFE8F0" stroke="#FF5D8F" stroke-width="2"/><text x="302" y="178" font-size="13" text-anchor="middle">% unc = (Δx ÷ x) × 100</text><text x="212" y="208">Example: (0.1 ÷ 2.0) × 100 = 5%</text><path d="M212 216H392" stroke="#1D1A15" stroke-width="2" opacity=".25" fill="none"/><text x="212" y="234">× or ÷ : add % uncertainties</text><text x="212" y="250">power n : multiply % by n</text></g></svg>
