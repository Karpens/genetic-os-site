<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='30' y='70' width='200' height='160' fill='#DDF3FF'/><path d='M30 30V230H230V30' fill='none' stroke='#1D1A15' stroke-width='2'/><line x1='30' y1='70' x2='230' y2='70' stroke='#2FB5FF' stroke-width='2' stroke-dasharray='5 3'/><text x='36' y='62'>Surface: p = p₀</text><rect x='110' y='120' width='60' height='50' fill='#FBE3B3' stroke='#E8A93A' stroke-width='2'/><text x='126' y='150'>block</text><line x1='125' y1='120' x2='125' y2='98' stroke='#0E9F5D' stroke-width='2'/><polygon points='120,104 125,95 130,104' fill='#0E9F5D'/><text x='134' y='108' fill='#0E9F5D'>U</text><line x1='155' y1='170' x2='155' y2='196' stroke='#FF5D8F' stroke-width='2'/><polygon points='150,190 155,199 160,190' fill='#FF5D8F'/><text x='164' y='192' fill='#FF5D8F'>W</text><line x1='62' y1='72' x2='62' y2='168' stroke='#7C5CFF' stroke-width='1.5'/><polygon points='58,80 62,72 66,80' fill='#7C5CFF'/><polygon points='58,160 62,168 66,160' fill='#7C5CFF'/><line x1='62' y1='170' x2='110' y2='170' stroke='#7C5CFF' stroke-width='1' stroke-dasharray='3 3'/><text x='68' y='124' fill='#7C5CFF'>h</text><text x='40' y='218'>liquid (density ρ)</text><text x='244' y='60'>Upthrust U = ρVg</text><text x='244' y='78'>ρ = fluid density</text><text x='244' y='96'>V = volume displaced</text><text x='244' y='124'>Floating: U = W</text><text x='244' y='152'>Pressure at depth h:</text><text x='244' y='170'>p = p₀ + hρg</text><text x='244' y='198'>Deeper → larger p</text></svg>
