<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Sector of a circle (θ in radians)</text><path d='M100 200 L220 200 A120 120 0 0 0 177.1 108.1 Z' fill='#2FB5FF' fill-opacity='0.3' stroke='#1D1A15' stroke-width='1.5'/><text x='160' y='216' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>r</text><text x='125' y='192' font-family='sans-serif' font-size='12' fill='#7C5CFF'>θ</text><text x='200' y='98' font-family='sans-serif' font-size='12' fill='#1D1A15'>arc s</text><circle cx='100' cy='200' r='3' fill='#1D1A15'/><text x='250' y='150' font-family='sans-serif' font-size='12' fill='#1D1A15'>Arc length s = rθ</text><text x='250' y='175' font-family='sans-serif' font-size='12' fill='#1D1A15'>Area = ½r²θ</text><text x='250' y='200' font-family='sans-serif' font-size='12' fill='#1D1A15'>Perimeter = 2r + rθ</text><text x='250' y='225' font-family='sans-serif' font-size='12' fill='#1D1A15'>180° = π radians</text></svg>
