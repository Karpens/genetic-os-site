<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Partial sums of 1 + ½ + ¼ + … approach S∞ = 2</text><line x1='40' y1='220' x2='380' y2='220' stroke='#1D1A15' stroke-width='1.5'/><line x1='40' y1='220' x2='40' y2='45' stroke='#1D1A15' stroke-width='1.5'/><line x1='40' y1='60' x2='380' y2='60' stroke='#FF5D8F' stroke-width='1.5' stroke-dasharray='6 4'/><text x='290' y='54' font-family='sans-serif' font-size='12' fill='#1D1A15'>S∞ = a/(1 − r) = 2</text><rect x='60' y='140' width='35' height='80' fill='#2FB5FF' fill-opacity='0.4' stroke='#2FB5FF'/><rect x='115' y='100' width='35' height='120' fill='#2FB5FF' fill-opacity='0.4' stroke='#2FB5FF'/><rect x='170' y='80' width='35' height='140' fill='#2FB5FF' fill-opacity='0.4' stroke='#2FB5FF'/><rect x='225' y='70' width='35' height='150' fill='#2FB5FF' fill-opacity='0.4' stroke='#2FB5FF'/><rect x='280' y='65' width='35' height='155' fill='#2FB5FF' fill-opacity='0.4' stroke='#2FB5FF'/><text x='77' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>S₁=1</text><text x='132' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>S₂=1.5</text><text x='187' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>S₃=1.75</text><text x='242' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>S₄=1.875</text><text x='297' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>S₅≈1.94</text><text x='46' y='254' font-family='sans-serif' font-size='11' fill='#1D1A15'>a = 1, r = ½, |r| &lt; 1 so the series converges</text></svg>
