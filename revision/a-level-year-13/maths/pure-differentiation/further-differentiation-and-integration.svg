<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Integration by parts: method</text><rect x='70' y='35' width='260' height='40' rx='6' fill='#7C5CFF' fill-opacity='0.2' stroke='#7C5CFF'/><text x='200' y='60' text-anchor='middle' font-family='sans-serif' font-size='14' fill='#1D1A15'>∫u dv = uv − ∫v du</text><line x1='200' y1='75' x2='200' y2='95' stroke='#1D1A15' stroke-width='1.5'/><rect x='50' y='95' width='300' height='40' rx='6' fill='#E8A93A' fill-opacity='0.25' stroke='#E8A93A'/><text x='200' y='112' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Step 1: choose u (priority LATE)</text><text x='200' y='128' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Log, Algebraic, Trig, Exponential</text><line x1='200' y1='135' x2='200' y2='155' stroke='#1D1A15' stroke-width='1.5'/><rect x='50' y='155' width='300' height='36' rx='6' fill='#2FB5FF' fill-opacity='0.25' stroke='#2FB5FF'/><text x='200' y='178' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Step 2: find du = u′ dx and v = ∫dv</text><line x1='200' y1='191' x2='200' y2='208' stroke='#1D1A15' stroke-width='1.5'/><rect x='50' y='208' width='300' height='36' rx='6' fill='#0E9F5D' fill-opacity='0.25' stroke='#0E9F5D'/><text x='200' y='231' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Step 3: substitute, then integrate ∫v du</text></svg>
