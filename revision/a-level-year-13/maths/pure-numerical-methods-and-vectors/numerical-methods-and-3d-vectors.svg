<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Trapezium rule: y = 1/x, 2 strips, x = 1 to 3</text><polygon points='60,220 60,70 180,145 180,220' fill='#2FB5FF' fill-opacity='0.3' stroke='#2FB5FF'/><polygon points='180,220 180,145 300,170 300,220' fill='#0E9F5D' fill-opacity='0.3' stroke='#0E9F5D'/><polyline points='60,70 90,100 120,120 180,145 240,160 300,170' fill='none' stroke='#FF5D8F' stroke-width='2'/><line x1='40' y1='220' x2='340' y2='220' stroke='#1D1A15' stroke-width='1.5'/><line x1='40' y1='220' x2='40' y2='40' stroke='#1D1A15' stroke-width='1.5'/><text x='60' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>1</text><text x='180' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>2</text><text x='300' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>3</text><text x='50' y='64' text-anchor='end' font-family='sans-serif' font-size='11' fill='#1D1A15'>1</text><text x='190' y='138' font-family='sans-serif' font-size='11' fill='#1D1A15'>1/2</text><text x='304' y='164' font-family='sans-serif' font-size='11' fill='#1D1A15'>1/3</text><text x='120' y='205' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>h = 1</text><text x='240' y='205' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>h = 1</text><text x='200' y='256' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Area ≈ ½h[y₀ + 2y₁ + y₂]; convex curve gives an overestimate</text></svg>
