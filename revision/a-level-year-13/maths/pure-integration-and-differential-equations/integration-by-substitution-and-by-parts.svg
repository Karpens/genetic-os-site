<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><rect x='10' y='10' width='186' height='240' rx='8' fill='#E3F7EC' stroke='#0E9F5D'/><rect x='206' y='10' width='184' height='240' rx='8' fill='#DFF3FF' stroke='#2FB5FF'/><text x='20' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>BY PARTS</text><text x='20' y='54' font-family='sans-serif' font-size='11' fill='#1D1A15'>∫u (dv/dx) dx</text><text x='20' y='70' font-family='sans-serif' font-size='11' fill='#1D1A15'>= uv − ∫v (du/dx) dx</text><text x='20' y='96' font-family='sans-serif' font-size='11' fill='#1D1A15'>1 u: ln x or xⁿ</text><text x='20' y='114' font-family='sans-serif' font-size='11' fill='#1D1A15'>2 dv/dx: eˣ, sin x, cos x</text><text x='20' y='132' font-family='sans-serif' font-size='11' fill='#1D1A15'>3 find du/dx and v</text><text x='20' y='150' font-family='sans-serif' font-size='11' fill='#1D1A15'>4 apply; integrate the rest</text><text x='20' y='180' font-family='sans-serif' font-size='11' font-weight='bold' fill='#1D1A15'>Example: ∫ln x dx</text><text x='20' y='198' font-family='sans-serif' font-size='11' fill='#1D1A15'>u = ln x, dv/dx = 1</text><text x='20' y='216' font-family='sans-serif' font-size='11' fill='#1D1A15'>= x ln x − x + c</text><text x='20' y='238' font-family='sans-serif' font-size='11' fill='#1D1A15'>x²eˣ: use parts twice</text><text x='216' y='32' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>SUBSTITUTION</text><text x='216' y='58' font-family='sans-serif' font-size='11' fill='#1D1A15'>1 choose u = g(x)</text><text x='216' y='76' font-family='sans-serif' font-size='11' fill='#1D1A15'>2 dx = du / (du/dx)</text><text x='216' y='94' font-family='sans-serif' font-size='11' fill='#1D1A15'>3 change limits to u</text><text x='216' y='112' font-family='sans-serif' font-size='11' fill='#1D1A15'>4 integrate in u</text><text x='216' y='130' font-family='sans-serif' font-size='11' fill='#1D1A15'>5 indefinite: back to x</text><text x='216' y='160' font-family='sans-serif' font-size='11' font-weight='bold' fill='#1D1A15'>Example</text><text x='216' y='178' font-family='sans-serif' font-size='11' fill='#1D1A15'>∫₀² 2x(x²+1)³ dx</text><text x='216' y='196' font-family='sans-serif' font-size='11' fill='#1D1A15'>u = x²+1, du = 2x dx</text><text x='216' y='214' font-family='sans-serif' font-size='11' fill='#1D1A15'>limits: 1 to 5</text><text x='216' y='232' font-family='sans-serif' font-size='11' fill='#1D1A15'>= [u⁴/4]₁⁵ = 156</text></svg>
