<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>Inverse function: reflection in y = x</text><line x1='50' y1='220' x2='250' y2='220' stroke='#1D1A15' stroke-width='1.5'/><line x1='50' y1='220' x2='50' y2='40' stroke='#1D1A15' stroke-width='1.5'/><text x='255' y='224' font-family='sans-serif' font-size='12' fill='#1D1A15'>x</text><text x='44' y='34' font-family='sans-serif' font-size='12' fill='#1D1A15'>y</text><line x1='50' y1='220' x2='210' y2='60' stroke='#E8A93A' stroke-width='2' stroke-dasharray='5 4'/><text x='214' y='60' font-family='sans-serif' font-size='12' fill='#1D1A15'>y = x</text><line x1='50' y1='220' x2='130' y2='60' stroke='#7C5CFF' stroke-width='2.5'/><text x='136' y='72' font-family='sans-serif' font-size='12' fill='#1D1A15'>y = f(x)</text><line x1='50' y1='220' x2='210' y2='140' stroke='#0E9F5D' stroke-width='2.5'/><text x='214' y='146' font-family='sans-serif' font-size='12' fill='#1D1A15'>y = f⁻¹(x)</text><circle cx='90' cy='140' r='4' fill='#FF5D8F'/><circle cx='130' cy='180' r='4' fill='#FF5D8F'/><text x='60' y='134' font-family='sans-serif' font-size='11' fill='#1D1A15'>(1, 2)</text><text x='136' y='196' font-family='sans-serif' font-size='11' fill='#1D1A15'>(2, 1)</text><text x='270' y='110' font-family='sans-serif' font-size='11' fill='#1D1A15'>Swap x and y</text><text x='270' y='128' font-family='sans-serif' font-size='11' fill='#1D1A15'>to find f⁻¹</text></svg>
