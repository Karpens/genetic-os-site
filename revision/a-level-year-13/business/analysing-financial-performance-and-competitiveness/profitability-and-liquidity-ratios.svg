<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='10' y='20' width='180' height='28' fill='#D8F0FF' stroke='#2FB5FF'/><text x='100' y='38' text-anchor='middle'>Revenue (sales)</text><path d='M25 50V76M20 71L25 77L30 71' stroke='#1D1A15' fill='none'/><text x='40' y='68'>– cost of sales</text><rect x='10' y='80' width='180' height='28' fill='#DDF3E8' stroke='#0E9F5D'/><text x='100' y='98' text-anchor='middle'>Gross profit</text><path d='M25 110V136M20 131L25 137L30 131' stroke='#1D1A15' fill='none'/><text x='40' y='128'>– overheads / expenses</text><rect x='10' y='140' width='180' height='28' fill='#DDF3E8' stroke='#0E9F5D'/><text x='100' y='158' text-anchor='middle'>Operating profit</text><path d='M25 170V196M20 191L25 197L30 191' stroke='#1D1A15' fill='none'/><text x='40' y='188'>– interest and tax</text><rect x='10' y='200' width='180' height='28' fill='#DDF3E8' stroke='#0E9F5D'/><text x='100' y='218' text-anchor='middle'>Profit for the year</text><rect x='200' y='20' width='190' height='100' fill='#FBEFD3' stroke='#E8A93A'/><text x='208' y='36' font-weight='bold'>LIQUIDITY</text><text x='208' y='52'>Current ratio =</text><text x='208' y='66'>current assets ÷ current liabs</text><text x='208' y='80'>ideal about 1.5–2 : 1</text><text x='208' y='96'>Acid test = (CA – inventories)</text><text x='208' y='110'>÷ CL, ideal about 1 : 1</text><rect x='200' y='130' width='190' height='100' fill='#FFE3EC' stroke='#FF5D8F'/><text x='208' y='146' font-weight='bold'>MARGINS (÷ revenue × 100)</text><text x='208' y='162'>Gross = gross profit</text><text x='208' y='177'>Operating = operating profit</text><text x='208' y='192'>Net = profit for the year</text><text x='208' y='210'>Fall = costs up or prices down</text><text x='200' y='250' text-anchor='middle'>e.g. GP £280k ÷ revenue £800k × 100 = 35%</text></svg>
