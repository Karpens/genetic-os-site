<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Causes of strategic change</text><rect x='92' y='24' width='148' height='22' fill='#E6F7EE' stroke='#0E9F5D'/><text x='166' y='39' text-anchor='middle' font-weight='bold'>Planned</text><rect x='246' y='24' width='148' height='22' fill='#FDF1DB' stroke='#E8A93A'/><text x='320' y='39' text-anchor='middle' font-weight='bold'>Unplanned</text><rect x='6' y='52' width='80' height='92' fill='#E3F4FF' stroke='#2FB5FF'/><text x='46' y='102' text-anchor='middle' font-weight='bold'>Internal</text><rect x='6' y='150' width='80' height='92' fill='#FFE6EE' stroke='#FF5D8F'/><text x='46' y='200' text-anchor='middle' font-weight='bold'>External</text><rect x='92' y='52' width='148' height='92' fill='#fff' stroke='#1D1A15'/><text x='98' y='74'>• New product launch</text><text x='98' y='92'>• Planned restructuring</text><text x='98' y='110'>• CEO retirement</text><text x='98' y='128'>• New objectives set</text><rect x='246' y='52' width='148' height='92' fill='#fff' stroke='#1D1A15'/><text x='252' y='74'>• Falling staff morale</text><text x='252' y='92'>• Key manager resigns</text><text x='252' y='110'>• Machine breakdown</text><text x='252' y='128'>• Fraud discovered</text><rect x='92' y='150' width='148' height='92' fill='#fff' stroke='#1D1A15'/><text x='98' y='172'>• Preparing for new law</text><text x='98' y='190'>• Acting on trend data</text><text x='98' y='208'>• Scenario planning</text><text x='98' y='226'>• Entering new market</text><rect x='246' y='150' width='148' height='92' fill='#fff' stroke='#1D1A15'/><text x='252' y='172'>• Pandemic lockdown</text><text x='252' y='190'>• Sudden recession</text><text x='252' y='208'>• Rival disrupts market</text><text x='252' y='226'>• Supplier collapses</text><text x='200' y='256' text-anchor='middle' font-size='10'>Unplanned = reactive, less time to prepare</text></svg>
