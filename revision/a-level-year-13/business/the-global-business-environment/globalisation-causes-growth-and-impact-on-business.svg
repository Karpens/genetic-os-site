ext><line x1='250' y1='140' x2='257' y2='140' stroke='#1D1A15'/><line x1='257' y1='58' x2='257' y2='220' stroke='#1D1A15'/><line x1='257' y1='58' x2='264' y2='58' stroke='#1D1A15' marker-end='url(#a)'/><line x1='257' y1='112' x2='264' y2='112' stroke='#1D1A15' marker-end='url(#a)'/><line x1='257' y1='166' x2='264' y2='166' stroke='#1D1A15' marker-end='url(#a)'/><line x1='257' y1='220' x2='264' y2='220' stroke='#1D1A15' marker-end='url(#a)'/><rect x='264' y='36' width='130' height='44' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='329' y='55' text-anchor='middle'>New markets and</text><text x='329' y='69' text-anchor='middle'>economies of scale</text><rect x='264' y='90' width='130' height='44' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='329' y='109' text-anchor='middle'>Lower costs:</text><text x='329' y='123' text-anchor='middle'>offshoring, sourcing</text><rect x='264' y='144' width='130' height='44' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='329' y='163' text-anchor='middle'>More competition</text><text x='329' y='177' text-anchor='middle'>and exchange-rate risk</text><rect x='264' y='198' width='130' height='44' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='329' y='217' text-anchor='middle'>Ethical and supply</text><text x='329' y='231' text-anchor='middle'>chain risks</text></svg>
