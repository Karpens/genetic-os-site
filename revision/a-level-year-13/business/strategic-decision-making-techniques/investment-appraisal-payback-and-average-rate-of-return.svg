<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Payback: cumulative cash flow (£000)</text><text x='60' y='38'>Outlay £100k; inflows £30k, £40k, £50k, £50k</text><text x='60' y='54'>Payback = 2 + 30 ÷ 50 = 2.6 years</text><line x1='50' y1='150' x2='385' y2='150' stroke='#1D1A15'/><line x1='50' y1='30' x2='50' y2='240' stroke='#1D1A15'/><line x1='232' y1='150' x2='232' y2='240' stroke='#FF5D8F' stroke-dasharray='4 3'/><polyline points='50,230 120,206 190,174 260,134 330,94' fill='none' stroke='#0E9F5D' stroke-width='2.5'/><circle cx='50' cy='230' r='4' fill='#0E9F5D'/><circle cx='120' cy='206' r='4' fill='#0E9F5D'/><circle cx='190' cy='174' r='4' fill='#0E9F5D'/><circle cx='260' cy='134' r='4' fill='#0E9F5D'/><circle cx='330' cy='94' r='4' fill='#0E9F5D'/><circle cx='232' cy='150' r='5' fill='#E8A93A' stroke='#1D1A15'/><text x='38' y='154' text-anchor='end'>0</text><text x='56' y='244'>−100</text><text x='126' y='222'>−70</text><text x='196' y='190'>−30</text><text x='236' y='124'>+20</text><text x='336' y='90'>+70</text><text x='238' y='190' font-weight='bold'>Payback ≈ 2.6 years</text><text x='238' y='205'>(about 2 yrs 7 months)</text><text x='50' y='254' text-anchor='middle'>Yr 0</text><text x='120' y='254' text-anchor='middle'>Yr 1</text><text x='190' y='254' text-anchor='middle'>Yr 2</text><text x='260' y='254' text-anchor='middle'>Yr 3</text><text x='330' y='254' text-anchor='middle'>Yr 4</text></g></svg>
