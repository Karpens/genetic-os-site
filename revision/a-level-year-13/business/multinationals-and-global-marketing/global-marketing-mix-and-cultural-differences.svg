<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Standardise or adapt the marketing mix?</text><text x='20' y='38' font-weight='bold'>STANDARDISED</text><text x='380' y='38' text-anchor='end' font-weight='bold'>ADAPTED</text><line x1='22' y1='48' x2='378' y2='48' stroke='#1D1A15' stroke-width='1.5'/><polygon points='20,48 28,44 28,52' fill='#1D1A15'/><polygon points='380,48 372,44 372,52' fill='#1D1A15'/><rect x='20' y='60' width='148' height='34' rx='5' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='172' y='60' width='56' height='34' rx='5' fill='#EEE8FF' stroke='#7C5CFF'/><rect x='232' y='60' width='148' height='34' rx='5' fill='#FFF3DC' stroke='#E8A93A'/><text x='94' y='81' text-anchor='middle'>Same core design/brand</text><text x='200' y='81' text-anchor='middle' font-weight='bold'>Product</text><text x='306' y='81' text-anchor='middle'>Local menus and sizes</text><rect x='20' y='102' width='148' height='34' rx='5' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='172' y='102' width='56' height='34' rx='5' fill='#EEE8FF' stroke='#7C5CFF'/><rect x='232' y='102' width='148' height='34' rx='5' fill='#FFF3DC' stroke='#E8A93A'/><text x='94' y='123' text-anchor='middle'>One global price level</text><text x='200' y='123' text-anchor='middle' font-weight='bold'>Price</text><text x='306' y='123' text-anchor='middle'>Set to local incomes</text><rect x='20' y='144' width='148' height='34' rx='5' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='172' y='144' width='56' height='34' rx='5' fill='#EEE8FF' stroke='#7C5CFF'/><rect x='232' y='144' width='148' height='34' rx='5' fill='#FFF3DC' stroke='#E8A93A'/><text x='94' y='165' text-anchor='middle'>One global campaign</text><text x='200' y='165' text-anchor='middle' font-weight='bold' font-size='10'>Promotion</text><text x='306' y='165' text-anchor='middle'>Local language, values</text><rect x='20' y='186' width='148' height='34' rx='5' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='172' y='186' width='56' height='34' rx='5' fill='#EEE8FF' stroke='#7C5CFF'/><rect x='232' y='186' width='148' height='34' rx='5' fill='#FFF3DC' stroke='#E8A93A'/><text x='94' y='207' text-anchor='middle'>Same online channels</text><text x='200' y='207' text-anchor='middle' font-weight='bold'>Place</text><text x='306' y='207' text-anchor='middle'>Local retailers, agents</text><text x='200' y='240' text-anchor='middle'>Standardise = lower unit costs, consistent brand image</text><text x='200' y='254' text-anchor='middle'>Adapt = better cultural fit, higher costs (Hofstede)</text></svg>
