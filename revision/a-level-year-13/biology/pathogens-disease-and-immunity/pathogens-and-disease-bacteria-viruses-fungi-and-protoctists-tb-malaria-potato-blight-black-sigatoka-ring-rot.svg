<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Pathogen groups and examples</text><rect x='6' y='26' width='190' height='110' rx='8' fill='#E3F6EC' stroke='#0E9F5D'/><text x='14' y='44' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Bacteria (prokaryotes)</text><text x='14' y='64' font-family='sans-serif' font-size='11' fill='#1D1A15'>TB: Mycobacterium</text><text x='14' y='78' font-family='sans-serif' font-size='11' fill='#1D1A15'>tuberculosis</text><text x='14' y='98' font-family='sans-serif' font-size='11' fill='#1D1A15'>Ring rot (potato):</text><text x='14' y='112' font-family='sans-serif' font-size='11' fill='#1D1A15'>Clavibacter michiganensis</text><text x='14' y='128' font-family='sans-serif' font-size='11' fill='#1D1A15'>Antibiotics effective</text><rect x='204' y='26' width='190' height='110' rx='8' fill='#FFE6EF' stroke='#FF5D8F'/><text x='212' y='44' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Viruses (non-cellular)</text><text x='212' y='64' font-family='sans-serif' font-size='11' fill='#1D1A15'>Nucleic acid + protein coat</text><text x='212' y='78' font-family='sans-serif' font-size='11' fill='#1D1A15'>Replicate only inside</text><text x='212' y='92' font-family='sans-serif' font-size='11' fill='#1D1A15'>host cells</text><text x='212' y='112' font-family='sans-serif' font-size='11' fill='#1D1A15'>e.g. HIV, TMV</text><text x='212' y='128' font-family='sans-serif' font-size='11' fill='#1D1A15'>Antibiotics ineffective</text><rect x='6' y='146' width='190' height='108' rx='8' fill='#FFF3DC' stroke='#E8A93A'/><text x='14' y='164' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Fungi (eukaryotes)</text><text x='14' y='184' font-family='sans-serif' font-size='11' fill='#1D1A15'>Black Sigatoka (banana):</text><text x='14' y='198' font-family='sans-serif' font-size='11' fill='#1D1A15'>Mycosphaerella fijiensis</text><text x='14' y='218' font-family='sans-serif' font-size='11' fill='#1D1A15'>Hyphae, spores, chitin walls</text><text x='14' y='234' font-family='sans-serif' font-size='11' fill='#1D1A15'>Fungicides used</text><rect x='204' y='146' width='190' height='108' rx='8' fill='#E0F4FF' stroke='#2FB5FF'/><text x='212' y='164' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Protoctists (eukaryotes)</text><text x='212' y='184' font-family='sans-serif' font-size='11' fill='#1D1A15'>Malaria: Plasmodium</text><text x='212' y='198' font-family='sans-serif' font-size='11' fill='#1D1A15'>(vector: Anopheles)</text><text x='212' y='214' font-family='sans-serif' font-size='11' fill='#1D1A15'>Potato blight:</text><text x='212' y='228' font-family='sans-serif' font-size='11' fill='#1D1A15'>Phytophthora infestans</text><text x='212' y='244' font-family='sans-serif' font-size='11' fill='#1D1A15'>Spores spread by wind, rain</text></svg>
