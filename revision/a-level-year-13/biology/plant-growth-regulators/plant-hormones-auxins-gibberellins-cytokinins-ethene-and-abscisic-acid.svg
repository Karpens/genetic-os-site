<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Auxin and cell elongation (acid growth)</text><rect x='15' y='40' width='170' height='170' fill='#E3F5EC' stroke='#0E9F5D' stroke-width='2'/><rect x='40' y='65' width='120' height='120' fill='#fff' stroke='#7C5CFF' stroke-width='2'/><text x='100' y='57' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Cell wall</text><text x='120' y='84' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Cytoplasm</text><circle cx='68' cy='100' r='13' fill='#FFE0EB' stroke='#FF5D8F'/><text x='68' y='104' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>IAA</text><ellipse cx='108' cy='145' rx='36' ry='30' fill='#E6F6FF' stroke='#2FB5FF'/><text x='108' y='149' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Vacuole</text><circle cx='40' cy='130' r='7' fill='#FFE9B8' stroke='#E8A93A'/><line x1='33' y1='130' x2='26' y2='130' stroke='#E8A93A' stroke-width='2'/><polygon points='22,130 28,126 28,134' fill='#E8A93A'/><text x='27' y='122' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>H⁺</text><text x='100' y='232' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Wall loosens, cell elongates</text><rect x='208' y='35' width='184' height='36' fill='#FFF6E0' stroke='#E8A93A'/><text x='215' y='50' font-family='sans-serif' font-size='11' fill='#1D1A15'>1 IAA binds to receptor;</text><text x='215' y='64' font-family='sans-serif' font-size='11' fill='#1D1A15'>stimulates H⁺ pumps</text><rect x='208' y='78' width='184' height='36' fill='#FFF6E0' stroke='#E8A93A'/><text x='215' y='93' font-family='sans-serif' font-size='11' fill='#1D1A15'>2 H⁺ pumped into cell wall</text><text x='215' y='107' font-family='sans-serif' font-size='11' fill='#1D1A15'>(active transport, ATP)</text><rect x='208' y='121' width='184' height='36' fill='#FFF6E0' stroke='#E8A93A'/><text x='215' y='136' font-family='sans-serif' font-size='11' fill='#1D1A15'>3 Wall pH falls (about 5);</text><text x='215' y='150' font-family='sans-serif' font-size='11' fill='#1D1A15'>expansins activated</text><rect x='208' y='164' width='184' height='36' fill='#FFF6E0' stroke='#E8A93A'/><text x='215' y='179' font-family='sans-serif' font-size='11' fill='#1D1A15'>4 Cellulose cross-links loosen;</text><text x='215' y='193' font-family='sans-serif' font-size='11' fill='#1D1A15'>wall more extensible</text><rect x='208' y='207' width='184' height='36' fill='#FFF6E0' stroke='#E8A93A'/><text x='215' y='222' font-family='sans-serif' font-size='11' fill='#1D1A15'>5 Water enters by osmosis;</text><text x='215' y='236' font-family='sans-serif' font-size='11' fill='#1D1A15'>cell elongates (turgor)</text></svg>
