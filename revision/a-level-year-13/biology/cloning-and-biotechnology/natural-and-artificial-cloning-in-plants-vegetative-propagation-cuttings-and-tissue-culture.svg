<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0L8 4L0 8z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='16' font-size='13' font-weight='bold'>Micropropagation by tissue culture</text><rect x='10' y='30' width='110' height='60' rx='5' fill='#E7F7EF' stroke='#0E9F5D'/><text x='65' y='48'>1. Take explant</text><text x='65' y='63'>(meristem / shoot</text><text x='65' y='78'>tip), sterilise</text><rect x='145' y='30' width='110' height='60' rx='5' fill='#FFF4DD' stroke='#E8A93A'/><text x='200' y='48'>2. Sterile agar</text><text x='200' y='63'>+ nutrients and</text><text x='200' y='78'>plant hormones</text><rect x='280' y='30' width='110' height='60' rx='5' fill='#E3F5FF' stroke='#2FB5FF'/><text x='335' y='48'>3. Cells divide:</text><text x='335' y='63'>callus forms</text><text x='335' y='78'>(undifferentiated)</text><rect x='280' y='150' width='110' height='60' rx='5' fill='#FFE6EE' stroke='#FF5D8F'/><text x='335' y='168'>4. Change hormone</text><text x='335' y='183'>ratio: shoots and</text><text x='335' y='198'>roots develop</text><rect x='145' y='150' width='110' height='60' rx='5' fill='#EEE9FF' stroke='#7C5CFF'/><text x='200' y='168'>5. Plantlets</text><text x='200' y='183'>transferred to</text><text x='200' y='198'>compost</text><rect x='10' y='150' width='110' height='60' rx='5' fill='#E7F7EF' stroke='#0E9F5D'/><text x='65' y='168'>6. Harden off:</text><text x='65' y='183'>genetically</text><text x='65' y='198'>identical clones</text><text x='200' y='238'>Aseptic technique throughout prevents contamination</text></g><g stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'><line x1='120' y1='60' x2='143' y2='60'/><line x1='255' y1='60' x2='278' y2='60'/><line x1='335' y1='90' x2='335' y2='148'/><line x1='280' y1='180' x2='257' y2='180'/><line x1='145' y1='180' x2='122' y2='180'/></g></svg>
