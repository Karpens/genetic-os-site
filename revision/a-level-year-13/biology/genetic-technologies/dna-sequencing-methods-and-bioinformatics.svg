<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='14' text-anchor='middle' font-size='13' font-weight='bold'>Sanger chain-termination sequencing</text><rect x='10' y='22' width='380' height='36' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='200' y='37' text-anchor='middle'>1. Template + primer + DNA polymerase + dNTPs</text><text x='200' y='51' text-anchor='middle'>+ four ddNTPs, each with a different fluorescent dye</text><path d='M200 58V66' stroke='#1D1A15'/><polygon points='196,65 204,65 200,71' fill='#1D1A15'/><rect x='10' y='71' width='380' height='32' rx='6' fill='#FFF4DC' stroke='#E8A93A'/><text x='200' y='85' text-anchor='middle'>2. Strand grows 5′→3′ until a ddNTP is added (no 3′-OH):</text><text x='200' y='98' text-anchor='middle'>chain terminates, giving fragments of every length</text><text x='10' y='116' font-weight='bold'>3. Fragments (shortest at top)</text><g stroke='#1D1A15' stroke-width='2'><path d='M20 128H48M20 140H76M20 152H104M20 164H132M20 176H160M20 188H188'/></g><circle cx='48' cy='128' r='4' fill='#0E9F5D'/><circle cx='76' cy='140' r='4' fill='#E8A93A'/><circle cx='104' cy='152' r='4' fill='#2FB5FF'/><circle cx='132' cy='164' r='4' fill='#FF5D8F'/><circle cx='160' cy='176' r='4' fill='#FF5D8F'/><circle cx='188' cy='188' r='4' fill='#E8A93A'/><text x='58' y='132'>A</text><text x='86' y='144'>T</text><text x='114' y='156'>G</text><text x='142' y='168'>C</text><text x='170' y='180'>C</text><text x='198' y='192'>T</text><rect x='222' y='110' width='170' height='90' rx='6' fill='#EFE9FF' stroke='#7C5CFF'/><text x='307' y='126' text-anchor='middle' font-weight='bold'>4. Capillary gel</text><text x='307' y='140' text-anchor='middle'>separates fragments by</text><text x='307' y='154' text-anchor='middle'>length: shortest passes</text><text x='307' y='168' text-anchor='middle'>the laser first; its</text><text x='307' y='182' text-anchor='middle'>colour gives the last base</text><rect x='10' y='208' width='380' height='46' rx='6' fill='#fff' stroke='#1D1A15'/><text x='200' y='222' text-anchor='middle'>5. New strand read 5′→3′ (template 3′-TACGGA-5′):</text><circle cx='150' cy='239' r='8' fill='#0E9F5D'/><circle cx='176' cy='239' r='8' fill='#E8A93A'/><circle cx='202' cy='239' r='8' fill='#2FB5FF'/><circle cx='228' cy='239' r='8' fill='#FF5D8F'/><circle cx='254' cy='239' r='8' fill='#FF5D8F'/><circle cx='280' cy='239' r='8' fill='#E8A93A'/><text x='150' y='243' text-anchor='middle'>A</text><text x='176' y='243' text-anchor='middle'>T</text><text x='202' y='243' text-anchor='middle'>G</text><text x='228' y='243' text-anchor='middle'>C</text><text x='254' y='243' text-anchor='middle'>C</text><text x='280' y='243' text-anchor='middle'>T</text></svg>
