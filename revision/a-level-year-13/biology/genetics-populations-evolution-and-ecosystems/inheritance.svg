<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='14' text-anchor='middle' font-size='13' font-weight='bold'>Inheritance: Punnett squares</text><text x='90' y='32' text-anchor='middle' font-size='11'>Codominance: RW × RW</text><text x='302' y='32' text-anchor='middle' font-size='11'>Sex-linked: XᴴXʰ × XᴴY</text><text x='62' y='53' text-anchor='middle' font-weight='bold'>R</text><text x='118' y='53' text-anchor='middle' font-weight='bold'>W</text><text x='22' y='84' text-anchor='middle' font-weight='bold'>R</text><text x='22' y='128' text-anchor='middle' font-weight='bold'>W</text><rect x='34' y='58' width='56' height='44' rx='3' fill='#FF5D8F' fill-opacity='.4' stroke='#1D1A15' stroke-width='2'/><rect x='90' y='58' width='56' height='44' rx='3' fill='#FF5D8F' fill-opacity='.15' stroke='#1D1A15' stroke-width='2'/><rect x='34' y='102' width='56' height='44' rx='3' fill='#FF5D8F' fill-opacity='.15' stroke='#1D1A15' stroke-width='2'/><rect x='90' y='102' width='56' height='44' rx='3' fill='#fff' stroke='#1D1A15' stroke-width='2'/><g text-anchor='middle'><text x='62' y='78'>RR</text><text x='62' y='93' font-size='11'>red</text><text x='118' y='78'>RW</text><text x='118' y='93' font-size='11'>roan</text><text x='62' y='122'>RW</text><text x='62' y='137' font-size='11'>roan</text><text x='118' y='122'>WW</text><text x='118' y='137' font-size='11'>white</text></g><text x='271' y='53' text-anchor='middle' font-weight='bold'>Xᴴ</text><text x='333' y='53' text-anchor='middle' font-weight='bold'>Xʰ</text><text x='228' y='84' text-anchor='middle' font-weight='bold'>Xᴴ</text><text x='228' y='128' text-anchor='middle' font-weight='bold'>Y</text><rect x='240' y='58' width='62' height='44' rx='3' fill='#0E9F5D' fill-opacity='.2' stroke='#1D1A15' stroke-width='2'/><rect x='302' y='58' width='62' height='44' rx='3' fill='#E8A93A' fill-opacity='.3' stroke='#1D1A15' stroke-width='2'/><rect x='240' y='102' width='62' height='44' rx='3' fill='#0E9F5D' fill-opacity='.2' stroke='#1D1A15' stroke-width='2'/><rect x='302' y='102' width='62' height='44' rx='3' fill='#FF5D8F' fill-opacity='.4' stroke='#1D1A15' stroke-width='2'/><g text-anchor='middle'><text x='271' y='78'>XᴴXᴴ</text><text x='271' y='93' font-size='11'>normal ♀</text><text x='333' y='78'>XᴴXʰ</text><text x='333' y='93' font-size='11'>carrier ♀</text><text x='271' y='122'>XᴴY</text><text x='271' y='137' font-size='11'>normal ♂</text><text x='333' y='122'>XʰY</text><text x='333' y='137' font-size='11'>affected ♂</text></g><g text-anchor='middle' font-size='11'><text x='90' y='162'>1 red : 2 roan : 1 white</text><text x='302' y='162'>Half the sons are affected</text></g><path d='M10 171H390' stroke='#7C5CFF' stroke-width='2' fill='none'/><g font-size='11'><text x='12' y='188'>Monohybrid Rr × Rr → 3 dominant : 1 recessive</text><text x='12' y='204'>Dihybrid RrYy × RrYy (unlinked genes) → 9 : 3 : 3 : 1</text><text x='12' y='220'>Linked genes stay together; crossing over → few recombinants</text><text x='12' y='236'>Epistasis: one gene affects another → 9:3:4 or 12:3:1</text><text x='12' y='252'>Chi-squared test: degrees of freedom = categories − 1</text></g></svg>
