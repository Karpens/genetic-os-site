<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='16' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Types of migration: examples</text><text x='170' y='36' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Voluntary</text><text x='322' y='36' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Forced</text><rect x='95' y='44' width='150' height='100' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='250' y='44' width='145' height='100' fill='#FFE9F0' stroke='#FF5D8F'/><rect x='95' y='150' width='150' height='100' fill='#E3F5FF' stroke='#2FB5FF'/><rect x='250' y='150' width='145' height='100' fill='#EFEAFF' stroke='#7C5CFF'/><g font-family='sans-serif' fill='#1D1A15'><text x='8' y='88' font-size='12' font-weight='bold'>Internal</text><text x='8' y='103' font-size='11'>(within a</text><text x='8' y='117' font-size='11'>country)</text><text x='8' y='194' font-size='12' font-weight='bold'>International</text><text x='8' y='209' font-size='11'>(across</text><text x='8' y='223' font-size='11'>borders)</text><g font-size='11'><text x='102' y='64'>Rural-urban job moves,</text><text x='102' y='80'>e.g. China's migrant</text><text x='102' y='96'>workers to Guangdong,</text><text x='102' y='112'>driven by wage gaps</text><text x='257' y='64'>Internally displaced</text><text x='257' y='80'>people (IDPs): fleeing</text><text x='257' y='96'>conflict or floods but</text><text x='257' y='112'>staying in the country,</text><text x='257' y='128'>e.g. Sudan, DR Congo</text><text x='102' y='170'>Economic, student or</text><text x='102' y='186'>family moves, e.g.</text><text x='102' y='202'>India to UAE, Mexico</text><text x='102' y='218'>to USA; skilled and</text><text x='102' y='234'>low-skilled workers</text><text x='257' y='170'>Refugees and asylum</text><text x='257' y='186'>seekers crossing a</text><text x='257' y='202'>border, e.g. Syrians in</text><text x='257' y='218'>Türkiye, Ukrainians</text><text x='257' y='234'>in Poland</text></g></g></svg>
