<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Levels of trading bloc integration</text><rect x='10' y='26' width='380' height='40' rx='5' fill='#E6F7EF' stroke='#0E9F5D'/><text x='20' y='43' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>1 Preferential trade area</text><text x='20' y='58' font-family='sans-serif' font-size='11' fill='#1D1A15'>Reduced tariffs on some goods between members</text><rect x='10' y='72' width='380' height='40' rx='5' fill='#FFF3DC' stroke='#E8A93A'/><text x='20' y='89' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>2 Free trade area</text><text x='20' y='104' font-family='sans-serif' font-size='11' fill='#1D1A15'>No internal tariffs, own external tariffs: USMCA, AfCFTA</text><rect x='10' y='118' width='380' height='40' rx='5' fill='#E3F5FF' stroke='#2FB5FF'/><text x='20' y='135' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>3 Customs union</text><text x='20' y='150' font-family='sans-serif' font-size='11' fill='#1D1A15'>+ common external tariff: Mercosur, EU Customs Union</text><rect x='10' y='164' width='380' height='40' rx='5' fill='#FFE6EF' stroke='#FF5D8F'/><text x='20' y='181' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>4 Single market</text><text x='20' y='196' font-family='sans-serif' font-size='11' fill='#1D1A15'>+ free movement of goods, services, capital, labour: EU</text><rect x='10' y='210' width='380' height='40' rx='5' fill='#ECE6FF' stroke='#7C5CFF'/><text x='20' y='227' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>5 Economic and monetary union</text><text x='20' y='242' font-family='sans-serif' font-size='11' fill='#1D1A15'>+ common currency and shared policies: eurozone</text></svg>
