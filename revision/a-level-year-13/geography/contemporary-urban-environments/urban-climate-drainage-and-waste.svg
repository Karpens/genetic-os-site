<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif" font-size="11" fill="#1D1A15"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1D1A15"/></marker></defs><text x="10" y="16" font-size="12" font-weight="bold">Urban heat island (temperature profile)</text><path d="M40 35V115H390" fill="none" stroke="#1D1A15" stroke-width="2"/><text x="6" y="75">Temp</text><line x1="40" y1="95" x2="390" y2="95" stroke="#2FB5FF" stroke-width="2" stroke-dasharray="6 4"/><path d="M40 95L100 92C120 90 130 70 150 62L180 60C200 55 210 48 225 46C240 48 250 56 270 60L300 62C320 68 330 88 350 92L385 95" fill="none" stroke="#FF5D8F" stroke-width="3"/><line x1="225" y1="93" x2="225" y2="52" stroke="#1D1A15" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="234" y="84">UHI</text><text x="390" y="42" text-anchor="end">up to 5°C warmer</text><text x="65" y="129" text-anchor="middle">Rural</text><text x="150" y="129" text-anchor="middle">Suburban</text><text x="225" y="129" text-anchor="middle">CBD</text><text x="300" y="129" text-anchor="middle">Suburban</text><text x="360" y="129" text-anchor="middle">Rural</text><text x="10" y="147">Causes: dark surfaces, waste heat, less evaporation</text><text x="10" y="168" font-size="12" font-weight="bold">Hydrograph: urban vs rural run-off</text><path d="M40 180V262H390" fill="none" stroke="#1D1A15" stroke-width="2"/><text x="46" y="192">Discharge</text><path d="M40 259L100 259C150 258 190 230 225 218C255 210 300 245 345 258L385 259" fill="none" stroke="#0E9F5D" stroke-width="3"/><path d="M40 259L85 259C105 250 120 205 140 198C165 205 180 240 225 258L260 259" fill="none" stroke="#FF5D8F" stroke-width="3"/><line x1="140" y1="200" x2="140" y2="262" stroke="#1D1A15" stroke-width="2" stroke-dasharray="3 3" opacity=".4"/><line x1="222" y1="219" x2="222" y2="262" stroke="#1D1A15" stroke-width="2" stroke-dasharray="3 3" opacity=".4"/><line x1="142" y1="272" x2="220" y2="272" stroke="#1D1A15" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/><text x="181" y="290" text-anchor="middle">lag time</text><text x="390" y="277" text-anchor="end">Time</text><line x1="270" y1="184" x2="284" y2="184" stroke="#FF5D8F" stroke-width="3"/><text x="290" y="188">Urban: impermeable</text><line x1="270" y1="200" x2="284" y2="200" stroke="#0E9F5D" stroke-width="3"/><text x="290" y="204">Rural: infiltration</text><text x="240" y="290">SUDS lower and delay the peak</text></svg>
