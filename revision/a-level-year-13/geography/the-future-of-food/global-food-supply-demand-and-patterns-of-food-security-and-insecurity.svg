<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" font-family="sans-serif" font-size="12" fill="#1D1A15"><rect width="400" height="260" fill="#fff"/><text x="200" y="20" text-anchor="middle" font-size="14" font-weight="bold">Four pillars of food security (FAO)</text><rect x="15" y="32" width="180" height="80" rx="6" fill="#E3F5EC" stroke="#0E9F5D"/><text x="25" y="54" font-weight="bold">1 Availability</text><text x="25" y="74">Production, stocks, imports:</text><text x="25" y="92">enough food is physically there</text><rect x="205" y="32" width="180" height="80" rx="6" fill="#E6F6FF" stroke="#2FB5FF"/><text x="215" y="54" font-weight="bold">2 Access</text><text x="215" y="74">Income, prices, markets,</text><text x="215" y="92">transport and entitlement</text><rect x="15" y="122" width="180" height="80" rx="6" fill="#EEE9FF" stroke="#7C5CFF"/><text x="25" y="144" font-weight="bold">3 Utilisation</text><text x="25" y="164">Nutritious, safe food, clean</text><text x="25" y="182">water, sanitation and health</text><rect x="205" y="122" width="180" height="80" rx="6" fill="#FFE9F1" stroke="#FF5D8F"/><text x="215" y="144" font-weight="bold">4 Stability</text><text x="215" y="164">Secure at all times: shocks,</text><text x="215" y="182">conflict and price spikes</text><rect x="15" y="212" width="370" height="38" rx="6" fill="#FFF4DD" stroke="#E8A93A"/><text x="200" y="228" text-anchor="middle" font-weight="bold">Insecurity if ANY pillar fails</text><text x="200" y="243" text-anchor="middle" font-size="11">e.g. food exists (availability) but is unaffordable (access)</text></svg>
