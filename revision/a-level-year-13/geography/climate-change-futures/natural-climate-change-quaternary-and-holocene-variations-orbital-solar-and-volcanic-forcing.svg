<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='20' font-size='14' font-weight='bold'>Milankovitch cycles</text><rect x='10' y='32' width='120' height='138' rx='6' fill='#F4FAFF' stroke='#2FB5FF'/><rect x='140' y='32' width='120' height='138' rx='6' fill='#F4FFF8' stroke='#0E9F5D'/><rect x='270' y='32' width='120' height='138' rx='6' fill='#F7F4FF' stroke='#7C5CFF'/><text x='70' y='50' font-size='12' font-weight='bold'>Eccentricity</text><ellipse cx='70' cy='97' rx='48' ry='32' fill='none' stroke='#2FB5FF' stroke-width='2'/><circle cx='84' cy='97' r='7' fill='#E8A93A'/><text x='70' y='148'>Orbit shape</text><text x='70' y='163'>~100,000 yr</text><text x='200' y='50' font-size='12' font-weight='bold'>Obliquity</text><circle cx='200' cy='97' r='24' fill='#DDF3E6' stroke='#0E9F5D' stroke-width='2'/><line x1='200' y1='62' x2='200' y2='132' stroke='#1D1A15' stroke-dasharray='3 3' opacity='0.5'/><line x1='186' y1='128' x2='214' y2='66' stroke='#FF5D8F' stroke-width='2.5'/><text x='200' y='148'>Tilt 22.1–24.5°</text><text x='200' y='163'>~41,000 yr</text><text x='330' y='50' font-size='12' font-weight='bold'>Precession</text><circle cx='330' cy='99' r='24' fill='#DDF3E6' stroke='#0E9F5D' stroke-width='2'/><line x1='318' y1='128' x2='342' y2='70' stroke='#FF5D8F' stroke-width='2.5'/><ellipse cx='330' cy='68' rx='16' ry='5' fill='none' stroke='#7C5CFF' stroke-dasharray='3 2'/><text x='330' y='148'>Axis wobble</text><text x='330' y='163'>~23,000 yr</text><rect x='10' y='182' width='380' height='68' rx='6' fill='#FFF6E3' stroke='#E8A93A'/><text x='200' y='201'>Small changes in summer insolation at 65°N</text><text x='200' y='220'>→ ice sheets grow or melt → albedo and CO₂ feedbacks amplify</text><text x='200' y='239'>LGM ~21,000 yr ago; Holocene began ~11,700 yr ago</text></g></svg>
