<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='22' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Thermohaline circulation (simplified)</text><rect x='20' y='60' width='360' height='172' fill='#E6F6FF' stroke='#2FB5FF'/><text x='20' y='52' font-family='sans-serif' font-size='12' fill='#1D1A15'>Tropics</text><text x='380' y='52' text-anchor='end' font-family='sans-serif' font-size='12' fill='#1D1A15'>North Atlantic / polar</text><line x1='50' y1='90' x2='338' y2='90' stroke='#FF5D8F' stroke-width='4'/><polygon points='336,83 348,90 336,97' fill='#FF5D8F'/><text x='195' y='80' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Warm, salty surface flow</text><text x='200' y='114' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Heat lost to atmosphere; ice forms</text><line x1='355' y1='96' x2='355' y2='190' stroke='#7C5CFF' stroke-width='4'/><polygon points='349,188 361,188 355,200' fill='#7C5CFF'/><text x='345' y='140' text-anchor='end' font-family='sans-serif' font-size='12' fill='#1D1A15'>Cold, dense water sinks</text><text x='200' y='165' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Evaporation and brine raise salinity</text><line x1='355' y1='200' x2='62' y2='200' stroke='#2FB5FF' stroke-width='4'/><polygon points='62,193 50,200 62,207' fill='#2FB5FF'/><line x1='38' y1='200' x2='38' y2='104' stroke='#0E9F5D' stroke-width='4'/><polygon points='31,106 38,94 45,106' fill='#0E9F5D'/><text x='48' y='135' font-family='sans-serif' font-size='12' fill='#1D1A15'>Slow upwelling</text><text x='200' y='220' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Cold deep return flow (about 1,000 years)</text><text x='200' y='250' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>Driven by density differences: temperature + salinity</text></svg>
