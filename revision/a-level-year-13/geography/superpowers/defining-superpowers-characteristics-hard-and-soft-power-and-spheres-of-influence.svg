<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='20' text-anchor='middle' font-size='14' font-weight='bold'>Spectrum of power</text><text x='10' y='46'>Coercion</text><text x='390' y='46' text-anchor='end'>Attraction</text><line x1='72' y1='42' x2='318' y2='42' stroke='#1D1A15' stroke-width='1.5'/><polygon points='72,42 82,38 82,46' fill='#1D1A15'/><polygon points='318,42 308,38 308,46' fill='#1D1A15'/><rect x='10' y='58' width='180' height='125' rx='6' fill='#FFE6EE' stroke='#FF5D8F' stroke-width='1.5'/><text x='100' y='78' text-anchor='middle' font-weight='bold'>Hard power</text><text x='22' y='102'>Military force and bases</text><text x='22' y='122'>Economic sanctions</text><text x='22' y='142'>Tariffs and trade wars</text><text x='22' y='162'>Conditional loans</text><rect x='210' y='58' width='180' height='125' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='1.5'/><text x='300' y='78' text-anchor='middle' font-weight='bold'>Soft power (Nye)</text><text x='222' y='102'>Culture: film, music</text><text x='222' y='122'>Values and ideas</text><text x='222' y='142'>Universities, language</text><text x='222' y='162'>Diplomacy, media, aid</text><rect x='10' y='198' width='380' height='50' rx='6' fill='#E9F8F0' stroke='#0E9F5D' stroke-width='1.5'/><text x='200' y='218' text-anchor='middle'>Smart power = hard + soft power combined</text><text x='200' y='237' text-anchor='middle'>Sphere of influence = region a power dominates</text></g></svg>
