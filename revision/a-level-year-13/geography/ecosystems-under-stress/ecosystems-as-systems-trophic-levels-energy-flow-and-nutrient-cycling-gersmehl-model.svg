<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0 0L8 4L0 8z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Gersmehl nutrient cycle</text><circle cx='70' cy='120' r='38' fill='#0E9F5D' fill-opacity='.25' stroke='#0E9F5D' stroke-width='2'/><text x='70' y='124' text-anchor='middle'>Biomass</text><circle cx='200' cy='120' r='28' fill='#E8A93A' fill-opacity='.3' stroke='#E8A93A' stroke-width='2'/><text x='200' y='124' text-anchor='middle'>Litter</text><circle cx='330' cy='120' r='34' fill='#7C5CFF' fill-opacity='.2' stroke='#7C5CFF' stroke-width='2'/><text x='330' y='124' text-anchor='middle'>Soil</text><line x1='110' y1='115' x2='170' y2='115' stroke='#1D1A15' stroke-width='3' marker-end='url(#a)'/><text x='140' y='103' text-anchor='middle' font-size='11'>litterfall</text><line x1='230' y1='115' x2='294' y2='115' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><text x='262' y='103' text-anchor='middle' font-size='11'>decay</text><path d='M330 154 Q200 230 70 158' fill='none' stroke='#1D1A15' stroke-width='3' marker-end='url(#a)'/><text x='200' y='218' text-anchor='middle' font-size='11'>uptake by roots</text><line x1='330' y1='30' x2='330' y2='83' stroke='#2FB5FF' stroke-width='3' marker-end='url(#a)'/><text x='322' y='58' text-anchor='end' font-size='11'>Input: weathering, rain</text><line x1='356' y1='146' x2='384' y2='176' stroke='#FF5D8F' stroke-width='3' marker-end='url(#a)'/><text x='396' y='194' text-anchor='end' font-size='11'>Loss: leaching,</text><text x='396' y='208' text-anchor='end' font-size='11'>runoff</text><text x='200' y='240' text-anchor='middle' font-size='11'>Circle size = store size; arrow width = flow size</text><text x='200' y='254' text-anchor='middle' font-size='11'>T