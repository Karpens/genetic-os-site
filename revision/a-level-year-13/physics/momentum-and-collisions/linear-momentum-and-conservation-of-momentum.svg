<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='20' y='22' font-weight='bold'>BEFORE</text><line x1='40' y1='48' x2='105' y2='48' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='62' y='40'>u₁</text><rect x='40' y='55' width='60' height='30' fill='#DDF3E8' stroke='#0E9F5D' stroke-width='2'/><text x='62' y='75'>m₁</text><rect x='220' y='55' width='60' height='30' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='242' y='75'>m₂</text><text x='226' y='48'>u₂ = 0</text><line x1='20' y1='85' x2='380' y2='85' stroke='#999'/><text x='20' y='125' font-weight='bold'>AFTER</text><line x1='150' y1='148' x2='215' y2='148' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='172' y='140'>v₁</text><rect x='150' y='158' width='60' height='30' fill='#DDF3E8' stroke='#0E9F5D' stroke-width='2'/><text x='172' y='178'>m₁</text><line x1='260' y1='148' x2='325' y2='148' stroke='#1D1A15' stroke-width='2' marker-end='url(#a)'/><text x='282' y='140'>v₂</text><rect x='260' y='158' width='60' height='30' fill='#FFF1D6' stroke='#E8A93A' stroke-width='2'/><text x='282' y='178'>m₂</text><line x1='20' y1='188' x2='380' y2='188' stroke='#999'/><text x='20' y='212'>Choose one direction as positive</text><text x='20' y='232' font-weight='bold'>m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂</text><text x='20' y='250'>Total momentum before = after (no external force)</text></g></svg>
