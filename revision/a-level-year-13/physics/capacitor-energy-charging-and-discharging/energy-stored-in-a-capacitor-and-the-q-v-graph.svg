<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='200' y='18' text-anchor='middle' font-size='13'>Q–V graph for a capacitor</text><polygon points='60,210 300,210 300,60' fill='#2FB5FF' fill-opacity='0.25'/><line x1='60' y1='210' x2='60' y2='30' stroke='#1D1A15' stroke-width='1.5'/><line x1='60' y1='210' x2='360' y2='210' stroke='#1D1A15' stroke-width='1.5'/><polygon points='60,26 56,36 64,36' fill='#1D1A15'/><polygon points='364,210 354,206 354,214' fill='#1D1A15'/><line x1='60' y1='210' x2='300' y2='60' stroke='#7C5CFF' stroke-width='2.5'/><line x1='300' y1='60' x2='300' y2='210' stroke='#1D1A15' stroke-dasharray='4 3'/><line x1='60' y1='60' x2='300' y2='60' stroke='#1D1A15' stroke-dasharray='4 3'/><text x='300' y='227' text-anchor='middle'>V</text><text x='52' y='64' text-anchor='end'>Q</text><text x='350' y='228'>V / V</text><text x='70' y='34'>Q / C</text><text x='190' y='185'>Area = ½QV</text><text x='190' y='201'>= energy stored</text><text x='75' y='105'>gradient = Q/V</text><text x='75' y='121'>= capacitance C</text><text x='52' y='226' text-anchor='end'>0</text></svg>
