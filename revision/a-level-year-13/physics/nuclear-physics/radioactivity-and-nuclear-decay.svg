<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 480 300' font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='20' y='18' font-size='13' font-weight='bold'>Radioactive decay law</text><path d='M50 40V230H285' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M50 140H120V230M50 185H190V230M50 207.5H260V230' fill='none' stroke='#2FB5FF' stroke-width='2' stroke-dasharray='4 3'/><path d='M50 50Q81 105.3 120 140Q151 167.6 190 185Q221 198.8 260 207.5' fill='none' stroke='#7C5CFF' stroke-width='3'/><circle cx='50' cy='50' r='4' fill='#E8A93A'/><circle cx='120' cy='140' r='4' fill='#E8A93A'/><circle cx='190' cy='185' r='4' fill='#E8A93A'/><circle cx='260' cy='207.5' r='4' fill='#E8A93A'/><text x='56' y='36'>N or A</text><text x='8' y='54'>N₀</text><text x='6' y='144'>N₀/2</text><text x='6' y='189'>N₀/4</text><text x='6' y='211'>N₀/8</text><text x='120' y='244' text-anchor='middle'>T½</text><text x='190' y='244' text-anchor='middle'>2T½</text><text x='260' y='244' text-anchor='middle'>3T½</text><text x='288' y='234'>t</text><text x='135' y='100' fill='#7C5CFF'>each T½ halves N</text><rect x='298' y='28' width='176' height='78' rx='6' fill='#E7F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='306' y='44'>A = λN  (unit: Bq)</text><text x='306' y='60'>N = N₀e^(−λt)</text><text x='306' y='76'>T½ = ln2 ÷ λ</text><text x='306' y='92'>bigger λ → shorter T½</text><rect x='298' y='114' width='176' height='124' rx='6' fill='#FFEFF4' stroke='#FF5D8F' stroke-width='2'/><text x='306' y='130' font-weight='bold'>Conserve A and Z</text><text x='306' y='148'>α: He-4 out; A−4, Z−2</text><text x='306' y='164'>β−: n→p+e−+ν̄ (Z+1)</text><text x='306' y='180'>β+: p→n+e++ν (Z−1)</text><text x='306' y='196'>γ: photon, A and Z same</text><text x='306' y='214'>Random, spontaneous:</text><text x='306' y='229'>constant chance per second</text><text x='20' y='266'>Rutherford: few α deflected at large angles → tiny, dense, +ve nucleus</text><text x='20' y='284'>Uses: imaging, treatment, dating. Safety: shield, distance, short time</text></svg>
