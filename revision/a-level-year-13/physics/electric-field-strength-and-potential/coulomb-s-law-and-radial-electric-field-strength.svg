<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><defs><marker id='a' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0,0L6,3L0,6z' fill='#FF5D8F'/></marker><marker id='k' markerWidth='6' markerHeight='6' refX='5' refY='3' orient='auto'><path d='M0,0L6,3L0,6z' fill='#1D1A15'/></marker></defs><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='18' text-anchor='middle' font-size='13'>Radial field of a point charge</text><g stroke='#FF5D8F' stroke-width='1.5' marker-end='url(#a)'><line x1='104' y1='135' x2='160' y2='135'/><line x1='100' y1='125' x2='139' y2='86'/><line x1='90' y1='121' x2='90' y2='65'/><line x1='80' y1='125' x2='41' y2='86'/><line x1='76' y1='135' x2='20' y2='135'/><line x1='80' y1='145' x2='41' y2='184'/><line x1='90' y1='149' x2='90' y2='205'/><line x1='100' y1='145' x2='139' y2='184'/></g><circle cx='90' cy='135' r='14' fill='#FFE0EB' stroke='#FF5D8F' stroke-width='1.5'/><text x='90' y='139' text-anchor='middle'>+Q</text><text x='90' y='228' text-anchor='middle'>E = Q / 4πε₀r²</text><text x='90' y='246' text-anchor='middle' font-size='11'>closer lines = stronger field</text><g stroke='#1D1A15' stroke-width='1.5' fill='none'><line x1='230' y1='200' x2='386' y2='200' marker-end='url(#k)'/><line x1='230' y1='200' x2='230' y2='40' marker-end='url(#k)'/></g><polyline points='261.5,64 265,90 272,123.6 282.5,151.1 300,172.5 317.5,182.4 335,187.8 370,193.1' fill='none' stroke='#7C5CFF' stroke-width='2'/><text x='238' y='46'>E / N C⁻¹</text><text x='372' y='217'>r / m</text><text x='300' y='90'>E ∝ 1/r²</text><text x='300' y='238' text-anchor='middle'>double r → E ÷ 4</text></g></svg>
