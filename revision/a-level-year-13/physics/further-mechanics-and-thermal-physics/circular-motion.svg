<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C5CFF"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0E9F5D"/></marker></defs><rect width="400" height="260" fill="#fff"/><circle cx="115" cy="130" r="70" fill="#EAF7FF" stroke="#2FB5FF" stroke-width="2.5"/><line x1="115" y1="130" x2="47" y2="130" stroke="#1D1A15" stroke-width="2" stroke-dasharray="5 4"/><circle cx="115" cy="130" r="3" fill="#1D1A15"/><circle cx="164" cy="80" r="8" fill="#FF5D8F" stroke="#1D1A15" stroke-width="2"/><line x1="158" y1="74" x2="128" y2="44" stroke="#7C5CFF" stroke-width="3" marker-end="url(#a)"/><line x1="160" y1="88" x2="134" y2="112" stroke="#0E9F5D" stroke-width="3" marker-end="url(#b)"/><g font-family="sans-serif" font-size="12" fill="#1D1A15"><text x="122" y="38" text-anchor="end" fill="#7C5CFF" font-weight="bold">v (tangent)</text><text x="96" y="104" text-anchor="middle" fill="#0E9F5D" font-weight="bold">F, a</text><text x="80" y="124" text-anchor="middle">r</text><text x="115" y="148" text-anchor="middle">centre</text><text x="170" y="62" font-size="11">mass m</text><text x="215" y="50" font-weight="bold">ω = v/r = 2πf</text><text x="215" y="72" font-weight="bold">a = v²/r = ω²r</text><text x="215" y="94" font-weight="bold">F = mv²/r = mω²r</text><text x="215" y="116">a and F point to the centre</text><text x="215" y="140">F is a real force:</text><text x="215" y="156">tension, friction, gravity</text><text x="215" y="182">Constant speed, but velocity</text><text x="215" y="198">direction changes: accelerating</text><text x="215" y="222">If F is removed: object moves</text><text x="215" y="238">off in a straight tangent line</text></g></svg>
