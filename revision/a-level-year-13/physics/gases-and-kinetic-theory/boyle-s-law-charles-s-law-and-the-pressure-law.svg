<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='10' y='18' font-size='12' font-weight='bold'>Boyle's law (T constant)</text><text x='215' y='18' font-size='12' font-weight='bold'>Charles / pressure law</text><path d='M40 200V45M40 200H185' stroke='#1D1A15' fill='none'/><path d='M40 200L170 65' stroke='#0E9F5D' stroke-width='2.5' fill='none'/><text x='28' y='48'>p</text><text x='165' y='218'>1/V</text><text x='50' y='70'>p ∝ 1/V</text><text x='60' y='236'>pV = constant</text><path d='M240 200V45M240 200H385' stroke='#1D1A15' fill='none'/><path d='M240 200L300 135' stroke='#7C5CFF' stroke-width='2.5' stroke-dasharray='5 4' fill='none'/><path d='M300 135L372 57' stroke='#7C5CFF' stroke-width='2.5' fill='none'/><path d='M300 196V204' stroke='#1D1A15'/><text x='212' y='48'>V or p</text><text x='290' y='216'>0 °C</text><text x='350' y='218'>θ / °C</text><text x='212' y='232'>−273 °C (0 K)</text><text x='248' y='62'>V ∝ T (p const)</text><text x='248' y='76'>p ∝ T (V const)</text><text x='285' y='185' fill='#7C5CFF'>dashed = extrapolated</text><text x='10' y='252'>Absolute zero: V or p → 0 at −273 °C</text></svg>
