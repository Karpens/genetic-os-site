<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Red shift: spectral lines move to longer λ</text><text x='20' y='48' font-family='sans-serif' font-size='12' fill='#1D1A15'>Laboratory source (λ₀)</text><rect x='20' y='55' width='120' height='40' fill='#CFEFFF'/><rect x='140' y='55' width='120' height='40' fill='#D5F3E4'/><rect x='260' y='55' width='120' height='40' fill='#FFD6E5'/><rect x='69' y='55' width='3' height='40' fill='#1D1A15'/><rect x='189' y='55' width='3' height='40' fill='#1D1A15'/><rect x='299' y='55' width='3' height='40' fill='#1D1A15'/><line x1='70' y1='95' x2='70' y2='185' stroke='#FF5D8F' stroke-width='1.5' stroke-dasharray='4 3'/><line x1='70' y1='120' x2='93' y2='120' stroke='#7C5CFF' stroke-width='2'/><polygon points='100,120 92,116 92,124' fill='#7C5CFF'/><text x='85' y='112' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#7C5CFF'>Δλ</text><text x='380' y='138' text-anchor='end' font-family='sans-serif' font-size='12' fill='#1D1A15'>Receding galaxy (observed λ)</text><rect x='20' y='145' width='120' height='40' fill='#CFEFFF'/><rect x='140' y='145' width='120' height='40' fill='#D5F3E4'/><rect x='260' y='145' width='120' height='40' fill='#FFD6E5'/><rect x='99' y='145' width='3' height='40' fill='#1D1A15'/><rect x='219' y='145' width='3' height='40' fill='#1D1A15'/><rect x='329' y='145' width='3' height='40' fill='#1D1A15'/><line x1='20' y1='205' x2='372' y2='205' stroke='#1D1A15' stroke-width='1.5'/><polygon points='380,205 372,201 372,209' fill='#1D1A15'/><text x='20' y='224' font-family='sans-serif' font-size='11' fill='#1D1A15'>blue (shorter λ)</text><text x='380' y='224' text-anchor='end' font-family='sans-serif' font-size='11' fill='#1D1A15'>red (longer λ)</text><text x='200' y='248' text-anchor='middle' font-family='sans-serif' font-size='13' fil