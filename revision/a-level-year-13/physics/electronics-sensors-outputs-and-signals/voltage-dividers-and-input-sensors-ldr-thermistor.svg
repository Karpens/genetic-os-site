<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='20' y='18' font-weight='bold'>Potential divider with an LDR</text><g stroke='#1D1A15' stroke-width='2' fill='none'><path d='M100 36H140V60M140 120V150M140 210V235M110 235H170M140 135H260'/><rect x='125' y='60' width='30' height='60' fill='#FFF4DC'/><rect x='125' y='150' width='30' height='60' fill='#E6F7EE'/></g><circle cx='140' cy='135' r='3'/><circle cx='260' cy='135' r='3' fill='#fff' stroke='#1D1A15'/><path d='M90 80H116M90 98H116' stroke='#E8A93A' stroke-width='2'/><polygon points='120,80 112,76 112,84' fill='#E8A93A'/><polygon points='120,98 112,94 112,102' fill='#E8A93A'/><text x='58' y='93'>light</text><text x='60' y='40'>+Vin</text><text x='180' y='239'>0 V</text><text x='170' y='94'>R1 (LDR)</text><text x='170' y='185'>R2 (fixed)</text><text x='270' y='139'>Vout</text><text x='210' y='40'>Vout = Vin × R2 / (R1 + R2)</text><text x='210' y='58'>(Vout across R2)</text><text x='250' y='175' fill='#0E9F5D'>Brighter: R1 falls,</text><text x='250' y='193' fill='#0E9F5D'>so Vout rises</text><text x='20' y='254'>Swap R1 and R2: Vout falls as light rises</text></g></svg>
