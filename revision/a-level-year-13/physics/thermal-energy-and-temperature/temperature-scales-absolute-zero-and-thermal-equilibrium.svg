<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='16' text-anchor='middle' font-size='13'>Temperature scales (to scale)</text><rect x='190' y='30' width='20' height='200' fill='#DDF3FF' stroke='#2FB5FF'/><line x1='180' y1='30' x2='220' y2='30' stroke='#1D1A15'/><line x1='180' y1='84' x2='220' y2='84' stroke='#1D1A15'/><line x1='180' y1='230' x2='220' y2='230' stroke='#1D1A15'/><circle cx='200' cy='30' r='4' fill='#FF5D8F'/><circle cx='200' cy='84' r='4' fill='#FF5D8F'/><circle cx='200' cy='230' r='4' fill='#FF5D8F'/><text x='174' y='34' text-anchor='end'>100 °C</text><text x='174' y='88' text-anchor='end'>0 °C</text><text x='174' y='234' text-anchor='end'>−273.15 °C</text><text x='226' y='34'>373.15 K</text><text x='226' y='88'>273.15 K</text><text x='226' y='234'>0 K</text><text x='292' y='34' fill='#7C5CFF'>steam point</text><text x='292' y='88' fill='#7C5CFF'>ice point</text><text x='292' y='234' fill='#7C5CFF'>absolute zero</text><text x='8' y='130' font-size='11'>A change of</text><text x='8' y='144' font-size='11'>1 K = 1 °C</text><text x='140' y='252' text-anchor='middle' fill='#0E9F5D'>Celsius, θ</text><text x='250' y='252' text-anchor='middle' fill='#0E9F5D'>Kelvin, T</text></g></svg>
