<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='22' text-anchor='middle' font-size='14' font-weight='bold'>Two-input gate truth tables</text><rect x='15' y='34' width='82' height='28' fill='#DDF1FF'/><rect x='108' y='34' width='277' height='28' fill='#FFF2D9'/><text x='35' y='53' text-anchor='middle' font-weight='bold'>A</text><text x='75' y='53' text-anchor='middle' font-weight='bold'>B</text><text x='135' y='53' text-anchor='middle' font-weight='bold'>AND</text><text x='185' y='53' text-anchor='middle' font-weight='bold'>OR</text><text x='240' y='53' text-anchor='middle' font-weight='bold'>NAND</text><text x='295' y='53' text-anchor='middle' font-weight='bold'>NOR</text><text x='350' y='53' text-anchor='middle' font-weight='bold'>XOR</text><line x1='15' y1='62' x2='385' y2='62' stroke='#1D1A15'/><line x1='102' y1='34' x2='102' y2='170' stroke='#1D1A15'/><line x1='15' y1='170' x2='385' y2='170' stroke='#1D1A15'/><g text-anchor='middle'><text x='35' y='84'>0</text><text x='75' y='84'>0</text><text x='135' y='84'>0</text><text x='185' y='84'>0</text><text x='240' y='84'>1</text><text x='295' y='84'>1</text><text x='350' y='84'>0</text><text x='35' y='110'>0</text><text x='75' y='110'>1</text><text x='135' y='110'>0</text><text x='185' y='110'>1</text><text x='240' y='110'>1</text><text x='295' y='110'>0</text><text x='350' y='110'>1</text><text x='35' y='136'>1</text><text x='75' y='136'>0</text><text x='135' y='136'>0</text><text x='185' y='136'>1</text><text x='240' y='136'>1</text><text x='295' y='136'>0</text><text x='350' y='136'>1</text><text x='35' y='162'>1</text><text x='75' y='162'>1</text><text x='135' y='162'>1</text><text x='185' y='162'>1</text><text x='240' y='162'>0</text><text x='295' y='162'>0</text><text x='350' y='162'>0</text></g><text x='200' y='198' text-anchor='middle'>NOT: A = 0 gives Q = 1;  A = 1 gives Q = 0</text><text x='200' y='221' text-anchor='middle'>Logic 1 = high (about supply voltage), logic 0 = low (about 0 V)</text><text x='200' y='244' text-anchor='middle'>NAND = AND then NOT;  NOR = OR then NOT</text></svg>
