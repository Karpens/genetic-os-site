<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#ffffff'/><polygon points='200,105 221.7,117.5 221.7,142.5 200,155 178.3,142.5 178.3,117.5' fill='#F1ECFF' stroke='#7C5CFF' stroke-width='2'/><circle cx='200' cy='130' r='13' fill='none' stroke='#7C5CFF' stroke-width='1.5'/><line x1='200' y1='105' x2='200' y2='99' stroke='#1D1A15' stroke-width='2'/><text x='200' y='94' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>OH</text><text x='200' y='181' text-anchor='middle' font-family='sans-serif' font-size='12' fill='#1D1A15'>phenol</text><rect x='8' y='8' width='184' height='52' rx='6' fill='#E5F6EE' stroke='#0E9F5D' stroke-width='1.5'/><text x='100' y='24' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Weak acid: NaOH(aq)</text><text x='100' y='40' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>→ C₆H₅O⁻Na⁺ + H₂O</text><text x='100' y='54' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>no reaction with Na₂CO₃</text><rect x='208' y='8' width='184' height='52' rx='6' fill='#FDF3DF' stroke='#E8A93A' stroke-width='1.5'/><text x='300' y='24' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Br₂(aq), room temp</text><text x='300' y='40' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>→ 2,4,6-tribromophenol</text><text x='300' y='54' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>white ppt, no catalyst</text><rect x='8' y='200' width='184' height='52' rx='6' fill='#E3F5FF' stroke='#2FB5FF' stroke-width='1.5'/><text x='100' y='216' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>CH₃COCl (acyl chloride)</text><text x='100' y='232' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>→ phenyl ethanoate + HCl</text><text x='100' y='246' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(ester link made)</text><rect x='208' y='200' width='184' height='52' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='1.5'/><text x='300' y='216' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Neutral FeCl₃(aq)</text><text x='300' y='232' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>→ violet/purple complex</text><text x='300' y='246' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>test for phenols</text><line x1='180' y1='112' x2='120' y2='63' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='220' y1='112' x2='280' y2='63' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='180' y1='148' x2='120' y2='197' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='220' y1='148' x2='280' y2='197' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/></svg>
