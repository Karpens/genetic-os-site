<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 Z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><rect x='110' y='12' width='180' height='36' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='2'/><text x='200' y='35' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>[H⁺] = 0.025 mol dm⁻³</text><rect x='110' y='112' width='180' height='36' rx='6' fill='#FDF3DF' stroke='#E8A93A' stroke-width='2'/><text x='200' y='135' text-anchor='middle' font-family='sans-serif' font-size='13' fill='#1D1A15'>pH = 1.60</text><line x1='170' y1='50' x2='170' y2='110' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='230' y1='110' x2='230' y2='50' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><text x='160' y='84' text-anchor='end' font-family='sans-serif' font-size='12' fill='#1D1A15'>pH = −log₁₀[H⁺]</text><text x='240' y='84' font-family='sans-serif' font-size='12' fill='#1D1A15'>[H⁺] = antilog(−pH)</text><text x='200' y='172' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#7C5CFF'>calculator: −log(0.025) = 1.60 ; 10^(−1.60) = 0.025</text><rect x='10' y='185' width='380' height='66' rx='6' fill='#EAF7FF' stroke='#2FB5FF' stroke-width='2'/><text x='20' y='205' font-family='sans-serif' font-size='12' fill='#1D1A15'>Kw = [H⁺][OH⁻] = 1.00×10⁻¹⁴ mol² dm⁻⁶ (298 K)</text><text x='20' y='222' font-family='sans-serif' font-size='12' fill='#1D1A15'>pH + pOH = 14 (298 K only)</text><text x='20' y='240' font-family='sans-serif' font-size='12' fill='#1D1A15'>Weak acid: [H⁺] = √(Ka[HA]) ; buffer: pH = pKa + log([A⁻]/[HA])</text></svg>
