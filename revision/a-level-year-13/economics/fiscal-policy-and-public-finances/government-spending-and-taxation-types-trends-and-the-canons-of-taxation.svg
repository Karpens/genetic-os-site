<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><rect x='10' y='8' width='185' height='130' rx='6' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='1.5'/><text x='20' y='26' font-size='13' font-weight='bold'>Revenue (T)</text><text x='20' y='46'>Direct: income tax, NICs,</text><text x='20' y='60'>corporation tax, CGT</text><text x='20' y='80'>Indirect: VAT, excise</text><text x='20' y='94'>duties, import tariffs</text><text x='20' y='114'>Local: council tax,</text><text x='20' y='128'>business rates</text><rect x='205' y='8' width='185' height='130' rx='6' fill='#FFF4DD' stroke='#E8A93A' stroke-width='1.5'/><text x='215' y='26' font-size='13' font-weight='bold'>Spending (G)</text><text x='215' y='46'>Current: pay, supplies,</text><text x='215' y='60'>debt interest</text><text x='215' y='80'>Capital: roads, schools,</text><text x='215' y='94'>hospitals (investment)</text><text x='215' y='114'>Transfers: pensions,</text><text x='215' y='128'>benefits (no output)</text><line x1='100' y1='138' x2='100' y2='152' stroke='#1D1A15'/><polygon points='95,151 105,151 100,160' fill='#1D1A15'/><line x1='297' y1='138' x2='297' y2='152' stroke='#1D1A15'/><polygon points='292,151 302,151 297,160' fill='#1D1A15'/><rect x='40' y='160' width='320' height='42' rx='6' fill='#EEEAFF' stroke='#7C5CFF' stroke-width='1.5'/><text x='200' y='177' text-anchor='middle' font-weight='bold'>Budget balance = T − G</text><text x='200' y='193' text-anchor='middle'>G &gt; T: deficit → borrowing → adds to national debt</text><rect x='10' y='212' width='380' height='40' rx='6' fill='#FFE9F1' stroke='#FF5D8F' stroke-width='1.5'/><text x='200' y='228' text-anchor='middle' font-weight='bold'>Canons of taxation (Adam Smith)</text><text x='200' y='244' text-anchor='middle'>Equity · Certainty · Convenience · Economy</text></svg>
