<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><rect x='80' y='6' width='240' height='40' rx='5' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='1.5'/><text x='200' y='23' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Merger meets CMA jurisdiction test</text><text x='200' y='38' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>25% share of supply or turnover test</text><line x1='200' y1='46' x2='200' y2='60' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='80' y='62' width='240' height='40' rx='5' fill='#FFF4DC' stroke='#E8A93A' stroke-width='1.5'/><text x='200' y='79' text-anchor='middle' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Phase 1: CMA initial review</text><text x='200' y='94' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>up to 40 working days: SLC?</text><line x1='170' y1='102' x2='70' y2='128' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='200' y1='102' x2='200' y2='128' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='230' y1='102' x2='330' y2='128' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='8' y='130' width='112' height='40' rx='5' fill='#E6F7EE' stroke='#0E9F5D' stroke-width='1.5'/><text x='64' y='147' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Cleared</text><text x='64' y='161' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>no SLC found</text><rect x='144' y='130' width='112' height='40' rx='5' fill='#E5F5FF' stroke='#2FB5FF' stroke-width='1.5'/><text x='200' y='147' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Undertakings</text><text x='200' y='161' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>in lieu (UILs)</text><rect x='280' y='130' width='112' height='40' rx='5' fill='#FFE9F0' stroke='#FF5D8F' stroke-width='1.5'/><text x='336' y='147' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Refer to</text><text x='336' y='161' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Phase 2</text><line x1='336' y1='170' x2='336' y2='188' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='240' y='190' width='152' height='52' rx='5' fill='#F1ECFF' stroke='#7C5CFF' stroke-width='1.5'/><text x='316' y='206' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Phase 2: 24 weeks (+8)</text><text x='316' y='221' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Panel: clear, remedy</text><text x='316' y='235' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>or prohibit</text><text x='10' y='198' font-family='sans-serif' font-size='11' fill='#1D1A15'>SLC = substantial lessening</text><text x='10' y='212' font-family='sans-serif' font-size='11' fill='#1D1A15'>of competition</text><text x='10' y='232' font-family='sans-serif' font-size='11' fill='#1D1A15'>Remedies: divest, behavioural</text></svg>
