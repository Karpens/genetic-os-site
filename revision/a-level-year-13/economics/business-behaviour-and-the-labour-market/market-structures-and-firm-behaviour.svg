<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 320'><rect width='400' height='320' fill='#fff'/><rect x='50' y='71' width='120' height='66' fill='#CFEFDD'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><path d='M50 18V220H372' fill='none' stroke='#1D1A15' stroke-width='2'/><path d='M50 26L350 138' fill='none' stroke='#2FB5FF' stroke-width='2.5'/><path d='M50 26L260 177' fill='none' stroke='#FF5D8F' stroke-width='2.5'/><path d='M70 202L240 49' fill='none' stroke='#7C5CFF' stroke-width='2.5'/><path d='M60 85Q100 195 280 90' fill='none' stroke='#E8A93A' stroke-width='2.5'/><path d='M170 112V220M50 71H170' fill='none' stroke='#1D1A15' stroke-width='2' stroke-dasharray='4 3'/><circle cx='170' cy='112' r='4' fill='#1D1A15'/><text x='56' y='14'>Price / cost (£)</text><text x='372' y='238' text-anchor='end'>Output (Q)</text><text x='170' y='234' text-anchor='middle'>Q* (MC = MR)</text><text x='46' y='74' text-anchor='end'>P*</text><text x='354' y='142'>AR</text><text x='264' y='186'>MR</text><text x='244' y='46'>MC</text><text x='284' y='94'>AC</text><rect x='12' y='253' width='12' height='10' fill='#CFEFDD' stroke='#0E9F5D' stroke-width='2'/><text x='30' y='262'>Supernormal profit = (P* − AC) × Q*</text><text x='12' y='280'>Profit max where MC = MR; price is read off AR.</text><text x='12' y='296'>Perfect competition: P = MC, entry leaves normal profit.</text><text x='12' y='312'>Monopoly: P &gt; MC, barriers keep supernormal profit.</text></g></svg>
