<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='200' y='20' font-size='13' text-anchor='middle'>Share of total income by quintile (illustrative)</text><path d='M46 40V220H300' stroke='#1D1A15' fill='none'/><text x='42' y='224' text-anchor='end'>0</text><text x='42' y='144' text-anchor='end'>20</text><text x='42' y='64' text-anchor='end'>40</text><text transform='translate(12 130) rotate(-90)' text-anchor='middle'>% of total income</text><rect x='50' y='192' width='36' height='28' fill='#FFE9C2' stroke='#E8A93A'/><rect x='100' y='172' width='36' height='48' fill='#FFE9C2' stroke='#E8A93A'/><rect x='150' y='156' width='36' height='64' fill='#FFE9C2' stroke='#E8A93A'/><rect x='200' y='132' width='36' height='88' fill='#FFE9C2' stroke='#E8A93A'/><rect x='250' y='48' width='36' height='172' fill='#E3DAFF' stroke='#7C5CFF'/><line x1='46' y1='140' x2='292' y2='140' stroke='#FF5D8F' stroke-width='1.5' stroke-dasharray='5 3'/><text x='68' y='188' text-anchor='middle'>7%</text><text x='118' y='168' text-anchor='middle'>12%</text><text x='168' y='152' text-anchor='middle'>16%</text><text x='218' y='128' text-anchor='middle'>22%</text><text x='268' y='44' text-anchor='middle'>43%</text><text x='68' y='236' text-anchor='middle'>Q1 poorest</text><text x='118' y='236' text-anchor='middle'>Q2</text><text x='168' y='236' text-anchor='middle'>Q3</text><text x='218' y='236' text-anchor='middle'>Q4</text><text x='272' y='236' text-anchor='middle'>Q5 richest</text><text x='170' y='254' text-anchor='middle'>Households ranked by income (quintiles)</text><text x='296' y='137'>Equal share</text><text x='296' y='151'>= 20% each</text><text x='296' y='70'>Quintile ratio</text><text x='296' y='86'>= 43 ÷ 7 ≈ 6.1</text></g></svg>
