<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='6' refY='3' orient='auto'><path d='M0,0 L6,3 L0,6 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='18' text-anchor='middle' font-size='13' font-weight='bold'>Rational model vs bounded rationality</text><rect x='10' y='30' width='175' height='150' rx='8' fill='#E6F6EE' stroke='#0E9F5D' stroke-width='2'/><text x='97' y='50' text-anchor='middle' font-size='12' font-weight='bold'>Traditional model</text><text x='22' y='78'>• Perfect information</text><text x='22' y='103'>• Unlimited processing</text><text x='22' y='128'>• Stable preferences</text><text x='22' y='153'>• Maximises utility</text><rect x='215' y='30' width='175' height='150' rx='8' fill='#FDF3DF' stroke='#E8A93A' stroke-width='2'/><text x='302' y='50' text-anchor='middle' font-size='12' font-weight='bold'>Bounded rationality</text><text x='227' y='78'>• Limited information</text><text x='227' y='103'>• Limited cognitive ability</text><text x='227' y='128'>• Limited time</text><text x='227' y='153'>• Uses rules of thumb</text><text x='200' y='108' text-anchor='middle'>vs</text><line x1='97' y1='180' x2='97' y2='208' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='302' y1='180' x2='302' y2='208' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='10' y='210' width='175' height='38' rx='8' fill='#fff' stroke='#0E9F5D' stroke-width='2'/><text x='97' y='233' text-anchor='middle'>Optimum: maximises utility</text><rect x='215' y='210' width='175' height='38' rx='8' fill='#fff' stroke='#E8A93A' stroke-width='2'/><text x='302' y='233' text-anchor='middle'>Satisficing: 'good enough'</text></svg>
