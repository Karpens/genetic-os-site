<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='20' text-anchor='middle' font-size='13' font-weight='bold'>Worked example: output from all resources</text><rect x='10' y='30' width='380' height='24' fill='#E3F5FF'/><rect x='10' y='54' width='380' height='48' fill='#FDF3DD'/><g stroke='#1D1A15' stroke-width='1' fill='none'><rect x='10' y='30' width='380' height='72'/><line x1='10' y1='54' x2='390' y2='54'/><line x1='10' y1='78' x2='390' y2='78'/><line x1='110' y1='30' x2='110' y2='102'/><line x1='190' y1='30' x2='190' y2='102'/><line x1='260' y1='30' x2='260' y2='102'/></g><g text-anchor='middle'><text x='60' y='46'>Country</text><text x='150' y='46'>Wheat (t)</text><text x='225' y='46'>Cars</text><text x='325' y='46'>Opp. cost of 1 car</text><text x='60' y='70'>X</text><text x='150' y='70'>60</text><text x='225' y='70'>30</text><text x='325' y='70'>2 t wheat</text><text x='60' y='94'>Y</text><text x='150' y='94'>40</text><text x='225' y='94'>10</text><text x='325' y='94'>4 t wheat</text><text x='200' y='122' font-size='11'>Opp. cost of 1 t wheat: X = 30÷60 = 0.5 car; Y = 10÷40 = 0.25 car</text><rect x='10' y='134' width='185' height='46' fill='#E6F6EE' stroke='#0E9F5D'/><text x='102' y='153'>X: comparative advantage</text><text x='102' y='170'>in cars (2 &lt; 4 t wheat)</text><rect x='205' y='134' width='185' height='46' fill='#F1EDFF' stroke='#7C5CFF'/><text x='297' y='153'>Y: comparative advantage</text><text x='297' y='170'>in wheat (0.25 &lt; 0.5 car)</text><text x='200' y='200'>X has absolute advantage in both goods,</text><text x='200' y='216'>but trade still benefits both countries.</text><rect x='10' y='224' width='380' height='28' fill='#FFE9F1' stroke='#FF5D8F'/><text x='200' y='243' font-weight='bold'>Mutually beneficial range: 1 car = 2 to 4 t wheat</text></g></g></svg>
