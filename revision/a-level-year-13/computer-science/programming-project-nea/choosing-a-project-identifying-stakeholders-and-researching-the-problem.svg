<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15' text-anchor='middle'><rect x='15' y='15' width='170' height='44' rx='6' fill='#E7F7EF' stroke='#0E9F5D'/><text x='100' y='34'>1. Identify a problem</text><text x='100' y='50'>with a real client</text><rect x='215' y='15' width='170' height='44' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='300' y='34'>2. List stakeholders</text><text x='300' y='50'>client, users, admin</text><line x1='185' y1='37' x2='213' y2='37' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='300' y1='59' x2='300' y2='87' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='215' y='89' width='170' height='44' rx='6' fill='#E3F5FF' stroke='#2FB5FF'/><text x='300' y='108'>3. Research the problem</text><text x='300' y='124'>interview, survey, observe</text><line x1='215' y1='111' x2='187' y2='111' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='15' y='89' width='170' height='44' rx='6' fill='#F0EBFF' stroke='#7C5CFF'/><text x='100' y='108'>4. Study existing</text><text x='100' y='124'>solutions and documents</text><line x1='100' y1='133' x2='100' y2='161' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><rect x='15' y='163' width='370' height='44' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='200' y='182'>5. Feasibility check, then choose project</text><text x='200' y='198'>time, skills, data access, ethics, complexity</text><text x='200' y='236' font-size='11'>Keep evidence: transcripts, surveys, screenshots, dates</text></g></svg>
