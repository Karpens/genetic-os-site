<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#ffffff'/><text x='20' y='20' font-size='14' font-weight='bold'>8-bit two's complement: 11010110</text><rect x='40' y='30' width='40' height='24' fill='#FFE3EC' stroke='#FF5D8F'/><rect x='80' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='120' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='160' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='200' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='240' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='280' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><rect x='320' y='30' width='40' height='24' fill='#E6F7EE' stroke='#0E9F5D'/><g text-anchor='middle'><text x='60' y='46'>-128</text><text x='100' y='46'>64</text><text x='140' y='46'>32</text><text x='180' y='46'>16</text><text x='220' y='46'>8</text><text x='260' y='46'>4</text><text x='300' y='46'>2</text><text x='340' y='46'>1</text></g><rect x='40' y='54' width='40' height='26' fill='#FFE3EC' stroke='#FF5D8F'/><rect x='80' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='120' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='160' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='200' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='240' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='280' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><rect x='320' y='54' width='40' height='26' fill='#ffffff' stroke='#1D1A15'/><g text-anchor='middle' font-size='14' font-weight='bold'><text x='60' y='72'>1</text><text x='100' y='72'>1</text><text x='140' y='72'>0</text><text x='180' y='72'>1</text><text x='220' y='72'>0</text><text x='260' y='72'>1</text><text x='300' y='72'>1</text><text x='340' y='72'>0</text></g><path d='M40 90 H195 M205 90 H360' stroke='#7C5CFF' stroke-width='2' fill='none'/><g text-anchor='middle'><text x='117' y='106'>1101 = D</text><text x='283' y='106'>0110 = 6</text></g><text x='20' y='130'>Pink box = sign bit, weight -128</text><text x='20' y='150'>Value = -128 + 64 + 16 + 4 + 2 = -42</text><text x='20' y='170'>Negate: invert 00101001, add 1 = 00101010 = 42</text><text x='20' y='190'>Sign and magnitude: 10101010 = -42</text><text x='20' y='214'>Two's complement range: -128 to +127</text><text x='20' y='234'>Sign and magnitude range: -127 to +127 (two zeros)</text></svg>
