<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><rect x='8' y='8' width='384' height='244' rx='6' fill='#FFF6E3' stroke='#E8A93A'/><text x='18' y='28' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Global scope: count = 5</text><rect x='18' y='42' width='172' height='200' rx='6' fill='#E6F7EE' stroke='#0E9F5D'/><text x='26' y='62' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Local scope: addOne(n)</text><text x='26' y='86' font-family='sans-serif' font-size='11' fill='#1D1A15'>n = 5 (copy of count)</text><text x='26' y='104' font-family='sans-serif' font-size='11' fill='#1D1A15'>result = n + 1 = 6</text><text x='26' y='124' font-family='sans-serif' font-size='11' fill='#1D1A15'>n and result exist only</text><text x='26' y='140' font-family='sans-serif' font-size='11' fill='#1D1A15'>while the call runs</text><text x='26' y='165' font-family='sans-serif' font-size='11' fill='#1D1A15'>Return 6 to caller:</text><text x='26' y='181' font-family='sans-serif' font-size='11' fill='#1D1A15'>count is still 5</text><text x='26' y='205' font-family='sans-serif' font-size='11' fill='#1D1A15'>Local names can shadow</text><text x='26' y='221' font-family='sans-serif' font-size='11' fill='#1D1A15'>a global of same name</text><rect x='208' y='42' width='174' height='200' rx='6' fill='#EAF7FF' stroke='#2FB5FF'/><text x='216' y='62' font-family='sans-serif' font-size='12' font-weight='bold' fill='#1D1A15'>Parameter passing</text><text x='216' y='86' font-family='sans-serif' font-size='11' font-weight='bold' fill='#1D1A15'>By value:</text><text x='216' y='102' font-family='sans-serif' font-size='11' fill='#1D1A15'>a copy is passed</text><text x='216' y='118' font-family='sans-serif' font-size='11' fill='#1D1A15'>original unchanged</text><text x='216' y='146' font-family='sans-serif' font-size='11' font-weight='bold' fill='#1D1A15'>By reference:</text><text x='216' y='162' font-family='sans-serif' font-size='11' fill='#1D1A15'>address is passed</text><text x='216' y='178' font-family='sans-serif' font-size='11' fill='#1D1A15'>changes alter original</text><text x='216' y='206' font-family='sans-serif' font-size='11' fill='#1D1A15'>Value: safer. Reference:</text><text x='216' y='222' font-family='sans-serif' font-size='11' fill='#1D1A15'>no copy, but side effects</text></svg>
