<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1D1A15"/></marker></defs><g font-family="sans-serif" font-size="11" fill="#1D1A15" text-anchor="middle"><text x="200" y="16" font-size="13" font-weight="bold">Turing machine: infinite tape</text><rect x="150" y="30" width="40" height="24" fill="#FBE9C4" stroke="none"/><path d="M70 30H310M70 54H310M70 30V54M110 30V54M150 30V54M190 30V54M230 30V54M270 30V54M310 30V54" fill="none" stroke="#1D1A15" stroke-width="2"/><text x="90" y="47" font-size="13">1</text><text x="130" y="47" font-size="13">0</text><text x="170" y="47" font-size="13">1</text><text x="210" y="47" font-size="13">_</text><text x="250" y="47" font-size="13">0</text><text x="290" y="47" font-size="13">1</text><text x="58" y="47">...∞</text><text x="326" y="47">∞...</text><path d="M170 92V57" fill="none" stroke="#7C5CFF" stroke-width="2.5" marker-end="url(#m)"/><rect x="110" y="92" width="160" height="28" rx="6" fill="#ECE6FF" stroke="#7C5CFF" stroke-width="2"/><text x="190" y="110">Read/write head + state q1</text><text x="200" y="138">Rule: (q1, 1) → write 0, move R, go to q2</text><rect x="10" y="150" width="255" height="102" rx="8" fill="#E6F6EE" stroke="#0E9F5D" stroke-width="2"/><text x="20" y="167" text-anchor="start" font-weight="bold">Computable (an algorithm exists)</text><rect x="20" y="176" width="110" height="66" rx="6" fill="#fff" stroke="#0E9F5D" stroke-width="2"/><text x="75" y="196" font-weight="bold">Tractable</text><text x="75" y="212">polynomial time</text><text x="75" y="228">e.g. sorting</text><rect x="140" y="176" width="115" height="66" rx="6" fill="#fff" stroke="#E8A93A" stroke-width="2"/><text x="197" y="196" font-weight="bold">Intractable</text><text x="197" y="212">no known poly</text><text x="197" y="228">TSP→heuristic</text><rect x="277" y="150" width="115" height="102" rx="8" fill="#FFE3EC" stroke="#FF5D8F" stroke-width="2"/><text x="334" y="168" font-weight="bold">Not computable</text><text x="334" y="190">Halting problem</text><text x="334" y="208">undecidable:</text><text x="334" y="226">no algorithm for</text><text x="334" y="242">every program</text></g></svg>
