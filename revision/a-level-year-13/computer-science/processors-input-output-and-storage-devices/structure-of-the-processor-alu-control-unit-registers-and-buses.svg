<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><rect x='6' y='6' width='304' height='192' fill='none' stroke='#1D1A15'/><text x='14' y='21' font-weight='bold'>CPU</text><rect x='18' y='28' width='128' height='46' fill='#FFF4DC' stroke='#E8A93A'/><text x='82' y='48' text-anchor='middle' font-weight='bold'>Control unit</text><text x='82' y='64' text-anchor='middle' font-size='11'>decodes, sequences</text><rect x='168' y='28' width='130' height='46' fill='#E3F5EC' stroke='#0E9F5D'/><text x='233' y='48' text-anchor='middle' font-weight='bold'>ALU</text><text x='233' y='64' text-anchor='middle' font-size='11'>arithmetic and logic</text><text x='18' y='86' font-size='11'>Registers</text><g fill='#E6F6FF' stroke='#2FB5FF'><rect x='18' y='92' width='50' height='30'/><rect x='76' y='92' width='50' height='30'/><rect x='134' y='92' width='50' height='30'/><rect x='192' y='92' width='50' height='30'/><rect x='250' y='92' width='50' height='30'/></g><g text-anchor='middle'><text x='43' y='112'>PC</text><text x='101' y='112'>MAR</text><text x='159' y='112'>MDR</text><text x='217' y='112'>CIR</text><text x='275' y='112'>ACC</text></g><g font-size='11'><text x='18' y='138'>PC: address of next instruction</text><text x='18' y='152'>MAR: address being read/written</text><text x='18' y='166'>MDR: data in transit to/from memory</text><text x='18' y='180'>CIR: current instruction  ACC: ALU result</text></g><rect x='330' y='28' width='64' height='152' fill='#EFEAFF' stroke='#7C5CFF'/><g text-anchor='middle'><text x='362' y='95'>Main</text><text x='362' y='110'>memory</text><text x='362' y='125'>(RAM)</text></g><g stroke-width='2' fill='none'><path d='M18 214H362' stroke='#FF5D8F'/><path d='M18 230H362' stroke='#2FB5FF'/><path d='M18 246H362' stroke='#E8A93A'/></g><path d='M300 198V246M362 180V246' stroke='#1D1A15' fill='none'/><g font-size='11'><text x='18' y='211'>Address bus (one-way, CPU → memory)</text><text x='18' y='227'>Data bus (two-way)</text><text x='18' y='243'>Control bus (read/write, clock, interrupts)</text></g></g></svg>
