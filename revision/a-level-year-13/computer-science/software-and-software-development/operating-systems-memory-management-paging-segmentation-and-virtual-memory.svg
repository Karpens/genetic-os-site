<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 Z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='15' text-anchor='middle' font-size='13' font-weight='bold'>Paging: page table maps pages to frames</text><text x='15' y='42'>Pages</text><text x='296' y='42'>RAM</text><rect x='130' y='24' width='120' height='24' fill='#FFF3DC' stroke='#E8A93A'/><text x='150' y='40' text-anchor='middle'>Page</text><text x='195' y='40' text-anchor='middle'>Frame</text><text x='235' y='40' text-anchor='middle'>Valid</text><rect x='15' y='50' width='75' height='28' fill='#E6F6EE' stroke='#0E9F5D'/><text x='52' y='68' text-anchor='middle'>Page 0</text><rect x='15' y='80' width='75' height='28' fill='#E6F6EE' stroke='#0E9F5D'/><text x='52' y='98' text-anchor='middle'>Page 1</text><rect x='15' y='110' width='75' height='28' fill='#E6F6EE' stroke='#0E9F5D'/><text x='52' y='128' text-anchor='middle'>Page 2</text><rect x='15' y='140' width='75' height='28' fill='#E6F6EE' stroke='#0E9F5D'/><text x='52' y='158' text-anchor='middle'>Page 3</text><line x1='90' y1='64' x2='130' y2='64' stroke='#1D1A15' marker-end='url(#a)'/><line x1='90' y1='94' x2='130' y2='94' stroke='#1D1A15' marker-end='url(#a)'/><line x1='90' y1='124' x2='130' y2='124' stroke='#1D1A15' marker-end='url(#a)'/><line x1='90' y1='154' x2='130' y2='154' stroke='#1D1A15' marker-end='url(#a)'/><rect x='130' y='50' width='120' height='28' fill='#FFF3DC' stroke='#E8A93A'/><text x='150' y='68' text-anchor='middle'>0</text><text x='195' y='68' text-anchor='middle'>0</text><text x='235' y='68' text-anchor='middle'>1</text><rect x='130' y='80' width='120' height='28' fill='#FFF3DC' stroke='#E8A93A'/><text x='150' y='98' text-anchor='middle'>1</text><text x='195' y='98' text-anchor='middle'>1</text><text x='235' y='98' text-anchor='middle'>1</text><rect x='130' y='110' width='120' height='28' fill='#FFE3EC' stroke='#FF5D8F'/><text x='150' y='128' text-anchor='middle'>2</text><text x='195' y='128' text-anchor='middle'>-</text><text x='235' y='128' text-anchor='middle'>0</text><rect x='130' y='140' width='120' height='28' fill='#FFF3DC' stroke='#E8A93A'/><text x='150' y='158' text-anchor='middle'>3</text><text x='195' y='158' text-anchor='middle'>3</text><text x='235' y='158' text-anchor='middle'>1</text><line x1='250' y1='64' x2='296' y2='64' stroke='#1D1A15' marker-end='url(#a)'/><line x1='250' y1='94' x2='296' y2='94' stroke='#1D1A15' marker-end='url(#a)'/><line x1='250' y1='154' x2='296' y2='154' stroke='#1D1A15' marker-end='url(#a)'/><rect x='296' y='50' width='92' height='28' fill='#EAF7FF' stroke='#2FB5FF'/><text x='342' y='68' text-anchor='middle' font-size='11'>Frame 0: P0</text><rect x='296' y='80' width='92' height='28' fill='#EAF7FF' stroke='#2FB5FF'/><text x='342' y='98' text-anchor='middle' font-size='11'>Frame 1: P1</text><rect x='296' y='110' width='92' height='28' fill='#F3F0EA' stroke='#1D1A15'/><text x='342' y='128' text-anchor='middle' font-size='11'>Frame 2: other</text><rect x='296' y='140' width='92' height='28' fill='#EAF7FF' stroke='#2FB5FF'/><text x='342' y='158' text-anchor='middle' font-size='11'>Frame 3: P3</text><rect x='296' y='200' width='92' height='40' fill='#EFEAFF' stroke='#7C5CFF'/><text x='342' y='217' text-anchor='middle' font-size='11'>Disk (swap)</text><text x='342' y='232' text-anchor='middle' font-size='11'>holds Page 2</text><line x1='342' y1='200' x2='342' y2='172' stroke='#1D1A15' marker-end='url(#a)'/><text x='348' y='190' font-size='11'>swap</text><text x='15' y='200' font-size='11'>Valid = 0 gives a page fault:</text><text x='15' y='216' font-size='11'>OS loads Page 2 from disk</text><text x='15' y='232' font-size='11'>into a free frame.</text><text x='15' y='252' font-size='11'>Physical address = frame start + offset</text></svg>
