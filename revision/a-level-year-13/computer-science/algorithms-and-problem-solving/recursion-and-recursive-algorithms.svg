<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='200' y='18' text-anchor='middle' font-size='14' font-weight='bold'>Call stack for factorial(3)</text><text x='95' y='42' text-anchor='middle' font-weight='bold'>Calls (push)</text><text x='307' y='42' text-anchor='middle' font-weight='bold'>Returns (pop)</text><rect x='10' y='50' width='170' height='36' rx='4' fill='#E7F7EF' stroke='#0E9F5D'/><text x='95' y='72' text-anchor='middle'>factorial(3): n = 3</text><rect x='10' y='110' width='170' height='36' rx='4' fill='#E7F7EF' stroke='#0E9F5D'/><text x='95' y='132' text-anchor='middle'>factorial(2): n = 2</text><rect x='10' y='170' width='170' height='36' rx='4' fill='#FFF1D6' stroke='#E8A93A'/><text x='95' y='192' text-anchor='middle'>factorial(1) = 1 (base)</text><line x1='95' y1='86' x2='95' y2='104' stroke='#1D1A15'/><polygon points='90,104 100,104 95,110' fill='#1D1A15'/><line x1='95' y1='146' x2='95' y2='164' stroke='#1D1A15'/><polygon points='90,164 100,164 95,170' fill='#1D1A15'/><text x='104' y='102'>calls</text><text x='104' y='162'>calls</text><rect x='225' y='50' width='165' height='36' rx='4' fill='#E6F5FF' stroke='#2FB5FF'/><text x='307' y='72' text-anchor='middle'>returns 3 × 2 = 6</text><rect x='225' y='110' width='165' height='36' rx='4' fill='#E6F5FF' stroke='#2FB5FF'/><text x='307' y='132' text-anchor='middle'>returns 2 × 1 = 2</text><rect x='225' y='170' width='165' height='36' rx='4' fill='#E6F5FF' stroke='#2FB5FF'/><text x='307' y='192' text-anchor='middle'>returns 1</text><line x1='180' y1='188' x2='218' y2='188' stroke='#1D1A15'/><polygon points='218,183 225,188 218,193' fill='#1D1A15'/><line x1='307' y1='110' x2='307' y2='94' stroke='#1D1A15'/><polygon points='302,95 312,95 307,88' fill='#1D1A15'/><line x1='307' y1='170' x2='307' y2='154' stroke='#1D1A15'/><polygon points='302,155 312,155 307,148' fill='#1D1A15'/><text x='314' y='102'>unwind</text><text x='314' y='162'>unwind</text><text x='200' y='228' text-anchor='middle'>Frames are pushed on each call and popped on each return</text><text x='200' y='246' text-anchor='middle'>No base case = infinite recursion = stack overflow</text></g></svg>
