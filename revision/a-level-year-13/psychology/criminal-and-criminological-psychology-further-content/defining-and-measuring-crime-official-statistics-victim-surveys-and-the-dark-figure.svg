<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><rect x='0' y='90' width='400' height='170' fill='#2FB5FF' fill-opacity='0.12'/><line x1='0' y1='90' x2='400' y2='90' stroke='#2FB5FF' stroke-width='2'/><polygon points='140,20 110,90 170,90' fill='#E8A93A' fill-opacity='0.5' stroke='#1D1A15'/><polygon points='110,90 170,90 230,220 50,220' fill='#7C5CFF' fill-opacity='0.25' stroke='#1D1A15'/><g font-family='sans-serif' font-size='12' fill='#1D1A15'><text x='190' y='40' font-weight='bold'>Police-recorded crime</text><text x='190' y='56'>(official statistics)</text><text x='8' y='84' font-size='11'>Visible</text><text x='8' y='106' font-size='11'>Hidden</text><text x='140' y='150' text-anchor='middle' font-weight='bold'>DARK FIGURE</text><text x='245' y='112' font-size='11'>Not reported to police:</text><text x='245' y='128' font-size='11'>trivial, fear, distrust,</text><text x='245' y='144' font-size='11'>embarrassment, no victim</text><text x='245' y='176' font-size='11'>Not recorded by police:</text><text x='245' y='192' font-size='11'>recording rules and</text><text x='245' y='208' font-size='11'>police discretion</text><text x='10' y='244' font-size='11'>CSEW and self-report surveys estimate the dark figure</text></g></svg>
