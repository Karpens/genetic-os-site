<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='200' y='22' font-size='14' font-weight='bold'>Planning an investigation</text><rect x='14' y='36' width='84' height='78' rx='6' fill='#E6F7EF' stroke='#0E9F5D'/><text x='56' y='52' font-weight='bold'>1 Aim</text><text x='56' y='68'>Purpose of</text><text x='56' y='83'>the study</text><rect x='110' y='36' width='84' height='78' rx='6' fill='#FFF4DC' stroke='#E8A93A'/><text x='152' y='52' font-weight='bold'>2 Hypotheses</text><text x='152' y='68'>H1 (directional</text><text x='152' y='83'>or not) and</text><text x='152' y='98'>null (H0)</text><rect x='206' y='36' width='84' height='78' rx='6' fill='#E3F5FF' stroke='#2FB5FF'/><text x='248' y='52' font-weight='bold'>3 Variables</text><text x='248' y='68'>IV and DV,</text><text x='248' y='83'>defined so</text><text x='248' y='98'>measurable</text><rect x='302' y='36' width='84' height='78' rx='6' fill='#FFE6EF' stroke='#FF5D8F'/><text x='344' y='52' font-weight='bold'>4 Design</text><text x='344' y='68'>Independent,</text><text x='344' y='83'>repeated or</text><text x='344' y='98'>matched pairs</text><rect x='302' y='150' width='84' height='78' rx='6' fill='#EEE9FF' stroke='#7C5CFF'/><text x='344' y='166' font-weight='bold'>5 Controls</text><text x='344' y='182'>Standardise,</text><text x='344' y='197'>randomise,</text><text x='344' y='212'>blind designs</text><rect x='206' y='150' width='84' height='78' rx='6' fill='#E6F7EF' stroke='#0E9F5D'/><text x='248' y='166' font-weight='bold'>6 Pilot study</text><text x='248' y='182'>Small trial</text><text x='248' y='197'>run to spot</text><text x='248' y='212'>problems</text><rect x='110' y='150' width='84' height='78' rx='6' fill='#FFF4DC' stroke='#E8A93A'/><text x='152' y='166' font-weight='bold'>7 Revise</text><text x='152' y='182'>Fix wording,</text><text x='152' y='197'>timing and</text><text x='152' y='212'>materials</text><rect x='14' y='150' width='84' height='78' rx='6' fill='#E3F5FF' stroke='#2FB5FF'/><text x='56' y='166' font-weight='bold'>8 Main study</text><text x='56' y='182'>Collect and</text><text x='56' y='197'>analyse data</text><g stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'><line x1='98' y1='75' x2='109' y2='75'/><line x1='194' y1='75' x2='205' y2='75'/><line x1='290' y1='75' x2='301' y2='75'/><line x1='344' y1='114' x2='344' y2='149'/><line x1='301' y1='189' x2='291' y2='189'/><line x1='205' y1='189' x2='195' y2='189'/><line x1='109' y1='189' x2='99' y2='189'/></g><text x='200' y='248'>A pilot can send you back to revise before the main study</text></g></svg>
