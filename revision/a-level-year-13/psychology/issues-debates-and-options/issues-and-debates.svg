<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 290'><rect width='460' height='290' fill='#fff'/><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='230' y='16' font-size='13' font-weight='bold'>Issues and debates: positions on a continuum</text><g fill='none' stroke-width='3'><path d='M130 58H330M138 54L130 58L138 62M322 54L330 58L322 62' stroke='#FF5D8F'/><path d='M130 96H330M138 92L130 96L138 100M322 92L330 96L322 100' stroke='#7C5CFF'/><path d='M130 134H330M138 130L130 134L138 138M322 130L330 134L322 138' stroke='#0E9F5D'/><path d='M130 172H330M138 168L130 172L138 176M322 168L330 172L322 176' stroke='#2FB5FF'/><path d='M130 210H330M138 206L130 210L138 214M322 206L330 210L322 214' stroke='#E8A93A'/></g><g text-anchor='end'><text x='122' y='62'>Alpha: exaggerates</text><text x='122' y='100'>Free will</text><text x='122' y='138'>Nature</text><text x='122' y='176'>Holism</text><text x='122' y='214'>Idiographic</text></g><g text-anchor='start'><text x='338' y='62'>Beta: minimises</text><text x='338' y='100'>Determinism</text><text x='338' y='138'>Nurture</text><text x='338' y='176'>Reductionism</text><text x='338' y='214'>Nomothetic</text></g><g font-weight='bold'><text x='230' y='52'>gender and culture bias</text><text x='230' y='90'>hard / soft determinism</text><text x='230' y='128'>interactionism, diathesis-stress</text><text x='230' y='166'>levels of explanation</text><text x='230' y='204'>individual vs general laws</text></g><text x='230' y='74'>androcentrism, ethnocentrism (imposed etic)</text><text x='230' y='112'>biological, environmental, psychic</text><text x='230' y='150'>epigenetics: environment alters gene expression</text><text x='230' y='188'>biological / environmental reductionism</text><text x='230' y='226'>case studies vs laws from samples</text><rect x='40' y='238' width='380' height='44' rx='6' fill='#FF5D8F' fill-opacity='.15' stroke='#FF5D8F' stroke-width='2'/><text x='230' y='255' font-weight='bold'>Ethical implications: socially sensitive research</text><text x='230' y='271'>can affect whole groups in society, not only participants</text></g></svg>
