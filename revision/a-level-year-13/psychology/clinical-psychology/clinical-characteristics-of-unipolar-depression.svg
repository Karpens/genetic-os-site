<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><g font-family='sans-serif' fill='#1D1A15'><text x='200' y='20' text-anchor='middle' font-size='14' font-weight='bold'>Unipolar depression: characteristics</text><text x='200' y='38' text-anchor='middle' font-size='11'>DSM-5 MDD: 5+ of 9 symptoms in the same 2 weeks</text><rect x='10' y='48' width='120' height='150' rx='6' fill='#FFE3EC' stroke='#FF5D8F'/><rect x='140' y='48' width='120' height='150' rx='6' fill='#DDF5E8' stroke='#0E9F5D'/><rect x='270' y='48' width='120' height='150' rx='6' fill='#DFF3FF' stroke='#2FB5FF'/><text x='70' y='68' text-anchor='middle' font-size='12' font-weight='bold'>Emotional</text><text x='200' y='68' text-anchor='middle' font-size='12' font-weight='bold'>Behavioural</text><text x='330' y='68' text-anchor='middle' font-size='12' font-weight='bold'>Cognitive</text><g font-size='11'><text x='18' y='90'>Low mood, sadness</text><text x='18' y='107'>Anhedonia</text><text x='18' y='124'>Worthlessness</text><text x='18' y='141'>Guilt</text><text x='18' y='158'>Irritability</text><text x='18' y='175'>Emptiness</text><text x='148' y='90'>Psychomotor change</text><text x='148' y='107'>Fatigue, low energy</text><text x='148' y='124'>Sleep disturbance</text><text x='148' y='141'>Appetite change</text><text x='148' y='158'>Social withdrawal</text><text x='148' y='175'>Self-harm risk</text><text x='278' y='90'>Poor concentration</text><text x='278' y='107'>Indecisiveness</text><text x='278' y='124'>Cognitive triad</text><text x='278' y='141'>Rumination</text><text x='278' y='158'>Hopelessness</text><text x='278' y='175'>Thoughts of death</text></g><rect x='10' y='208' width='380' height='44' rx='6' fill='#FFF3D9' stroke='#E8A93A'/><text x='200' y='226' text-anchor='middle' font-size='11'>Must include low mood OR loss of interest/pleasure</text><text x='200' y='242' text-anchor='middle' font-size='11'>Causes distress/impairment; no history of mania</text></g></svg>
