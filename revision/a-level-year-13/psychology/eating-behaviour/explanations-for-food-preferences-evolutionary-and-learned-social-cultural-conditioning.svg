<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='14' font-weight='bold' fill='#1D1A15'>Explanations of food preferences</text><rect x='10' y='36' width='150' height='214' rx='8' fill='#E6F6FF' stroke='#2FB5FF'/><text x='85' y='56' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Evolutionary</text><g font-family='sans-serif' font-size='11' fill='#1D1A15' text-anchor='middle'><text x='85' y='82'>Sweet and fatty foods</text><text x='85' y='96'>liked: energy-dense</text><text x='85' y='124'>Neophobia: avoids</text><text x='85' y='138'>novel, possibly toxic</text><text x='85' y='166'>Taste aversion (Garcia):</text><text x='85' y='180'>one trial, hours delay</text><text x='85' y='208'>Innate, shared by all</text><text x='85' y='222'>(adaptive in the EEA)</text></g><rect x='175' y='36' width='215' height='214' rx='8' fill='#E5F7EE' stroke='#0E9F5D'/><text x='282' y='56' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Learned</text><rect x='185' y='68' width='195' height='55' rx='6' fill='#fff' stroke='#0E9F5D'/><rect x='185' y='130' width='195' height='55' rx='6' fill='#fff' stroke='#0E9F5D'/><rect x='185' y='192' width='195' height='55' rx='6' fill='#fff' stroke='#0E9F5D'/><g font-family='sans-serif' font-size='11' fill='#1D1A15'><text x='195' y='86' font-weight='bold'>Social</text><text x='195' y='100'>Modelling of parents, peers</text><text x='195' y='114'>(Birch, 1980)</text><text x='195' y='148' font-weight='bold'>Cultural</text><text x='195' y='162'>Norms, availability, taboos</text><text x='195' y='176'>Early flavour exposure</text><text x='195' y='210' font-weight='bold'>Conditioning</text><text x='195' y='224'>Flavour-nutrient pairing</text><text x='195' y='238'>Reward / exposure (Birch)</text></g></svg>
