<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><rect width='400' height='260' fill='#FFFFFF'/><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>Learning theory: classical conditioning</text><text x='8' y='50' font-size='11' font-weight='bold'>1 Before</text><rect x='75' y='28' width='115' height='36' rx='6' fill='#E7F7EF' stroke='#0E9F5D'/><text x='132' y='50' text-anchor='middle'>Food (UCS)</text><line x1='190' y1='46' x2='250' y2='46' stroke='#1D1A15' stroke-width='1.5'/><polygon points='250,41 260,46 250,51' fill='#1D1A15'/><rect x='262' y='28' width='128' height='36' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='326' y='50' text-anchor='middle'>Pleasure (UCR)</text><text x='8' y='102' font-size='11' font-weight='bold'>2 During</text><rect x='75' y='76' width='115' height='44' rx='6' fill='#E7F7EF' stroke='#0E9F5D'/><text x='132' y='94' text-anchor='middle'>Food (UCS) +</text><text x='132' y='110' text-anchor='middle'>Caregiver (NS)</text><line x1='190' y1='98' x2='250' y2='98' stroke='#1D1A15' stroke-width='1.5'/><polygon points='250,93 260,98 250,103' fill='#1D1A15'/><rect x='262' y='80' width='128' height='36' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='326' y='102' text-anchor='middle'>Pleasure (UCR)</text><text x='8' y='158' font-size='11' font-weight='bold'>3 After</text><rect x='75' y='136' width='115' height='36' rx='6' fill='#E3F4FF' stroke='#2FB5FF'/><text x='132' y='158' text-anchor='middle'>Caregiver (CS)</text><line x1='190' y1='154' x2='250' y2='154' stroke='#1D1A15' stroke-width='1.5'/><polygon points='250,149 260,154 250,159' fill='#1D1A15'/><rect x='262' y='136' width='128' height='36' rx='6' fill='#FFE1EB' stroke='#FF5D8F'/><text x='326' y='158' text-anchor='middle'>Pleasure (CR)</text><rect x='10' y='186' width='380' height='66' rx='8' fill='#EEE9FF' stroke='#7C5CFF'/><text x='20' y='204' font-size='11' font-weight='bold'>Operant conditioning (drive reduction):</text><text x='20' y='220' font-size='11'>Hunger drive, crying, feeding reduces the drive</text><text x='20' y='236' font-size='11'>Caregiver = secondary reinforcer; attachment learned</text></svg>
