<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='12' fill='#1D1A15'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='18' text-anchor='middle' font-weight='bold' font-size='13'>Piaget: adaptation and equilibration</text><rect x='20' y='30' width='120' height='44' rx='6' fill='#E3F6EC' stroke='#0E9F5D'/><text x='80' y='49' text-anchor='middle'>Equilibrium</text><text x='80' y='65' text-anchor='middle' font-size='11'>(schema works)</text><rect x='260' y='30' width='120' height='44' rx='6' fill='#FFE3EC' stroke='#FF5D8F'/><text x='320' y='49' text-anchor='middle'>Disequilibrium</text><text x='320' y='65' text-anchor='middle' font-size='11'>(schema fails)</text><line x1='140' y1='52' x2='258' y2='52' stroke='#1D1A15' marker-end='url(#a)'/><text x='200' y='45' text-anchor='middle' font-size='11'>doesn't fit</text><line x1='80' y1='74' x2='80' y2='108' stroke='#1D1A15' marker-end='url(#a)'/><text x='88' y='95' font-size='11'>fits</text><rect x='20' y='110' width='130' height='44' rx='6' fill='#E6F6FF' stroke='#2FB5FF'/><text x='85' y='129' text-anchor='middle'>Assimilation</text><text x='85' y='145' text-anchor='middle' font-size='11'>fits old schema</text><line x1='320' y1='74' x2='320' y2='108' stroke='#1D1A15' marker-end='url(#a)'/><text x='328' y='95' font-size='11'>must adapt</text><rect x='250' y='110' width='130' height='44' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='315' y='129' text-anchor='middle'>Accommodation</text><text x='315' y='145' text-anchor='middle' font-size='11'>change/create schema</text><line x1='315' y1='154' x2='270' y2='188' stroke='#1D1A15' marker-end='url(#a)'/><rect x='110' y='190' width='180' height='44' rx='6' fill='#EEE8FF' stroke='#7C5CFF'/><text x='200' y='209' text-anchor='middle'>Equilibrium restored</text><text x='200' y='225' text-anchor='middle' font-size='11'>(adapted schema)</text><text x='200' y='253' text-anchor='middle' font-size='11'>Repeated cycles = cognitive development</text></svg>
