<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260' font-family='sans-serif' font-size='11' fill='#1D1A15'><rect width='400' height='260' fill='#fff'/><text x='200' y='16' text-anchor='middle' font-size='13' font-weight='bold'>FBI top-down profiling (deductive)</text><rect x='6' y='26' width='88' height='44' rx='5' fill='#E8F7EF' stroke='#0E9F5D'/><rect x='106' y='26' width='88' height='44' rx='5' fill='#E8F7EF' stroke='#0E9F5D'/><rect x='206' y='26' width='88' height='44' rx='5' fill='#E8F7EF' stroke='#0E9F5D'/><rect x='306' y='26' width='88' height='44' rx='5' fill='#E8F7EF' stroke='#0E9F5D'/><text x='50' y='44' text-anchor='middle'>1 Data</text><text x='50' y='58' text-anchor='middle'>assimilation</text><text x='150' y='44' text-anchor='middle'>2 Crime scene</text><text x='150' y='58' text-anchor='middle'>classification</text><text x='250' y='44' text-anchor='middle'>3 Crime</text><text x='250' y='58' text-anchor='middle'>reconstruction</text><text x='350' y='44' text-anchor='middle'>4 Profile</text><text x='350' y='58' text-anchor='middle'>generation</text><line x1='94' y1='48' x2='101' y2='48' stroke='#1D1A15'/><polygon points='106,48 100,44 100,52' fill='#1D1A15'/><line x1='194' y1='48' x2='201' y2='48' stroke='#1D1A15'/><polygon points='206,48 200,44 200,52' fill='#1D1A15'/><line x1='294' y1='48' x2='301' y2='48' stroke='#1D1A15'/><polygon points='306,48 300,44 300,52' fill='#1D1A15'/><line x1='150' y1='70' x2='150' y2='84' stroke='#1D1A15'/><line x1='100' y1='84' x2='300' y2='84' stroke='#1D1A15'/><line x1='100' y1='84' x2='100' y2='94' stroke='#1D1A15'/><polygon points='100,99 96,92 104,92' fill='#1D1A15'/><line x1='300' y1='84' x2='300' y2='94' stroke='#1D1A15'/><polygon points='300,99 296,92 304,92' fill='#1D1A15'/><text x='158' y='81' font-size='10'>classified as:</text><rect x='6' y='100' width='188' height='152' rx='6' fill='#E8F7EF' stroke='#0E9F5D' stroke-width='1.5'/><text x='14' y='118' font-weight='bold'>ORGANISED</text><text x='14' y='1