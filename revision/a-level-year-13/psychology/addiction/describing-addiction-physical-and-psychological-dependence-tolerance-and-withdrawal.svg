<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 260'><defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1D1A15'/></marker></defs><rect width='400' height='260' fill='#fff'/><text x='200' y='20' text-anchor='middle' font-family='sans-serif' font-size='13' font-weight='bold' fill='#1D1A15'>Cycle of dependence</text><rect x='15' y='40' width='160' height='50' rx='6' fill='#E3F6EC' stroke='#0E9F5D'/><text x='95' y='61' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>1. Repeated drug use</text><text x='95' y='77' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>(brain adapts)</text><rect x='225' y='40' width='160' height='50' rx='6' fill='#FFF3DC' stroke='#E8A93A'/><text x='305' y='61' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>2. Tolerance</text><text x='305' y='77' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>more needed for effect</text><rect x='225' y='160' width='160' height='50' rx='6' fill='#FFE8F0' stroke='#FF5D8F'/><text x='305' y='181' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>3. Dependence</text><text x='305' y='197' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>body and mind adapted</text><rect x='15' y='160' width='160' height='50' rx='6' fill='#EFEAFF' stroke='#7C5CFF'/><text x='95' y='181' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>4. Use stops: withdrawal</text><text x='95' y='197' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>shakes, anxiety, craving</text><line x1='175' y1='65' x2='223' y2='65' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='305' y1='90' x2='305' y2='158' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='225' y1='185' x2='177' y2='185' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><line x1='95' y1='160' x2='95' y2='92' stroke='#1D1A15' stroke-width='1.5' marker-end='url(#a)'/><text x='200' y='122' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Tolerance + withdrawal</text><text x='200' y='138' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>= physical dependence</text><text x='200' y='154' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Craving = psychological</text><text x='200' y='238' text-anchor='middle' font-family='sans-serif' font-size='11' fill='#1D1A15'>Reusing to escape withdrawal = negative reinforcement</text></svg>
