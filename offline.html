<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Marks · Offline</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#F7F8FC;--paper:#FFFFFF;--ink:#1B2236;--muted:#5D667A;--stain:#4361EE}
@media (prefers-color-scheme: dark){:root{--bg:#141A2C;--paper:#1C2439;--ink:#E9EDF6;--muted:#A3ACC0;--stain:#7B93FF}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
.card{max-width:360px;background:var(--paper);border-radius:20px;padding:32px 24px;box-shadow:0 8px 24px -14px rgba(27,34,54,.25)}
svg{width:48px;height:48px}
h1{font-size:22px;margin:14px 0 6px}
p{color:var(--muted);margin:0 0 20px}
button{font:700 15px system-ui,sans-serif;color:#fff;background:var(--stain);border:0;border-radius:12px;padding:12px 22px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
  <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#4361EE"/><path d="M7 12.3l3.2 3.2L17.5 8" stroke="#fff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  <h1>You're offline</h1>
  <p>Full Marks needs an internet connection. Connect and try again.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
